/* ── Simple frame animator ── */
class Anim {
  constructor(img, frames, fps=7){ this.img=img; this.fps=fps; this._t=0; this._f=0; this._frames=frames; }
  set(frames,fps=7){
    if(this._frames===frames) return;
    this._frames=frames; this.fps=fps; this._f=0; this._t=0; this._show();
  }
  update(dt){
    if(!this._frames||this._frames.length<2) return;
    this._t+=dt;
    if(this._t>=1000/this.fps){ this._t=0; this._f=(this._f+1)%this._frames.length; this._show(); }
  }
  _show(){
    const k=this._frames[this._f];
    if(this.img.scene&&this.img.scene.textures.exists(k)) this.img.setTexture(k);
  }
}

class MenuScene extends Phaser.Scene {
  constructor(){ super({key:'Menu'}); }
  create(){
    this.cameras.main.setBackgroundColor('#1a0a00');
    this.add.image(W/2,H/2,'portada').setDisplaySize(W,H).setAlpha(.9);
    const ov=this.add.graphics();
    ov.fillGradientStyle(0,0,0,0,0,0,0,0.55); ov.fillRect(0,H*.58,W,H*.42);

    const bn=this.add.graphics();
    bn.fillStyle(0xffffff,.93); bn.fillRoundedRect(W/2-210,12,420,62,8);
    bn.lineStyle(2,0xb89a6a,1); bn.strokeRoundedRect(W/2-210,12,420,62,8);
    this.add.text(W/2,26,'La Boda de Cris y José',{fontFamily:'Cinzel',fontSize:'22px',color:'#3d1f00',fontStyle:'italic'}).setOrigin(.5,0);
    this.add.text(W/2,54,'03.10.2026',{fontFamily:'Cinzel',fontSize:'13px',color:'#b89a6a'}).setOrigin(.5,0);

    /* Character preview */
    const prev=[
      {k:'novios_idle01',scale:.55,yo:-8},
      {k:'vale_idle-Stand01',scale:.42,yo:0},
      {k:'iker_idle01',scale:.5,yo:4},
      {k:'finch_idle01',scale:.5,yo:4},
      {k:'pilly_idle01',scale:.5,yo:4},
    ];
    prev.forEach(({k,scale,yo},i)=>{
      if(!this.textures.exists(k)) return;
      this.add.image(W/2+(i-2)*90, H-112+yo, k).setScale(scale).setAlpha(.88).setOrigin(.5,1);
    });

    /* Play button */
    const pb=this.add.graphics();
    pb.fillStyle(0x2c1a00,.9); pb.fillRoundedRect(W/2-130,H-66,260,42,6);
    pb.lineStyle(2,0xb89a6a,1); pb.strokeRoundedRect(W/2-130,H-66,260,42,6);
    const pt=this.add.text(W/2,H-45,'▶  JUGAR',{fontFamily:'Cinzel',fontSize:'18px',color:'#f5d87a',fontStyle:'bold'}).setOrigin(.5);
    this.tweens.add({targets:pt,alpha:{from:.72,to:1},duration:920,yoyo:true,repeat:-1});

    const hz=this.add.zone(W/2,H-45,260,42).setInteractive();
    hz.on('pointerover',()=>{ pb.clear(); pb.fillStyle(0xb89a6a,.9); pb.fillRoundedRect(W/2-130,H-66,260,42,6); pt.setColor('#fff'); });
    hz.on('pointerout', ()=>{ pb.clear(); pb.fillStyle(0x2c1a00,.9); pb.fillRoundedRect(W/2-130,H-66,260,42,6); pb.lineStyle(2,0xb89a6a,1); pb.strokeRoundedRect(W/2-130,H-66,260,42,6); pt.setColor('#f5d87a'); });
    hz.on('pointerdown',()=>this.scene.start('Game'));

    const sc=JSON.parse(localStorage.getItem('boda_scores')||'[]');
    if(sc.length) this.add.text(W-10,H-8,`🏆 ${sc[0].score} pts`,{fontFamily:'Lato',fontSize:'11px',color:'#f5d87a'}).setOrigin(1,1);
    this.add.text(W/2,H-8,'ESPACIO / TAP = SALTAR  ·  TAP ANIMALES = BONUS',{fontFamily:'Lato',fontSize:'9px',color:'rgba(255,255,255,.38)'}).setOrigin(.5,1);

    this.input.keyboard.on('keydown-SPACE',()=>this.scene.start('Game'));
    this.input.on('pointerdown',p=>{ if(p.y>H*.55) this.scene.start('Game'); });
  }
}

class GameScene extends Phaser.Scene {
  constructor(){ super({key:'Game'}); }

  init(){
    this.score=0; this.distance=0; this.speed=SPEEDS.initial;
    this.isGrounded=true; this.coupleVelY=0; this._jc=0;
    this.shielded=false; this.boosted=false;
    this.shieldT=0; this.boostT=0; this.spawnT=0;
    this.elapsed=0; this.victoryStarted=false; this._hit=false;
    this._valeDir=-42; this._audioCtx=null;
  }

  create(){
    /* World */
    this.bgFar  =this.add.tileSprite(0,0,W,120,'bg_far').setOrigin(0,0).setDepth(0);
    this.bgMid  =this.add.tileSprite(0,80,W,160,'bg_mid').setOrigin(0,0).setDepth(1);
    this.bgNear =this.add.tileSprite(0,220,W,50,'bg_near').setOrigin(0,0).setDepth(2);
    this.gndTile=this.add.tileSprite(0,GROUND_Y,W,70,'ground_tile').setOrigin(0,0).setDepth(3);

    /* Couple */
    this.coupleImg=this.add.image(120,GROUND_Y,'novios_running01').setOrigin(.5,1).setScale(.72).setDepth(10);
    this.coupleAnim=new Anim(this.coupleImg,ANIMS.novios.run,7);
    this.shadow=this.add.ellipse(120,GROUND_Y+4,80,12,0,0.18).setDepth(3);

    /* Vale */
    this.valeImg=this.add.image(W+80,GROUND_Y,'vale_idle-Cel01').setOrigin(.5,1).setScale(.78).setDepth(8);
    this.valeAnim=new Anim(this.valeImg,ANIMS.vale.idle,3);

    /* Groups */
    this.items=this.add.group();
    this.cats =this.add.group();

    /* HUD */
    this.add.graphics().setDepth(50).fillStyle(0,0.45).fillRect(0,0,W,46);
    this.scoreTxt=this.add.text(12,8,'PUNTOS  0',{fontFamily:'Cinzel',fontSize:'13px',color:'#f5d87a'}).setDepth(51);
    this.distTxt =this.add.text(W/2,8,'0 m',{fontFamily:'Cinzel',fontSize:'13px',color:'#fff'}).setOrigin(.5,0).setDepth(51);
    this.timeTxt =this.add.text(W-12,8,'0:00',{fontFamily:'Cinzel',fontSize:'13px',color:'#aaddff'}).setOrigin(1,0).setDepth(51);
    this.add.graphics().setDepth(51).lineStyle(1,0x444400,1).strokeRect(W/2-150,30,300,10);
    this.add.graphics().setDepth(52).fillStyle(0xffd700,1).fillCircle(W/2+150,35,6);
    this.progBar=this.add.graphics().setDepth(52);
    this.shTxt=this.add.text(12,30,'',{fontFamily:'Lato',fontSize:'11px',color:'#44aaff'}).setDepth(52);
    this.bsTxt=this.add.text(110,30,'',{fontFamily:'Lato',fontSize:'11px',color:'#ffaa00'}).setDepth(52);

    /* Input */
    this.input.keyboard.on('keydown-SPACE',()=>this._jump());
    this.input.keyboard.on('keydown-UP',   ()=>this._jump());
    this.input.on('pointerdown',p=>{ if(p.y>50) this._jump(); });
  }

  _jump(){
    if(this.victoryStarted) return;
    if(this._jc>=2) return;
    this.coupleVelY=-510; this._jc++; this.isGrounded=false;
    this.coupleAnim.set(ANIMS.novios.jump,6);
    this._tone(440,.08,'square');
    this._burst();
  }

  update(_t,dt){
    if(this.victoryStarted) return;
    const dts=dt/1000;
    const spd=this.boosted?this.speed*1.4:this.speed;

    this.distance+=spd*dts*.05;
    this.score+=Math.round(spd*dts*.28);
    this.speed=Math.min(this.speed+SPEEDS.accelPerSec*dts,SPEEDS.max);

    if(this.distance>=GOAL_DIST){ this._victory(); return; }

    /* Parallax */
    
    /* Themes */
    const expectedTheme = Math.floor(this.distance / (GOAL_DIST / this.themes.length));
    const nextThemeIndex = Math.min(expectedTheme, this.themes.length - 1);
    if(nextThemeIndex > this.currentThemeIndex) {
        this.currentThemeIndex = nextThemeIndex;
        this.bgFar.setTexture(`bg_${this.themes[nextThemeIndex]}_far`);
        this.bgMid.setTexture(`bg_${this.themes[nextThemeIndex]}_mid`);
        this.gndTile.setTexture(`floor_${this.themes[nextThemeIndex]}`);
    }

    this.bgFar.tilePositionX +=spd*.08*dts;
    this.bgMid.tilePositionX +=spd*.25*dts;
        this.gndTile.tilePositionX+=spd*dts;

    /* Physics */
    if(!this.isGrounded){
      this.coupleVelY+=1380*dts;
      this.coupleImg.y+=this.coupleVelY*dts;
    }
    if(this.coupleImg.y>=GROUND_Y){
      this.coupleImg.y=GROUND_Y; this.coupleVelY=0;
      if(!this.isGrounded){ this.isGrounded=true; this._jc=0; this.coupleAnim.set(ANIMS.novios.run,7); }
    }
    const pct=Math.max(0,1-(GROUND_Y-this.coupleImg.y)/180);
    this.shadow.setScale(pct,1).setAlpha(.18*pct).setPosition(this.coupleImg.x,GROUND_Y+4);

    /* Vale */
    this.valeImg.x+=this._valeDir*dts;
    if(this.valeImg.x<220) this._valeDir=Math.abs(this._valeDir);
    if(this.valeImg.x>720) this._valeDir=-Math.abs(this._valeDir);
    this.valeAnim.update(dt);
    this.coupleAnim.update(dt);

    /* Spawn */
    this.spawnT+=dt;
    const interval=Math.max(1100,2600-this.distance*.5);
    if(this.spawnT>interval){ this.spawnT=0; Math.random()<.55?this._spawnItem():this._spawnCat(); }

    /* Move objects */
    this.items.getChildren().forEach(o=>{ o.x-=spd*dts; if(o.x<-70) o.destroy(); });
    this.cats.getChildren().forEach(c=>{ c.x-=spd*.55*dts; if(c.catAnim) c.catAnim.update(dt); if(c.x<-90) c.destroy(); });

    /* HUD */
    this.elapsed+=dts;
    const m=Math.floor(this.elapsed/60), s=Math.floor(this.elapsed%60).toString().padStart(2,'0');
    this.scoreTxt.setText(`PUNTOS  ${this.score}`);
    this.distTxt.setText(`${Math.floor(this.distance)} m`);
    this.timeTxt.setText(`${m}:${s}`);
    const prog=Math.min(this.distance/GOAL_DIST,1);
    this.progBar.clear(); this.progBar.fillStyle(0xb89a6a,1).fillRect(W/2-150,30,300*prog,10);
    if(this.shielded){ this.shieldT-=dt; this.shTxt.setText(`🛡 ${(this.shieldT/1000).toFixed(1)}s`); if(this.shieldT<=0){this.shielded=false;this.shTxt.setText('');} }
    if(this.boosted){  this.boostT-=dt;  this.bsTxt.setText(`⚡ ${(this.boostT/1000).toFixed(1)}s`);  if(this.boostT<=0){this.boosted=false;this.bsTxt.setText('');} }

    /* Collisions */
    this._collide();
  }

  
  _spawnItem(){
    const ptsTypes=['points_01','points_02','points_03','points_04'];
    const blockerMoneyTypes=['blocker_money_01','blocker_money_02','blocker_money_03','blocker_money-04'];
    const blockerLifeTypes=['blocker_life-01','blocker_life-02','blocker_life-03'];
    const powerupTypes=['booster','life','shield'];
    
    let type = '';
    let category = '';
    let r = Math.random();
    if(r < 0.5) {
        type = Phaser.Utils.Array.GetRandom(ptsTypes); category = 'points';
    } else if(r < 0.7) {
        type = Phaser.Utils.Array.GetRandom(blockerMoneyTypes); category = 'block_money';
    } else if(r < 0.9) {
        type = Phaser.Utils.Array.GetRandom(blockerLifeTypes); category = 'block_life';
    } else {
        type = Phaser.Utils.Array.GetRandom(powerupTypes); category = 'powerup';
    }
    
    const y=Math.random()<.65?GROUND_Y-20:GROUND_Y-78-Math.random()*48;
    const o=this.add.image(W+42,y,type).setDepth(7);
    o.itemType=type; o.category=category; this.items.add(o);
  }

  _spawnCat(){
    const defs=[
      {key:'iker', effect:'shield'},
      {key:'finch',effect:'points'},
      {key:'pilly',effect:'boost'},
    ];
    const d=Phaser.Utils.Array.GetRandom(defs);
    const frames=Math.random()<.35?ANIMS[d.key].sleep:ANIMS[d.key].walk;
    const c=this.add.image(W+64,GROUND_Y,frames[0]).setOrigin(.5,1).setScale(.82).setDepth(9);
    c.catKey=d.key; c.catEffect=d.effect;
    c.catAnim=new Anim(c,frames,5);
    c.setInteractive();
    c.on('pointerdown',()=>this._pet(c));
    this.cats.add(c);
  }

  _pet(c){
    if(c._done) return; c._done=true; c.disableInteractive();
    c.catAnim.set(ANIMS[c.catKey].happy,8);
    switch(c.catEffect){
      case 'shield': this.shielded=true; this.shieldT=3000; this._popup(c.x,c.y,'🛡 ¡ESCUDO IKER!',0x44aaff); this._chime(); break;
      case 'points': this.score+=500; this._popup(c.x,c.y,'💛 +500 AMOR FINCH',0xf5d87a); this._chime(); break;
      case 'boost':  this.boosted=true; this.boostT=5000; this.speed=Math.min(this.speed*1.45,SPEEDS.max); this._popup(c.x,c.y,'⚡ ¡PILLY BOOST!',0xffaa00); this._tone(660,.2,'square'); break;
    }
    this.tweens.add({targets:c,y:c.y-30,alpha:0,duration:680,onComplete:()=>c.destroy()});
  }
  _collide(){
    if(this.victoryStarted) return;
    const cx=this.coupleImg.x, cy=this.coupleImg.y;
    this.items.getChildren().forEach(item=>{
      const dx=item.x-cx,dy=item.y-cy;
      if(Math.sqrt(dx*dx+dy*dy)<56){
        if(item.category === 'points'){
             const pts={points_01:100,points_02:200,points_03:300,points_04:150};
             const cols={points_01:0xff8844,points_02:0xffdd44,points_03:0x44cc44,points_04:0xff88cc};
             this.score+=pts[item.itemType]||100;
             this._popup(item.x,item.y,`+${pts[item.itemType]||100}`,cols[item.itemType]||0xffffff);
             this._chime();
        } else if(item.category === 'block_money'){
             if(!this.shielded){
                 this.score=Math.max(0, this.score - 200);
                 this._popup(item.x,item.y,`-200 RESTA DINERO`,0xff4444);
                 this._tone(120,.25,'sawtooth');
                 this._hitEffect();
             } else {
                 this._popup(item.x,item.y,`BLOCKED!`,0x44aaff);
             }
        } else if(item.category === 'block_life'){
             if(!this.shielded){
                  this.lives--;
                  this._popup(item.x,item.y,`-1 VIDA`,0xff4444);
                  this.updateLives();
                  if(this.lives <= 0) {
                      this._gameOver(); return;
                  }
                  this._tone(120,.25,'sawtooth');
                  this._hitEffect();
             } else {
                 this._popup(item.x,item.y,`BLOCKED!`,0x44aaff);
             }
        } else if(item.category === 'powerup'){
             if(item.itemType === 'life') {
                  this.lives = Math.min(this.lives + 1, 5);
                  this.updateLives();
                  this._popup(item.x,item.y,`+1 VIDA`,0xff4444);
                  this._chime();
             } else if(item.itemType === 'shield') {
                  this.shielded=true; this.shieldT=5000; this._popup(item.x,item.y,'🛡 ¡ESCUDO!',0x44aaff); this._chime();
             } else if(item.itemType === 'booster') {
                  this.boosted=true; this.boostT=5000; this.speed=Math.min(this.speed*1.45,SPEEDS.max); this._popup(item.x,item.y,'⚡ ¡BOOST!',0xffaa00); this._tone(660,.2,'square');
             }
        }
        item.destroy();
      }
    });
    if(this.valeImg&&!this._hit){
      const dx=Math.abs(this.valeImg.x-cx);
      if(dx<54&&!this.shielded){
        const coupleTop=cy-this.coupleImg.displayHeight;
        const valeTop=this.valeImg.y-this.valeImg.displayHeight;
        if(coupleTop>valeTop+52) this._hitVale();
      }
    }
  }

  updateLives(){
     let h = '';
     for(let i=0; i<this.lives; i++) h += '❤️';
     this.livesTxt.setText(h);
  }

  _hitEffect(){
    this.coupleVelY=-275; this.isGrounded=false;
    this.coupleAnim.set(ANIMS.novios.hit,4);
    this.cameras.main.shake(150,.01);
    this.cameras.main.flash(100,255,50,50);
  }

  _gameOver(){
     this.victoryStarted = true;
     this.speed = 0;
     this.time.delayedCall(1500,()=>this.scene.start('Menu')); // simplistic game over
  }


  _hitVale(){
    this._hit=true;
    this.score=Math.max(0,this.score-200);
    this.coupleVelY=-275; this.isGrounded=false;
    this.coupleAnim.set(ANIMS.novios.hit,4);
    this.valeAnim.set(ANIMS.vale.angry,5);
    this._popup(this.coupleImg.x,this.coupleImg.y,'-200  😤 ¡VALE ENOJADA!',0xff4444);
    this._tone(120,.25,'sawtooth');
    this.cameras.main.shake(230,.01);
    this.cameras.main.flash(175,255,50,50);
    this.time.delayedCall(1800,()=>{ this._hit=false; this.valeAnim.set(ANIMS.vale.idle,3); });
  }

  _popup(x,y,msg,col){
    const t=this.add.text(Math.min(x,W-22),y-30,msg,{
      fontFamily:'Lato',fontSize:'12px',fontStyle:'bold',
      color:'#'+col.toString(16).padStart(6,'0'),stroke:'#000',strokeThickness:3
    }).setOrigin(.5,1).setDepth(60);
    this.tweens.add({targets:t,y:t.y-38,alpha:0,duration:1100,onComplete:()=>t.destroy()});
  }

  _victory(){
    this.victoryStarted=true; this.speed=0;
    this.valeAnim.set(ANIMS.vale.happy,5);
    this.tweens.add({
      targets:[this.bgFar,this.bgMid,this.gndTile],alpha:0,duration:1000,
      onComplete:()=>{
        this.add.image(W/2,H/2,'win_church_background').setDisplaySize(W,H).setDepth(4);
        this.add.image(W/2,H/2,'win_church_people').setDisplaySize(W,H).setDepth(5);
        this.add.image(W/2,H/2,'win_floor_church').setDisplaySize(W,H).setDepth(5);
        this.tweens.add({targets:this.coupleImg,x:W/2-18,duration:2400,ease:'Sine.Out',
          onComplete:()=>{
            this.coupleAnim.set(ANIMS.novios.kiss,5);
            this._chime();
            const bonus=Math.max(0,Math.floor(5000-this.elapsed*10));
            this.score+=bonus;
            const prev=JSON.parse(localStorage.getItem('boda_scores')||'[]');
            prev.unshift({score:this.score,time:Math.round(this.elapsed),date:new Date().toLocaleDateString('es-MX')});
            prev.sort((a,b)=>b.score-a.score);
            localStorage.setItem('boda_scores',JSON.stringify(prev.slice(0,10)));
            this._confetti();
            this.time.delayedCall(3000,()=>this.scene.start('Victory',{score:this.score,elapsed:this.elapsed}));
          }
        });
      }
    });
  }


  _confetti(){
    const cols=[0xffd700,0xff6699,0x44aaff,0xff8844,0x44cc88,0xcc44ff];
    for(let i=0;i<50;i++) this.time.delayedCall(i*70,()=>{
      const r=this.add.rectangle(Phaser.Math.Between(80,W-80),Phaser.Math.Between(20,H-20),8,8,Phaser.Utils.Array.GetRandom(cols)).setDepth(70);
      this.tweens.add({targets:r,y:r.y+50,alpha:0,angle:Phaser.Math.Between(-180,180),duration:1300,onComplete:()=>r.destroy()});
    });
  }

  _burst(){
    for(let i=0;i<6;i++){
      const r=this.add.rectangle(this.coupleImg.x+Phaser.Math.Between(-20,20),this.coupleImg.y,6,6,Phaser.Utils.Array.GetRandom([0xffd700,0xff6699,0x44aaff])).setDepth(15);
      this.tweens.add({targets:r,y:r.y+30,alpha:0,duration:400,onComplete:()=>r.destroy()});
    }
  }

  _tone(f,d=.1,t='sine',v=.14){
    try{
      if(!this._audioCtx) this._audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      const o=this._audioCtx.createOscillator(),g=this._audioCtx.createGain();
      o.connect(g);g.connect(this._audioCtx.destination);
      o.type=t;o.frequency.value=f;
      g.gain.setValueAtTime(v,this._audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,this._audioCtx.currentTime+d);
      o.start();o.stop(this._audioCtx.currentTime+d);
    }catch(e){}
  }
  _chime(){ [523,659,784].forEach((f,i)=>setTimeout(()=>this._tone(f,.14,'sine'),i*110)); }
}

/* ═══════════════════════════════════════════════════════════════════
   VICTORY SCENE
═══════════════════════════════════════════════════════════════════ */
class VictoryScene extends Phaser.Scene {
  constructor(){ super({key:'Victory'}); }
  init(d){ this.finalScore=d.score||0; this.elapsed=d.elapsed||0; }

  create(){
    this.cameras.main.setBackgroundColor('#0a0a1a');
    for(let i=0;i<60;i++) this.add.circle(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),Phaser.Math.Between(1,3),0xffffff,Phaser.Math.FloatBetween(.2,.9));

    const p=this.add.graphics();
    p.fillStyle(0x1a0e00,.96); p.fillRoundedRect(W/2-260,28,520,H-56,12);
    p.lineStyle(2,0xb89a6a,1); p.strokeRoundedRect(W/2-260,28,520,H-56,12);

    this.add.text(W/2,44,'✦  ¡VIVAN LOS NOVIOS!  ✦',{fontFamily:'Cinzel',fontSize:'13px',color:'#f5d87a',letterSpacing:2}).setOrigin(.5);
    this.add.text(W/2,66,'La Boda de Cris y José',{fontFamily:'Cinzel',fontSize:'19px',color:'#fff',fontStyle:'italic'}).setOrigin(.5);

    const wk=this.textures.exists('novios_win01')?'novios_win01':'novios_kiss01';
    this.add.image(W/2,108,wk).setDisplaySize(108,96);

    const m=Math.floor(this.elapsed/60),s=Math.floor(this.elapsed%60).toString().padStart(2,'0');
    this.add.text(W/2,152,`${this.finalScore}`,{fontFamily:'Cinzel',fontSize:'44px',color:'#f5d87a',fontStyle:'bold'}).setOrigin(.5);
    this.add.text(W/2,196,'PUNTOS',{fontFamily:'Lato',fontSize:'11px',color:'rgba(255,255,255,.4)',letterSpacing:4}).setOrigin(.5);
    this.add.text(W/2,213,`Tiempo: ${m}:${s}`,{fontFamily:'Lato',fontSize:'11px',color:'#aaddff'}).setOrigin(.5);

    this.add.text(W/2,232,'— TABLA DE LÍDERES —',{fontFamily:'Cinzel',fontSize:'10px',color:'#b89a6a',letterSpacing:3}).setOrigin(.5);
    const sc=JSON.parse(localStorage.getItem('boda_scores')||'[]').slice(0,5);
    if(!sc.length) this.add.text(W/2,260,'(sin récords aún)',{fontFamily:'Lato',fontSize:'11px',color:'rgba(255,255,255,.3)'}).setOrigin(.5);
    sc.forEach((s,i)=>{
      const y=250+i*21;
      const isMe=i===0&&s.score===this.finalScore;
      this.add.text(W/2-130,y,`${'🥇🥈🥉  4  5'.split('').slice(i*2,i*2+2).join('')}  ${s.score} pts`,{fontFamily:'Lato',fontSize:'12px',color:isMe?'#f5d87a':'rgba(255,255,255,.6)',fontStyle:isMe?'bold':''});
      this.add.text(W/2+55,y,`${s.time}s · ${s.date}`,{fontFamily:'Lato',fontSize:'10px',color:'rgba(255,255,255,.35)'});
    });

    this._btn(W/2-108,H-66,190,'▶ JUGAR DE NUEVO',()=>this.scene.start('Game'));
    this._btn(W/2+100,H-66,148,'← MENÚ',()=>this.scene.start('Menu'));

    const cols=[0xffd700,0xff6699,0x44aaff,0xff8844];
    for(let i=0;i<50;i++){
      const r=this.add.rectangle(Phaser.Math.Between(0,W),Phaser.Math.Between(-20,0),Phaser.Math.Between(4,10),Phaser.Math.Between(4,10),Phaser.Utils.Array.GetRandom(cols));
      this.tweens.add({targets:r,y:H+20,angle:Phaser.Math.Between(-360,360),duration:Phaser.Math.Between(2000,5000),delay:Phaser.Math.Between(0,2000),repeat:-1});
    }
  }

  _btn(x,y,w,label,cb){
    const g=this.add.graphics();
    g.fillStyle(0xb89a6a,.15);g.fillRoundedRect(x-w/2,y-15,w,30,6);
    g.lineStyle(1.5,0xb89a6a,1);g.strokeRoundedRect(x-w/2,y-15,w,30,6);
    const t=this.add.text(x,y,label,{fontFamily:'Cinzel',fontSize:'11px',color:'#f5d87a'}).setOrigin(.5);
    t.setInteractive(new Phaser.Geom.Rectangle(-w/2,-15,w,30),Phaser.Geom.Rectangle.Contains)
      .on('pointerover',()=>{g.clear();g.fillStyle(0xb89a6a,.5);g.fillRoundedRect(x-w/2,y-15,w,30,6);t.setColor('#fff');})
      .on('pointerout', ()=>{g.clear();g.fillStyle(0xb89a6a,.15);g.fillRoundedRect(x-w/2,y-15,w,30,6);g.lineStyle(1.5,0xb89a6a,1);g.strokeRoundedRect(x-w/2,y-15,w,30,6);t.setColor('#f5d87a');})
      .on('pointerdown',cb);
  }
}
