/* ════════════════════════════════════════════════════
   FRAME ANIMATOR
════════════════════════════════════════════════════ */
class FrameAnim {
  constructor(img, frames, fps = 7) {
    this._img = img; this._fps = fps; this._t = 0; this._f = 0; this._frames = frames;
    this._show();
  }
  set(frames, fps = 7) {
    if (this._frames === frames) return;
    this._frames = frames; this._fps = fps; this._f = 0; this._t = 0; this._show();
  }
  update(dt) {
    if (!this._frames || this._frames.length < 2) return;
    this._t += dt;
    if (this._t >= 1000 / this._fps) {
      this._t -= 1000 / this._fps;
      this._f = (this._f + 1) % this._frames.length;
      this._show();
    }
  }
  _show() {
    const k = this._frames[this._f];
    if (this._img?.scene?.textures?.exists(k)) this._img.setTexture(k);
  }
}

/* ════════════════════════════════════════════════════
   AUDIO  (Web Audio — no files needed)
════════════════════════════════════════════════════ */
let _ac = null;
const AC = () => { if (!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)(); return _ac; };
const tone = (f, d=0.1, type='sine', v=0.12) => {
  try { const ac=AC(),o=ac.createOscillator(),g=ac.createGain(); o.connect(g); g.connect(ac.destination);
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d); o.start(); o.stop(ac.currentTime+d); } catch(_){}
};
const sfxJump    = () => tone(440,0.08,'square',0.1);
const sfxCollect = () => [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.1),i*80));
const sfxHit     = () => tone(130,0.28,'sawtooth',0.14);
const sfxPower   = () => [440,550,660].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle'),i*55));
const sfxWin     = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.22),i*120));
const sfxClick   = () => tone(800,0.05,'sine',0.09);

class NameEntryScene extends Phaser.Scene {
  constructor() { super({ key:'NameEntry' }); }

  create() {
    this.cameras.main.setBackgroundColor('#0a0510');
    /* subtle portada bg */
    if (this.textures.exists('portada')) {
      const img=this.add.image(W/2,H/2,'portada').setAlpha(0.15);
      const src=this.textures.get('portada').getSourceImage();
      if(src?.width&&src?.height) img.setScale(Math.max(W/src.width,H/src.height));
    }

    this.add.text(W/2,70,'Tu nombre',{fontFamily:'Cinzel',fontSize:'22px',color:'#f5e8c0',fontStyle:'italic'}).setOrigin(0.5);
    this.add.text(W/2,98,'Para la tabla de honor de la boda',{fontFamily:'Lato',fontSize:'12px',color:'rgba(184,154,106,.65)'}).setOrigin(0.5);

    const boxG=this.add.graphics();
    boxG.fillStyle(0x1a0e00,0.9); boxG.fillRoundedRect(W/2-170,120,340,52,8);
    boxG.lineStyle(2,0xb89a6a,0.8); boxG.strokeRoundedRect(W/2-170,120,340,52,8);
    this._nameTxt=this.add.text(W/2,146,'',{fontFamily:'Lato',fontSize:'20px',color:'#ffffff',fontStyle:'bold'}).setOrigin(0.5);
    this._cursor=this.add.text(0,146,'|',{fontFamily:'Lato',fontSize:'20px',color:'#f5d87a'}).setOrigin(0,0.5);
    this.tweens.add({targets:this._cursor,alpha:0,duration:480,yoyo:true,repeat:-1});

    this._name = STATE.playerName==='Invitado' ? '' : STATE.playerName;
    this._updateDisplay();

    this.input.keyboard.on('keydown',(e)=>{
      if(e.keyCode===8 && this._name.length) this._name=this._name.slice(0,-1);
      else if(e.keyCode===13) { this._go(); return; }
      else if(e.key.length===1 && this._name.length<16) this._name+=e.key;
      this._updateDisplay();
    });

    /* Level selector dots */
    this.add.text(W/2,230,'Comenzar en nivel:',{fontFamily:'Cinzel',fontSize:'13px',color:'#b89a6a',letterSpacing:1}).setOrigin(0.5);
    this._selLevel=STATE.level||1;
    this._lvDots=[];
    LEVELS.forEach((lv,i)=>{
      const cx=W/2-(LEVELS.length-1)*36/2+i*36;
      const dot=this.add.graphics();
      this._lvDots.push({dot,lv});
      this._drawDot(i);
      const z=this.add.zone(cx,260,34,34).setInteractive();
      z.on('pointerdown',()=>{ sfxClick(); this._selLevel=lv.id; this._lvDots.forEach((_,j)=>this._drawDot(j)); });
    });

    this.add.text(W/2,310,'← → MOVER    ESPACIO/↑ SALTAR',{fontFamily:'Cinzel',fontSize:'10px',color:'rgba(184,154,106,.5)',letterSpacing:2}).setOrigin(0.5);
    this.add.text(W/2,328,'Recoge objetos · Evita bloqueadores · ¡Llega con Vale!',{fontFamily:'Lato',fontSize:'11px',color:'rgba(255,255,255,.45)'}).setOrigin(0.5);

    this._btn(W/2,H-44,240,44,'▶  JUGAR',()=>this._go());
    this.add.text(W/2,H-12,'ENTER para continuar',{fontFamily:'Lato',fontSize:'9px',color:'rgba(255,255,255,.25)'}).setOrigin(0.5);
  }

  _drawDot(i){
    const {dot,lv}=this._lvDots[i];
    const cx=W/2-(LEVELS.length-1)*36/2+i*36;
    const sel=lv.id===this._selLevel;
    dot.clear();
    dot.fillStyle(sel?lv.color:0x444444,sel?1:0.5);
    dot.fillCircle(cx,260,sel?13:9);
    dot.lineStyle(1.5,lv.color,sel?1:0.4);
    dot.strokeCircle(cx,260,sel?13:9);
    if(sel) dot.fillStyle(0xffffff,0.9), dot.fillCircle(cx,260,4);
  }

  _updateDisplay(){
    this._nameTxt.setText(this._name||'');
    const right=this._nameTxt.x+this._nameTxt.width/2+3;
    this._cursor.setX(right);
  }

  _go(){
    sfxClick();
    STATE.playerName=this._name.trim()||'Invitado';
    STATE.level=this._selLevel;
    STATE.totalScore=0;
    this.scene.start('Game');
  }

  _btn(x,y,w,h,label,cb){
    const g=this.add.graphics();
    g.fillStyle(0x1a0e00,0.88); g.fillRoundedRect(x-w/2,y-h/2,w,h,8);
    g.lineStyle(2,0xb89a6a,0.85); g.strokeRoundedRect(x-w/2,y-h/2,w,h,8);
    const t=this.add.text(x,y,label,{fontFamily:'Cinzel',fontSize:'15px',color:'#f5d87a'}).setOrigin(0.5);
    const z=this.add.zone(x,y,w,h).setInteractive();
    z.on('pointerover',()=>t.setColor('#fff'));
    z.on('pointerout', ()=>t.setColor('#f5d87a'));
    z.on('pointerdown',cb);
  }
}

/* ════════════════════════════════════════════════════
   GAME SCENE
════════════════════════════════════════════════════ */
class GameScene extends Phaser.Scene {
  constructor() { super({ key:'Game' }); }

  init() {
    this.score       = 0;
    this.lives       = 3;
    this.elapsed     = 0;
    this.camX        = 0;
    this.velX        = 0;
    this.velY        = 0;
    this.onGround    = true;
    this.jumpCount   = 0;
    this.coyoteT     = 0;
    this.jumpBuf     = 0;
    this.shielded    = false;
    this.boosted     = false;
    this.shieldT     = 0;
    this.boostT      = 0;
    this.hitCD       = 0;
    this.done        = false;
    this.paused      = false;
    this._items      = [];
    this._obstacles  = [];
    this._platObjs   = [];
    this.touch       = {left:false,right:false,jump:false};
    /* BG texture scales — set in _buildBG */
    this._farScale   = 1;
    this._midScale   = 1;
    this._flrScale   = 1;
    this.loveMeter   = 50;  /* 0-100 */
    this.sliding     = false;
    this.slideT      = 0;   /* ms remaining in slide */
    this.slideCool   = 0;   /* ms cooldown after slide */
  }

  /* Safe texture height lookup */
  _texH(key, fallback = 200) {
    if (!this.textures.exists(key)) return fallback;
    return this.textures.get(key).getSourceImage().height || fallback;
  }

  get _lv() { return LEVELS[STATE.level-1]; }

  /* ── BACKGROUND LAYOUT ──────────────────────────────
     Scales derived from actual texture height each level.
     far  → parallax 0.20× camX (slowest)
     mid  → parallax 0.50× camX
     floor→ 1:1 with world (solid ground)
  ────────────────────────────────────────────────────── */
  _buildBG(lv) {
    /* Read actual texture heights so any image size works correctly */
    const farH  = this._texH(lv.bgFar,  668);
    const midH  = this._texH(lv.bgMid,  668);
    const flrH  = this._texH(lv.floor,  668);

    this._farScale = H / farH;
    this._midScale = H / midH;
    this._flrScale = TILE_H / flrH;

    this._bgFar = this.add.tileSprite(0, 0, W, H, lv.bgFar)
      .setOrigin(0, 0).setDepth(0).setTileScale(this._farScale);
    this._bgMid = this.add.tileSprite(0, 0, W, H, lv.bgMid)
      .setOrigin(0, 0).setDepth(1).setTileScale(this._midScale);
    this._bgFloor = this.add.tileSprite(0, GROUND_Y, W, TILE_H, lv.floor)
      .setOrigin(0, 0).setDepth(2).setTileScale(this._flrScale);
  }

  _scrollBG() {
    /* tilePositionX is in texture-pixel units.
       To shift by N screen pixels: tilePositionX += N / tileScale */
    this._bgFar.tilePositionX   = this.camX * 0.20 / this._farScale;
    this._bgMid.tilePositionX   = this.camX * 0.50 / this._midScale;
    this._bgFloor.tilePositionX = this.camX          / this._flrScale;
  }

  create() {
    const lv = this._lv;

    this._buildBG(lv);
    this._buildPlatforms(lv);
    this._buildSprites(lv);
    this._buildHUD(lv);
    this._buildControls();
    this._showBanner(lv);
  }

  _buildPlatforms(lv) {
    const PH = 22;  /* platform visual thickness */
    lv.platforms.forEach(pd => {
      const g = this.add.graphics().setDepth(3);
      g.fillStyle(lv.color, 0.35);
      g.fillRoundedRect(0, 0, pd.w, PH, 5);
      g.fillStyle(0xffffff, 0.22);
      g.fillRect(2, 0, pd.w-4, 5);
      g.fillStyle(0x000000, 0.25);
      g.fillRect(0, PH-5, pd.w, 5);
      g.setPosition(pd.x, pd.y);
      this._platObjs.push({ rect: g, ...pd, h:PH });
    });
  }

  _buildSprites(lv) {
    const w = lv.worldW;

    /* Player — scale from actual texture height */
    this._px = 80;
    this._py = PLAYER_STAND_Y;
    this._shadow  = this.add.ellipse(0, 0, 100, 14, 0x000000, 0.18).setDepth(9);
    this._pImg    = this.add.image(0, 0, 'novios_idle01').setOrigin(0.5, 1).setDepth(10);
    const pNH = this._texH('novios_idle01', 230);
    this._pScale  = P_H / pNH;
    this._pImg.setScale(this._pScale);
    this._pAnim   = new FrameAnim(this._pImg, ['novios_idle01','novios_idle03'], 5);
    this._shieldGfx = this.add.graphics().setDepth(11);

    /* Collectibles — float via manual phase (tween would fight setPosition) */
    lv.collectibles.forEach(c => {
      const key = c.key;
      const img = this.add.image(0, 0, key).setOrigin(0.5, 1).setDepth(7);
      img.setScale(this._propScale(key, 52));
      img._wx    = c.x;
      img._wy    = c.y;
      img._type  = c.pts > 0 ? 'collect' : 'powerup';
      img._key   = key;
      img._val   = c.pts;
      img._alive = true;
      img._floatT = Phaser.Math.FloatBetween(0, Math.PI * 2); /* random phase */
      this._items.push(img);
    });

    /* Obstacles */
    lv.obstacles.forEach(o => {
      const img = this.add.image(0,0,o.key).setOrigin(0.5,1).setDepth(7);
      img.setScale(this._propScale(o.key, 72));
      img._wx=o.x; img._wy=o.y; img._type=o.type;
      img._alive=true; img._patrol=o.patrol; img._pt=0;
      img._baseX=o.x;
      /* patrol speed: gentle oscillation — period ~3-4 seconds */
      img._speed = o.patrol > 0 ? (0.7 + Math.random()*0.4) : 0;
      this._obstacles.push(img);
    });

    /* Vale (goal) */
    this._valeWX = lv.goal;
    this._valeImg = this.add.image(0, 0, 'vale_idle-Stand01').setOrigin(0.5, 1).setDepth(10);
    const vNH = this._texH('vale_idle-Stand01', 316);
    this._valeImg.setScale(P_H * 1.35 / vNH);
    this._valeAnim = new FrameAnim(this._valeImg,['vale_idle-Stand01','vale_idle-Cel01'],3);

    /* Goal glow ring */
    this._goalGfx = this.add.graphics().setDepth(8);
    this._goalT   = 0;

    this._syncScreenPositions();
  }

  /* Convert world-x to screen-x */
  _wx2sx(wx) { return wx - this.camX; }

  /* Place all world objects at correct screen positions each frame */
  _syncScreenPositions() {
    this._pImg.setPosition(this._wx2sx(this._px), this._py);
    this._shadow.setPosition(this._wx2sx(this._px), PLAYER_STAND_Y + 4);

    this._items.forEach(item => {
      if (!item._alive) return;
      /* Smooth sine float — manual phase avoids fighting setPosition */
      const floatY = Math.sin(item._floatT) * 5;
      item.setPosition(this._wx2sx(item._wx), item._wy + floatY);
    });

    this._obstacles.forEach(obs => {
      if (!obs._alive) return;
      obs.setPosition(this._wx2sx(obs._wx), obs._wy);
    });

    this._platObjs.forEach(pl => {
      pl.rect.setPosition(pl.x - this.camX, pl.y);
    });

    this._valeImg.setPosition(this._wx2sx(this._valeWX), PLAYER_STAND_Y);

    /* Goal glow ring */
    this._goalGfx.clear();
    const lv  = this._lv;
    const gsx = this._wx2sx(this._valeWX);
    const pulse = Math.sin(this._goalT) * 0.5 + 0.5;
    this._goalGfx.fillStyle(lv.color, 0.04 + 0.04 * pulse);
    this._goalGfx.fillCircle(gsx, PLAYER_STAND_Y - 65, 64);
    this._goalGfx.lineStyle(2, lv.color, 0.25 + 0.20 * pulse);
    this._goalGfx.strokeCircle(gsx, PLAYER_STAND_Y - 65, 64);
    /* Second ring slightly offset */
    this._goalGfx.lineStyle(1, lv.color, 0.12 + 0.08 * pulse);
    this._goalGfx.strokeCircle(gsx, PLAYER_STAND_Y - 65, 80);
  }

  _buildHUD(lv) {
    const depth = 50;
    /* Score + Love Meter box */
    const sg=this.add.graphics().setDepth(depth).setScrollFactor(0);
    sg.fillStyle(0x000000,0.58); sg.fillRoundedRect(8,8,210,62,6);
    this._scoreTxt=this.add.text(16,14,'PUNTOS  0',{fontFamily:'Cinzel',fontSize:'12px',color:'#f5d87a'}).setDepth(depth+1).setScrollFactor(0);
    this._livesTxt=this.add.text(16,31,'❤️❤️❤️',{fontFamily:'Lato',fontSize:'11px',color:'#ff6666'}).setDepth(depth+1).setScrollFactor(0);
    /* Love Meter */
    this.add.text(16,48,'💕',{fontFamily:'Lato',fontSize:'10px'}).setDepth(depth+1).setScrollFactor(0);
    const loveBgG=this.add.graphics().setDepth(depth).setScrollFactor(0);
    loveBgG.fillStyle(0x441122,0.8); loveBgG.fillRect(34,50,164,8);
    this._loveFill=this.add.graphics().setDepth(depth+1).setScrollFactor(0);
    this._loveTxt=this.add.text(202,48,'50%',{fontFamily:'Lato',fontSize:'8px',color:'#ff88aa'}).setOrigin(1,0).setDepth(depth+1).setScrollFactor(0);

    /* Timer */
    const tg=this.add.graphics().setDepth(depth).setScrollFactor(0);
    tg.fillStyle(0x000000,0.55); tg.fillRoundedRect(W-128,8,120,28,6);
    this._timerTxt=this.add.text(W-68,22,'0:00',{fontFamily:'Cinzel',fontSize:'13px',color:'#aaddff'}).setOrigin(0.5).setDepth(depth+1).setScrollFactor(0);

    /* Level / progress */
    const pg=this.add.graphics().setDepth(depth).setScrollFactor(0);
    pg.fillStyle(0x000000,0.55); pg.fillRoundedRect(W/2-130,8,260,28,6);
    this.add.text(W/2,15,`NIVEL ${lv.id} · ${lv.label}`,{fontFamily:'Cinzel',fontSize:'10px',color:'rgba(255,255,255,.5)',letterSpacing:2}).setOrigin(0.5,0).setDepth(depth+1).setScrollFactor(0);
    this._progBg=this.add.graphics().setDepth(depth).setScrollFactor(0);
    this._progBg.fillStyle(0x333333,0.8); this._progBg.fillRect(W/2-118,28,236,5);
    this._progFill=this.add.graphics().setDepth(depth+1).setScrollFactor(0);

    /* Status (shield/boost) */
    this._statusTxt=this.add.text(W/2,H-10,'',{fontFamily:'Cinzel',fontSize:'11px',color:'#fff',stroke:'#000',strokeThickness:3}).setOrigin(0.5,1).setDepth(depth+1).setScrollFactor(0);

    /* Mini-map bar */
    this._mmBg=this.add.graphics().setDepth(depth).setScrollFactor(0);
    this._mmBg.fillStyle(0x000000,0.4); this._mmBg.fillRect(8,54,200,6);
    this._mmFill=this.add.graphics().setDepth(depth+1).setScrollFactor(0);
  }

  _buildControls() {
    const kb=this.input.keyboard;
    this._keys={
      left: kb.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT),
      right:kb.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT),
      up:   kb.addKey(Phaser.Input.Keyboard.KeyCodes.UP),
      down: kb.addKey(Phaser.Input.Keyboard.KeyCodes.DOWN),
      space:kb.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE),
      a:    kb.addKey(Phaser.Input.Keyboard.KeyCodes.A),
      d:    kb.addKey(Phaser.Input.Keyboard.KeyCodes.D),
      w:    kb.addKey(Phaser.Input.Keyboard.KeyCodes.W),
      s:    kb.addKey(Phaser.Input.Keyboard.KeyCodes.S),
    };
    kb.on('keydown-UP',   ()=>this._jump());
    kb.on('keydown-SPACE',()=>this._jump());
    kb.on('keydown-W',    ()=>this._jump());

    /* Mobile buttons */
    const isMobile='ontouchstart' in window||navigator.maxTouchPoints>0;
    const a=isMobile?0.52:0.28;
    this._mkMobileBtn(40,H-28,64,50,'←',a,v=>this.touch.left=v);
    this._mkMobileBtn(114,H-28,64,50,'→',a,v=>this.touch.right=v);
    this._mkMobileBtn(W-44,H-28,64,50,'↑',a,v=>{ if(v)this._jump(); });
  }

  _mkMobileBtn(x,y,w,h,lbl,alpha,cb){
    const g=this.add.graphics().setDepth(60).setScrollFactor(0);
    g.fillStyle(0xffffff,alpha); g.fillRoundedRect(x-w/2,y-h/2,w,h,10);
    this.add.text(x,y,lbl,{fontFamily:'Lato',fontSize:'20px',color:'#fff'}).setOrigin(0.5).setDepth(61).setScrollFactor(0);
    const z=this.add.zone(x,y,w,h).setInteractive().setScrollFactor(0).setDepth(62);
    z.on('pointerdown',()=>cb(true));
    z.on('pointerup',  ()=>cb(false));
    z.on('pointerout', ()=>cb(false));
  }

  _showBanner(lv) {
    const ban=this.add.graphics().setDepth(80).setScrollFactor(0);
    ban.fillStyle(0x000000,0.78); ban.fillRoundedRect(W/2-200,H/2-44,400,88,12);
    ban.lineStyle(2,lv.color,0.9); ban.strokeRoundedRect(W/2-200,H/2-44,400,88,12);
    const t1=this.add.text(W/2,H/2-18,`NIVEL ${lv.id}`,{fontFamily:'Cinzel',fontSize:'30px',color:'#'+lv.color.toString(16).padStart(6,'0'),fontStyle:'bold'}).setOrigin(0.5).setDepth(81).setScrollFactor(0);
    const t2=this.add.text(W/2,H/2+20,lv.label.toUpperCase(),{fontFamily:'Cinzel',fontSize:'13px',color:'rgba(255,255,255,.8)',letterSpacing:4}).setOrigin(0.5).setDepth(81).setScrollFactor(0);
    this.tweens.add({targets:[ban,t1,t2],alpha:0,duration:500,delay:1900,onComplete:()=>{ban.destroy();t1.destroy();t2.destroy();}});
  }

  /* ── UPDATE ─────────────────────────────────────── */
  update(_t, dt) {
    dt = Math.min(dt, 50); /* cap at 50 ms — prevents huge jumps after tab switch */
    if (this.done || this.paused) return;
    const dts = dt / 1000;
    this.elapsed += dts;
    this._goalT  += dts * 2;

    /* Advance collectible float phase */
    this._items.forEach(it => { if (it._alive) it._floatT += dts * 3.6; });

    this._handleInput(dts);
    this._physics(dts);
    this._scrollCamera();
    this._moveObstacles(dts);
    this._syncScreenPositions();
    this._collide();
    this._updateHUD();

    this._pAnim.update(dt);
    this._valeAnim.update(dt);

    if (this.hitCD    > 0) { this.hitCD    -= dt; }
    if (this.shieldT  > 0) { this.shieldT  -= dt; if (this.shieldT  <= 0) this.shielded = false; }
    if (this.boostT   > 0) { this.boostT   -= dt; if (this.boostT   <= 0) this.boosted  = false; }
    if (this.sliding)      { this.slideT   -= dt; if (this.slideT   <= 0) { this.sliding=false; this.slideCool=300; } }
    if (this.slideCool > 0) this.slideCool -= dt;

    if (!this.done && Math.abs(this._px - this._valeWX) < 80) this._winLevel();
  }

  _handleInput(dts) {
    if (this.sliding) return; /* lock input during slide */

    const goLeft  = this._keys.left.isDown  || this._keys.a.isDown || this.touch.left;
    const goRight = this._keys.right.isDown || this._keys.d.isDown || this.touch.right;
    const goDown  = this._keys.down.isDown  || this._keys.s.isDown;
    const spd = this.boosted ? P_SPEED * 1.55 : P_SPEED;

    /* Instant full-speed on press, instant stop on release — no acceleration */
    if      (goRight) this.velX =  spd;
    else if (goLeft)  this.velX = -spd;
    else              this.velX =  0;

    /* Slide — down while running on ground, after cooldown */
    if (goDown && this.onGround && Math.abs(this.velX) > 50 && this.slideCool <= 0) {
      this.sliding = true;
      this.slideT  = 400;
      this._slideBurst();
    }

    /* Buffered jump: fires when ground is regained within buffer window */
    if (this.jumpBuf > 0) {
      this.jumpBuf -= 16;
      if (this.onGround || this.coyoteT > 0) this._doJump();
    }
    if (this.coyoteT > 0) this.coyoteT -= 16;
  }

  _jump() {
    this.jumpBuf = 130;
    if (this.onGround || this.coyoteT > 0 || this.jumpCount < 2) this._doJump();
  }

  _doJump() {
    const fromGround = this.onGround || this.coyoteT > 0;
    const canAirJump = !this.onGround && this.jumpCount < 2 && this.coyoteT <= 0;
    if (!fromGround && !canAirJump) return;

    this.velY = fromGround ? JUMP_VEL : JUMP_VEL * 0.80;
    this.onGround  = false;
    this.coyoteT   = 0;
    this.jumpBuf   = 0;
    this.jumpCount = fromGround ? 1 : 2;
    sfxJump();
    this._dustBurst();
  }

  _physics(dts) {
    /* Integrate gravity + vertical position */
    if (!this.onGround) {
      this.velY += GRAVITY * dts;
      this._py  += this.velY * dts;
    }
    const wasGnd = this.onGround;
    this.onGround = false;

    /* ── Ground plane ── */
    if (this._py >= PLAYER_STAND_Y) {
      this._py = PLAYER_STAND_Y; this.velY = 0; this.onGround = true;
    }

    /* ── Platforms — crossing detection (robust at any framerate) ── */
    this._lv.platforms.forEach(pl => {
      if (this.onGround || this.velY <= 0) return;
      if (this._px < pl.x - 6 || this._px > pl.x + pl.w + 6) return;
      const prevFeet = this._py - this.velY * dts;   /* where feet were last frame */
      if (prevFeet <= pl.y + 2 && this._py >= pl.y) {
        this._py = pl.y; this.velY = 0; this.onGround = true;
      }
    });

    /* ── Coyote time ── */
    if (this.onGround && !wasGnd) { this.jumpCount = 0; this.coyoteT = 0; }
    if (!this.onGround && wasGnd && this.velY >= 0) this.coyoteT = 100;

    /* ── Horizontal movement (instant — no acceleration) ── */
    this._px = Phaser.Math.Clamp(this._px + this.velX * dts, 30, this._lv.worldW - 60);

    /* ── Flip direction ── */
    if      (this.velX < 0) this._pImg.setFlipX(true);
    else if (this.velX > 0) this._pImg.setFlipX(false);

    /* ── Animation state ── */
    if (this.sliding) {
      /* Slide squish — wider and lower */
      this._pImg.setScale(this._pScale * 1.15, this._pScale * 0.44);
      this._pImg.setAlpha(1);
      this._pAnim.set(['novios_walking01','novios_walking02'], 14);
    } else if (this.hitCD > 800) {
      this._pImg.setScale(this._pScale);
      this._pAnim.set(['novios_hit01'], 4);
      /* Invincibility flicker — fast alpha strobe */
      this._pImg.setAlpha(Math.sin(this.hitCD * 0.022) > 0 ? 1 : 0.30);
    } else {
      this._pImg.setScale(this._pScale);
      this._pImg.setAlpha(1);
      if (!this.onGround && this.jumpCount >= 2) {
        this._pAnim.set(['novios_jumping02', 'novios_jumping01'], 7);
      } else if (!this.onGround) {
        this._pAnim.set(['novios_jumping01', 'novios_jumping02'], 6);
      } else if (Math.abs(this.velX) > 8) {
        this._pAnim.set(['novios_running01', 'novios_running02'], 9);
      } else {
        this._pAnim.set(['novios_idle01', 'novios_idle03'], 5);
      }
    }

    /* ── Shadow — shrinks/fades when airborne, stretches during slide ── */
    const air = Phaser.Math.Clamp((PLAYER_STAND_Y - this._py) / 160, 0, 1);
    if (this.sliding) {
      this._shadow.setScale(1.5, 0.6).setAlpha(0.28);
    } else {
      this._shadow.setScale(1 - air * 0.5, 1).setAlpha(0.18 * (1 - air * 0.55));
    }

    /* ── Shield ring ── */
    this._shieldGfx.clear();
    if (this.shielded) {
      const sx = this._wx2sx(this._px);
      this._shieldGfx.lineStyle(2.5, 0x44aaff, 0.55 + 0.3 * Math.sin(this.elapsed * 6));
      this._shieldGfx.strokeCircle(sx, this._py - P_H / 2, P_H * 0.76);
    }
  }

  _scrollCamera() {
    /* Player held at ~35% from left edge — matches parallax feel */
    const target = Phaser.Math.Clamp(this._px - W * 0.35, 0, this._lv.worldW - W);
    /* Smooth lerp — feels natural without perceived acceleration */
    this.camX = Phaser.Math.Linear(this.camX, target, CAM_LERP);
    this._scrollBG();
  }

  _moveObstacles(dts) {
    this._obstacles.forEach(obs=>{
      if(!obs._alive||!obs._patrol) return;
      obs._pt += dts * obs._speed;
      obs._wx  = obs._baseX + Math.sin(obs._pt) * obs._patrol;
    });
  }

  _collide() {
    const px=this._px, py=this._py;

    /* Items */
    this._items.forEach(item=>{
      if(!item._alive) return;
      const dx=Math.abs(item._wx-px), dy=Math.abs(item._wy-py);
      if(dx<36&&dy<50){ item._alive=false; this._collectItem(item); }
    });

    /* Obstacles */
    if(this.hitCD>0) return;
    this._obstacles.forEach(obs=>{
      if(!obs._alive) return;
      const dx=Math.abs(obs._wx-px), dy=Math.abs(obs._wy-py);
      /* Slide shrinks hitbox significantly */
      const hw = this.sliding ? 20 : 34;
      const hh = this.sliding ? 16 : 48;
      if(dx<hw&&dy<hh){
        if(this.sliding && obs._type==='money'){
          /* Slide dodge — duck under money obstacle */
          this._popup(this._wx2sx(obs._wx),obs._wy-50,'¡ESQUIVADO! 💨',0xaaffaa);
          this.loveMeter=Math.min(100,this.loveMeter+8);
          obs._alive=false; this._popSprite(obs);
        } else if(this.shielded){
          this._popup(this._wx2sx(obs._wx),obs._wy-50,'¡BLOQUEADO! 🛡',0x44aaff);
          obs._alive=false; this._popSprite(obs);
        } else {
          this._hit(obs);
        }
      }
    });
  }

  _collectItem(item) {
    sfxCollect();
    const sx=this._wx2sx(item._wx);
    if(item._type==='collect'){
      this.score+=item._val;
      this.loveMeter=Math.min(100,this.loveMeter+10);
      this._popup(sx,item._wy-40,`+${item._val}`,0xffdd44);
      this._sparkBurst(sx,item._wy);
    } else {
      sfxPower();
      if(item._key==='shield'){
        this.shielded=true; this.shieldT=8000;
        this.loveMeter=Math.min(100,this.loveMeter+15);
        this._popup(sx,item._wy-40,'🛡 ¡ESCUDO!',0x44aaff);
      } else if(item._key==='booster'){
        this.boosted=true; this.boostT=6000;
        this.loveMeter=Math.min(100,this.loveMeter+12);
        this._popup(sx,item._wy-40,'⚡ ¡TURBO!',0xffaa00);
      } else if(item._key==='life'){
        this.lives=Math.min(5,this.lives+1);
        this.loveMeter=Math.min(100,this.loveMeter+20);
        this._popup(sx,item._wy-40,'+1 Vida 💕',0xff6688);
      }
    }
    this._popSprite(item);
  }

  _hit(obs) {
    this.hitCD=1500;
    this.loveMeter=Math.max(0,this.loveMeter-20);
    if(obs._type==='life'){ this.lives--; this._popup(this._wx2sx(obs._wx),obs._wy-50,'-1 Vida 💔',0xff4444); if(this.lives<=0){this._gameOver();return;} }
    else{ this.score=Math.max(0,this.score-150); this._popup(this._wx2sx(obs._wx),obs._wy-50,'-150 💸',0xff8844); }
    sfxHit();
    this.cameras.main.shake(110,0.013);
    this.cameras.main.flash(70,255,50,50);
    this.velY=-260; this.onGround=false;
    this.paused=true; this.time.delayedCall(55,()=>this.paused=false); /* hit-pause */
  }

  _gameOver() {
    this.done=true;
    this.cameras.main.shake(300,0.022);
    this._popup(this._wx2sx(this._px),this._py-70,'GAME OVER',0xff2222);
    this.time.delayedCall(2200,()=>this.scene.start('Menu'));
  }

  _winLevel() {
    this.done=true;
    sfxWin();

    /* 1. Snap player to ground immediately — no floating */
    this._py    = PLAYER_STAND_Y;
    this.velY   = 0;
    this.velX   = 0;
    this.onGround = true;

    this._valeAnim.set(['vale_happy'],6); this._valeImg.setFlipX(true);
    this._pAnim.set(['novios_dancing01','novios_dancing02','novios_dancing03'],6);
    const timeBonus=Math.max(0,Math.floor(3000-this.elapsed*12));
    const loveBonus=Math.floor(this.loveMeter*2);
    this.score+=timeBonus+loveBonus;
    STATE.totalScore+=this.score;
    this._confetti();

    this.time.delayedCall(700,()=>{
      const lv=this._lv;
      const pan=this.add.graphics().setDepth(90).setScrollFactor(0);
      pan.fillStyle(0x0a0510,0.93); pan.fillRoundedRect(W/2-220,H/2-66,440,132,12);
      pan.lineStyle(2,lv.color,0.9); pan.strokeRoundedRect(W/2-220,H/2-66,440,132,12);
      this.add.text(W/2,H/2-48,'¡NIVEL COMPLETADO!',{fontFamily:'Cinzel',fontSize:'20px',color:'#'+lv.color.toString(16).padStart(6,'0'),fontStyle:'bold'}).setOrigin(0.5).setDepth(91).setScrollFactor(0);
      this.add.text(W/2,H/2-20,`Puntos: ${this.score - timeBonus - loveBonus}  +${timeBonus} tiempo  +${loveBonus} 💕`,{fontFamily:'Lato',fontSize:'12px',color:'rgba(255,255,255,.75)'}).setOrigin(0.5).setDepth(91).setScrollFactor(0);
      this.add.text(W/2,H/2+2,`Total acumulado: ${STATE.totalScore}`,{fontFamily:'Lato',fontSize:'11px',color:'rgba(255,215,100,.8)'}).setOrigin(0.5).setDepth(91).setScrollFactor(0);
      const isLast=STATE.level>=LEVELS.length;
      const nextLbl=isLast?'🎊  ¡FINAL!':'► SIGUIENTE NIVEL';
      const bw=240,bh=40;
      const bg2=this.add.graphics().setDepth(91).setScrollFactor(0);
      bg2.fillStyle(lv.color,0.22); bg2.fillRoundedRect(W/2-bw/2,H/2+30,bw,bh,8);
      bg2.lineStyle(2,lv.color,0.9); bg2.strokeRoundedRect(W/2-bw/2,H/2+30,bw,bh,8);
      const bt=this.add.text(W/2,H/2+50,nextLbl,{fontFamily:'Cinzel',fontSize:'14px',color:'#fff',fontStyle:'bold'}).setOrigin(0.5).setDepth(92).setScrollFactor(0);
      this.tweens.add({targets:bt,alpha:{from:.7,to:1},duration:600,yoyo:true,repeat:-1});
      const bz=this.add.zone(W/2,H/2+50,bw,bh).setInteractive().setScrollFactor(0).setDepth(93);
      bz.on('pointerdown',()=>{
        sfxClick();
        if(isLast) this.scene.start('Victory',{score:STATE.totalScore,elapsed:this.elapsed});
        else { STATE.level++; this.scene.start('Game'); }
      });
    });
  }

  _updateHUD() {
    const lv=this._lv;
    this._scoreTxt.setText(`PUNTOS  ${this.score}`);
    const m=Math.floor(this.elapsed/60);
    const s=Math.floor(this.elapsed%60).toString().padStart(2,'0');
    this._timerTxt.setText(`${m}:${s}`);
    let h=''; for(let i=0;i<this.lives;i++)h+='❤️';
    this._livesTxt.setText(h);

    /* progress */
    const prog=Phaser.Math.Clamp((this._px-30)/(lv.worldW-90),0,1);
    this._progFill.clear();
    this._progFill.fillStyle(lv.color,0.9); this._progFill.fillRect(W/2-118,28,236*prog,5);

    /* mini-map dot */
    this._mmFill.clear();
    this._mmFill.fillStyle(0xf5d87a,1); this._mmFill.fillCircle(8+200*prog,57,4);

    /* Love Meter bar */
    this._loveFill.clear();
    const lm=this.loveMeter/100;
    const lmCol=lm>0.65?0xff6699:lm>0.35?0xff9944:0xff3333;
    this._loveFill.fillStyle(lmCol,0.92);
    this._loveFill.fillRect(34,50,Math.round(164*lm),8);
    if(lm>=1){ this._loveFill.lineStyle(1.5,0xffffff,0.55); this._loveFill.strokeRect(34,50,164,8); }
    this._loveTxt.setText(`${Math.round(this.loveMeter)}%`);

    /* status */
    const parts=[];
    if(this.shielded) parts.push(`🛡 ${(this.shieldT/1000).toFixed(1)}s`);
    if(this.boosted)  parts.push(`⚡ ${(this.boostT/1000).toFixed(1)}s`);
    if(this.sliding)  parts.push('💨 SLIDE');
    this._statusTxt.setText(parts.join('   '));
  }

  /* ── FX ── */
  _popup(x,y,msg,col){
    const t=this.add.text(Phaser.Math.Clamp(x,20,W-20),y,msg,
      {fontFamily:'Lato',fontSize:'12px',fontStyle:'bold',color:'#'+col.toString(16).padStart(6,'0'),stroke:'#000',strokeThickness:3})
      .setOrigin(0.5,1).setDepth(70).setScrollFactor(0);
    this.tweens.add({targets:t,y:t.y-42,alpha:0,duration:1100,ease:'Cubic.Out',onComplete:()=>t.destroy()});
  }

  _popSprite(s){
    this.tweens.add({targets:s,alpha:0,scaleX:2,scaleY:2,duration:260,onComplete:()=>s.destroy()});
  }

  _dustBurst(){
    const sx=this._wx2sx(this._px);
    for(let i=0;i<6;i++){
      const r=this.add.rectangle(sx+Phaser.Math.Between(-16,16),this._py,5,5,
        [0xffd700,0xff99cc,0x88ccff][i%3]).setDepth(15).setScrollFactor(0);
      this.tweens.add({targets:r,y:r.y+22,alpha:0,duration:360,onComplete:()=>r.destroy()});
    }
  }

  _slideBurst(){
    const sx=this._wx2sx(this._px);
    const dir=this.velX>=0?-1:1;
    for(let i=0;i<8;i++){
      const r=this.add.rectangle(sx+dir*Phaser.Math.Between(10,50),
        this._py-Phaser.Math.Between(4,24),Phaser.Math.Between(4,10),3,
        [0xffffff,0xddddff,0xaaccff][i%3],0.7).setDepth(15).setScrollFactor(0);
      this.tweens.add({targets:r,x:r.x+dir*Phaser.Math.Between(20,60),alpha:0,duration:320,ease:'Cubic.Out',onComplete:()=>r.destroy()});
    }
  }

  _sparkBurst(x,y){
    for(let i=0;i<9;i++){
      const a=(i/9)*Math.PI*2, d=Phaser.Math.Between(18,44);
      const r=this.add.circle(x,y,3,[0xffd700,0xffcc44,0xffffff][i%3]).setDepth(20).setScrollFactor(0);
      this.tweens.add({targets:r,x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,alpha:0,duration:420,ease:'Cubic.Out',onComplete:()=>r.destroy()});
    }
  }

  _confetti(){
    const cols=[0xffd700,0xff6699,0x44aaff,0xff8844,0x44cc88,0xcc44ff];
    for(let i=0;i<55;i++) this.time.delayedCall(i*50,()=>{
      const r=this.add.rectangle(Phaser.Math.Between(80,W-80),Phaser.Math.Between(0,H/3),
        Phaser.Math.Between(5,10),Phaser.Math.Between(5,10),Phaser.Utils.Array.GetRandom(cols)).setDepth(75).setScrollFactor(0);
      this.tweens.add({targets:r,y:r.y+220,alpha:0,angle:Phaser.Math.Between(-180,180),duration:Phaser.Math.Between(1200,2200),onComplete:()=>r.destroy()});
    });
  }

  /* prop scale helper: scale so height = targetH px */
  _propScale(key, targetH) {
    if(!this.textures.exists(key)) return 1;
    const src=this.textures.get(key).getSourceImage();
    return (src?.height) ? targetH/src.height : 1;
  }
}

/* ════════════════════════════════════════════════════
   LEVEL EDITOR — mini engine dedicado al juego
   ─────────────────────────────────────────────────
   Panel 240px · Canvas 720px
   Tabs: OBJETOS | FONDOS | ESCALA | MUNDO
   · Sprites reales en canvas
   · Cambio de assets BG / floor por nivel
   · Undo Ctrl+Z (20 pasos)
   · Mouse wheel scroll
   · Grid snap G
   · Apply escribe de vuelta en LEVELS
════════════════════════════════════════════════════ */
class EditorScene extends Phaser.Scene {
  constructor() { super({ key:'Editor' }); }

  /* ════ STATE ════ */
  init() {
    this._lvIdx     = 0;
    this._camX      = 0;
    this._objs      = [];
    this._drag      = null;
    this._mode      = 'platform';
    this._selKey    = 'points_01';
    this._patrol    = 0;
    this._tab       = 'objects';
    this._gridSnap  = false;
    this._undoStack = [];
    this._lvBg      = { bgFar:null, bgMid:null, floor:null };
    this._scales    = {
      playerH:P_H, propH:48, obstH:60, platH:20,
      bgFarScaleY:1.0, bgMidScaleY:1.0, floorH:TILE_H,
      goalX:null, worldW:null,
    };
  }

  get _lv()  { return LEVELS[this._lvIdx]; }
  get PW()   { return 240; }
  get PX()   { return 0; }
  get CX()   { return this.PW; }
  get CW()   { return W - this.PW; }

  _texH(key, fb=668) {
    if (!this.textures.exists(key)) return fb;
    return this.textures.get(key).getSourceImage().height || fb;
  }

  /* ════ CREATE ════ */
  create() {
    this.cameras.main.setBackgroundColor('#0d0d14');
    this._buildBGLayer();
    this._buildPreviewSprites();
    this._loadLevelData();
    this._buildPanel();
    this._buildBottomBar();
    this._buildKeyboard();
    this.input.on('pointerdown', this._onDown, this);
    this.input.on('pointermove', this._onMove, this);
    this.input.on('pointerup',   this._onUp,   this);
    /* Mouse-wheel horizontal scroll */
    this.input.on('wheel', (_p, _o, _dx, dy) => {
      const maxX = (this._scales.worldW || this._lv.worldW) - this.CW;
      this._camX = Phaser.Math.Clamp(this._camX + dy * 1.8, 0, Math.max(0, maxX));
      this._refreshBG(); this._redrawAll(); this._updateCoords(0, 0);
    });
    this._refreshBG();
    this._snapshot();
  }

  /* ════ BACKGROUND ════ */
  _buildBGLayer() {
    const lv  = this._lv;
    const s   = this._scales;
    const far = this._lvBg.bgFar  || lv.bgFar;
    const mid = this._lvBg.bgMid  || lv.bgMid;
    const flr = this._lvBg.floor  || lv.floor;

    this._farScaleBase = H / this._texH(far, 668);
    this._midScaleBase = H / this._texH(mid, 668);
    this._flrScaleBase = TILE_H / this._texH(flr, 668);

    const scaleH = this._farScaleBase * s.bgFarScaleY;
    const midH   = this._midScaleBase * s.bgMidScaleY;
    const floorS = this._flrScaleBase;

    this._bgFarSprite   = this.add.tileSprite(this.CX, 0, this.CW, H, far)
      .setOrigin(0,0).setDepth(0).setTileScale(scaleH);
    this._bgMidSprite   = this.add.tileSprite(this.CX, 0, this.CW, H, mid)
      .setOrigin(0,0).setDepth(1).setTileScale(midH);
    this._bgFloorSprite = this.add.tileSprite(this.CX, GROUND_Y, this.CW, s.floorH, flr)
      .setOrigin(0,0).setDepth(2).setTileScale(floorS);
    this._groundLine    = this.add.rectangle(this.CX, GROUND_Y, this.CW, 2, 0xffffff, 0.3)
      .setOrigin(0,0).setDepth(5);
    this._gridGfx = this.add.graphics().setDepth(4);
    this._drawGrid();
  }

  _drawGrid() {
    this._gridGfx.clear();
    this._gridGfx.fillStyle(0xffffff, this._gridSnap ? 0.06 : 0.025);
    const step = 40;
    for (let x = this.CX; x < W; x += step)
      for (let y = 0; y < H; y += step)
        this._gridGfx.fillRect(x, y, 1, 1);
  }

  _refreshBG() {
    const s     = this._scales;
    const scaleH = (this._farScaleBase || H/668) * s.bgFarScaleY;
    const midH   = (this._midScaleBase || H/668) * s.bgMidScaleY;
    const floorS =  this._flrScaleBase || TILE_H/668;

    this._bgFarSprite.setTileScale(scaleH);
    this._bgMidSprite.setTileScale(midH);
    this._bgFloorSprite.setTileScale(floorS);
    this._bgFloorSprite.y      = GROUND_Y;
    this._bgFloorSprite.height = s.floorH;
    this._groundLine.y         = GROUND_Y;

    this._bgFarSprite.tilePositionX   = this._camX * 0.20 / scaleH;
    this._bgMidSprite.tilePositionX   = this._camX * 0.50 / midH;
    this._bgFloorSprite.tilePositionX = this._camX          / floorS;
  }

  _swapBG(layer, key) {
    /* Swap a BG layer at runtime without restarting */
    this._lvBg[layer] = key;
    if (!this.textures.exists(key)) { this._refreshBG(); return; }
    const th = this._texH(key, 668);
    if (layer === 'bgFar') {
      this._farScaleBase = H / th;
      this._bgFarSprite.setTexture(key);
    } else if (layer === 'bgMid') {
      this._midScaleBase = H / th;
      this._bgMidSprite.setTexture(key);
    } else {
      this._flrScaleBase = TILE_H / th;
      this._bgFloorSprite.setTexture(key);
    }
    this._refreshBG();
  }

  /* ════ PREVIEW SPRITES ════ */
  _buildPreviewSprites() {
    const s  = this._scales;
    const pH = this._texH('novios_idle01', 230);
    const vH = this._texH('vale_idle-Stand01', 316);
    this._previewPlayer = this.add.image(this.CX+60, GROUND_Y, 'novios_idle01')
      .setOrigin(0.5,1).setDepth(12).setAlpha(0.65).setScale(s.playerH/pH);
    this._previewVale   = this.add.image(this.CX+this.CW-60, GROUND_Y, 'vale_idle-Stand01')
      .setOrigin(0.5,1).setDepth(12).setAlpha(0.65).setScale(s.playerH*1.4/vH);
  }

  _refreshPreviewSprites() {
    const s  = this._scales;
    const pH = this._texH('novios_idle01', 230);
    const vH = this._texH('vale_idle-Stand01', 316);
    this._previewPlayer.setScale(s.playerH/pH);
    this._previewVale.setScale(s.playerH*1.4/vH);
  }

  /* ════ LEVEL DATA ════ */
  _loadLevelData() {
    this._objs = [];
    const lv = this._lv;
    lv.platforms.forEach(p    => this._addObj({type:'platform',wx:p.x,wy:p.y,w:p.w}));
    lv.collectibles.forEach(c => this._addObj({type:'collect', wx:c.x,wy:c.y,key:c.key,pts:c.pts}));
    lv.obstacles.forEach(o    => this._addObj({type:'obstacle',wx:o.x,wy:o.y,key:o.key,obsType:o.type,patrol:o.patrol}));
  }

  /* ════ OBJECTS — ADD / DRAW ════ */
  _addObj(data) {
    const gfx   = this.add.graphics().setDepth(10);
    const lbl   = this.add.text(0,0,'',{fontFamily:'Lato',fontSize:'8px',color:'#fff',stroke:'#000',strokeThickness:2}).setDepth(12);
    const rhGfx = this.add.graphics().setDepth(13);

    /* Real sprite on canvas */
    let spr = null;
    if (data.key && this.textures.exists(data.key)) {
      const targetH = data.type==='obstacle' ? this._scales.obstH : this._scales.propH;
      spr = this.add.image(0, 0, data.key)
        .setOrigin(0.5, 1).setDepth(9).setAlpha(0.92)
        .setScale(targetH / this._texH(data.key));
    }

    const obj = {...data, gfx, lbl, rhGfx, spr, _selected:false};
    this._objs.push(obj);
    this._redrawObj(obj);
    return obj;
  }

  _redrawObj(obj) {
    const lv  = this._lv;
    const s   = this._scales;
    const sx  = (obj.wx - this._camX) + this.CX;
    const sy  = obj.wy;
    const ph  = s.platH;
    const col = obj._selected ? 0xffffff
              : obj.type==='platform' ? lv.color
              : obj.type==='collect'  ? 0xffdd44 : 0xff5555;

    obj.gfx.clear();
    obj.rhGfx.clear();

    /* Update real sprite position */
    if (obj.spr) obj.spr.setPosition(sx, sy);

    if (obj.type === 'platform') {
      const w = obj.w || 120;
      /* Platform body */
      obj.gfx.fillStyle(col, obj._selected ? 0.55 : 0.28);
      obj.gfx.fillRoundedRect(sx, sy, w, ph, 4);
      obj.gfx.lineStyle(obj._selected ? 2 : 1.5, col, 0.95);
      obj.gfx.strokeRoundedRect(sx, sy, w, ph, 4);
      /* Top highlight stripe */
      obj.gfx.fillStyle(0xffffff, 0.18);
      obj.gfx.fillRect(sx+3, sy+1, w-6, 4);
      /* Width label */
      obj.lbl.setText(`${w}px`).setPosition(sx+3, sy-12);
      /* Resize handle */
      if (obj._selected) {
        obj.rhGfx.fillStyle(0xffd700, 1);
        obj.rhGfx.fillTriangle(sx+w-1,sy, sx+w+10,sy+ph/2, sx+w-1,sy+ph);
        obj.rhGfx.lineStyle(1,0x000,0.4);
        obj.rhGfx.strokeTriangle(sx+w-1,sy, sx+w+10,sy+ph/2, sx+w-1,sy+ph);
      }
    } else {
      /* Collectible / obstacle — draw selection ring only (sprite shows icon) */
      const r = obj.type==='collect' ? 14 : 18;
      if (obj._selected) {
        obj.gfx.lineStyle(2.5, 0xffd700, 0.95);
        obj.gfx.strokeCircle(sx, sy - r, r + 4);
      } else {
        obj.gfx.lineStyle(1.5, col, 0.55);
        obj.gfx.strokeCircle(sx, sy - r, r + 2);
      }
      /* Patrol range arc for obstacles */
      if (obj.type==='obstacle' && obj.patrol > 0) {
        obj.gfx.lineStyle(1, 0xffaa00, 0.35);
        obj.gfx.strokeRect(sx - obj.patrol, sy - r*2 - 4, obj.patrol*2, r*2 + 4);
      }
      /* Label only if no sprite */
      if (!obj.spr) obj.lbl.setText(obj.key||'').setPosition(sx-20, sy - r*2 - 14);
      else obj.lbl.setText('').setPosition(sx, sy);
    }
  }

  /* ════ PANEL ════ */
  _buildPanel() {
    const PW = this.PW, PX = this.PX;
    this.add.rectangle(PX,0,PW,H,0x08080f,0.97).setOrigin(0,0).setDepth(80);

    /* Header */
    this.add.text(PX+10, 7, '🎮 EDITOR', {fontFamily:'Cinzel',fontSize:'11px',color:'#f5d87a'}).setDepth(81);

    /* Level selector */
    this.add.text(PX+6, 26, 'NIVEL:', {fontFamily:'Lato',fontSize:'8px',color:'#666'}).setDepth(81);
    LEVELS.forEach((l, i) => {
      const bx = PX + 6 + i*36, by = 35;
      const bg = this.add.graphics().setDepth(81);
      const sel = this._lvIdx === i;
      bg.fillStyle(l.color, sel ? 0.9 : 0.2);
      bg.fillRoundedRect(bx, by, 30, 18, 4);
      if (sel) { bg.lineStyle(1.5, 0xffd700, 1); bg.strokeRoundedRect(bx,by,30,18,4); }
      this.add.text(bx+15, by+9, `${l.id}`, {fontFamily:'Cinzel',fontSize:'9px',color:'#fff'})
        .setOrigin(0.5).setDepth(82);
      this.add.zone(bx+15, by+9, 30, 18).setInteractive().setDepth(83)
        .on('pointerdown', () => { sfxClick(); this._applyToLevel(); this._lvIdx=i; this.scene.restart(); });
    });

    /* ── 4 tabs ── */
    const TABS = [['objects','OBJETOS'],['assets','FONDOS'],['scale','ESCALA'],['world','MUNDO']];
    const TW   = (PW-8)/4 - 2;
    this._tabGfxList = [];
    this._tabTxtList = [];
    const drawTabs = () => {
      TABS.forEach(([key], i) => {
        const g = this._tabGfxList[i];
        g.clear();
        const sel = this._tab === key;
        g.fillStyle(sel ? 0xb89a6a : 0x1a1a28, sel ? 0.95 : 0.8);
        g.fillRoundedRect(PX+4+i*(TW+2), 59, TW, 18, 3);
        this._tabTxtList[i].setColor(sel ? '#000' : '#666');
      });
    };
    TABS.forEach(([key, lbl], i) => {
      const tx = PX+4+i*(TW+2), ty = 59;
      const g = this.add.graphics().setDepth(81); this._tabGfxList.push(g);
      const t = this.add.text(tx+TW/2, ty+9, lbl, {fontFamily:'Lato',fontSize:'7px'})
        .setOrigin(0.5).setDepth(82); this._tabTxtList.push(t);
      this.add.zone(tx+TW/2, ty+9, TW, 18).setInteractive().setDepth(83)
        .on('pointerdown', () => { sfxClick(); this._tab=key; drawTabs(); this._showTabContent(); });
    });
    drawTabs();

    /* Divider */
    this.add.rectangle(PX+6, 80, PW-12, 1, 0x333355, 1).setOrigin(0,0).setDepth(81);

    this._tabContainer = [];
    this._showTabContent();
  }

  _clearTabContent() {
    this._tabContainer.forEach(o => o?.destroy?.());
    this._tabContainer = [];
  }

  _showTabContent() {
    this._clearTabContent();
    /* Rebuild action buttons cleanly each time */
    this._buildActions();
    if      (this._tab==='objects') this._buildObjectsTab();
    else if (this._tab==='assets')  this._buildAssetsTab();
    else if (this._tab==='scale')   this._buildScaleTab();
    else                             this._buildWorldTab();
  }

  _buildActions() {
    const PW = this.PW, PX = this.PX;
    const hw = Math.floor((PW-12)/2);
    const add = o => { this._tabContainer.push(o); return o; };

    const mkBtn = (x,y,w,lbl,col,cb) => {
      const bg = add(this.add.graphics().setDepth(81));
      const redraw = (h) => {
        bg.clear(); bg.fillStyle(col,h?0.5:0.2); bg.fillRoundedRect(x,y,w,22,4);
        if(!h){bg.lineStyle(1.5,col,0.65);bg.strokeRoundedRect(x,y,w,22,4);}
      };
      redraw(false);
      add(this.add.text(x+w/2,y+11,lbl,{fontFamily:'Cinzel',fontSize:'8px',color:'#'+col.toString(16).padStart(6,'0')}).setOrigin(0.5).setDepth(82));
      const z=add(this.add.zone(x+w/2,y+11,w,22).setInteractive().setDepth(83));
      z.on('pointerover',()=>redraw(true)).on('pointerout',()=>redraw(false)).on('pointerdown',cb);
    };

    mkBtn(PX+4,      H-115, PW-8, '✔ APLICAR AL JUEGO', 0x44ff88, ()=>{ sfxClick(); this._applyToLevel(); this._toast('¡Aplicado!',0x44ff88); });
    mkBtn(PX+4,      H-89,  hw,   '📋 JSON',             0x44aaff, ()=>{ sfxClick(); this._export(); });
    mkBtn(PX+4+hw+4, H-89,  hw,   '↩ UNDO (Z)',          0xffaa44, ()=>{ sfxClick(); this._undo(); });
    mkBtn(PX+4,      H-63,  PW-8, '← SALIR',             0xff6666, ()=>{ sfxClick(); this.scene.start('Menu'); });
  }

  /* ─── TAB: OBJETOS ─── */
  _buildObjectsTab() {
    const PW=this.PW, PX=this.PX;
    const add = o => { this._tabContainer.push(o); return o; };
    const lv  = this._lv;

    add(this.add.text(PX+6, 84, 'MODO:', {fontFamily:'Lato',fontSize:'8px',color:'#666'}).setDepth(82));

    const MODES = [['platform','Plataforma',lv.color],['collect','Coleccionable',0xffdd44],['obstacle','Obstáculo',0xff5555]];
    const mBgs  = [];
    const redrawModes = () => MODES.forEach(([m,,c],i) => {
      const g = mBgs[i]; g.clear();
      const sel = this._mode===m;
      g.fillStyle(c, sel?0.45:0.1);  g.fillRoundedRect(PX+4, 93+i*24, PW-8, 21, 4);
      g.lineStyle(1.5, c, sel?1:0.3); g.strokeRoundedRect(PX+4, 93+i*24, PW-8, 21, 4);
    });
    MODES.forEach(([mode,lbl,col],i) => {
      const g = add(this.add.graphics().setDepth(81)); mBgs.push(g);
      add(this.add.text(PX+10, 93+i*24+10, lbl, {fontFamily:'Lato',fontSize:'10px',color:'#'+col.toString(16).padStart(6,'0')}).setOrigin(0,0.5).setDepth(82));
      add(this.add.zone(PX+PW/2,93+i*24+10,PW-8,21).setInteractive().setDepth(83))
        .on('pointerdown',()=>{ sfxClick(); this._mode=mode; redrawModes(); this._showTabContent(); });
    });
    redrawModes();

    /* ── Asset picker grid ── */
    const COLLECT_KEYS = ['points_01','points_02','points_03','points_04','points_05','shield','booster','life'];
    const OBST_KEYS    = ['blocker_money_01','blocker_money_02','blocker_money_03','blocker_money-04',
                          'blocker_life-01','blocker_life-02','blocker_life-03'];
    const pickerKeys   = this._mode==='collect' ? COLLECT_KEYS : this._mode==='obstacle' ? OBST_KEYS : [];

    if (pickerKeys.length) {
      add(this.add.text(PX+6, 166, 'ASSET:', {fontFamily:'Lato',fontSize:'8px',color:'#666'}).setDepth(82));
      const COLS=4, SZ=48, GAP=3;
      pickerKeys.forEach((k, i) => {
        const col = i%COLS, row = Math.floor(i/COLS);
        const bx  = PX+4 + col*(SZ+GAP);
        const by  = 177  + row*(SZ+GAP);
        const bg  = add(this.add.graphics().setDepth(81));
        const sel = this._selKey===k;
        bg.fillStyle(sel?0xffd700:0x1a1a28, sel?0.5:0.6);
        bg.fillRoundedRect(bx, by, SZ, SZ, 4);
        bg.lineStyle(sel?2:1, sel?0xffd700:0x333355, 1);
        bg.strokeRoundedRect(bx, by, SZ, SZ, 4);

        if (this.textures.exists(k)) {
          const src = this.textures.get(k).getSourceImage();
          const sc  = Math.min((SZ-6)/src.width, (SZ-6)/src.height);
          add(this.add.image(bx+SZ/2, by+SZ/2, k).setOrigin(0.5).setScale(sc).setDepth(82));
        } else {
          add(this.add.text(bx+SZ/2, by+SZ/2, k.slice(0,8), {fontFamily:'Lato',fontSize:'6px',color:'#aaa'}).setOrigin(0.5).setDepth(82));
        }
        add(this.add.zone(bx+SZ/2, by+SZ/2, SZ, SZ).setInteractive().setDepth(83))
          .on('pointerdown', () => { sfxClick(); this._selKey=k; this._showTabContent(); });
      });
    }

    /* ── Platform width slider (when platform selected) ── */
    const selPlat = this._objs.find(o=>o._selected&&o.type==='platform');
    if (selPlat) {
      const topY = 300;
      add(this.add.text(PX+6, topY, `ANCHO: ${selPlat.w||120}px`, {fontFamily:'Lato',fontSize:'8px',color:'#aaa'}).setDepth(82));
      const wFill = add(this.add.rectangle(PX+8, topY+16, Math.max(2,((selPlat.w||120)/500)*(PW-16)), 8, 0x4488ff).setOrigin(0,0.5).setDepth(83));
      add(this.add.rectangle(PX+8, topY+16, PW-16, 8, 0x222233).setOrigin(0,0.5).setDepth(82));
      add(this.add.zone(PX+PW/2, topY+16, PW-16, 16).setInteractive().setDepth(84))
        .on('pointerdown', e => { selPlat.w=Math.round(((e.x-(PX+8))/(PW-16))*500)+40; wFill.width=Math.max(2,((selPlat.w)/500)*(PW-16)); this._redrawObj(selPlat); })
        .on('pointermove', e => { if(this.input.activePointer.isDown){ selPlat.w=Math.round(((e.x-(PX+8))/(PW-16))*500)+40; wFill.width=Math.max(2,(selPlat.w/500)*(PW-16)); this._redrawObj(selPlat); } });
    }

    /* ── Patrol slider ── */
    const patY = 326;
    const patLbl  = add(this.add.text(PX+6, patY, `PATRULLA: ${this._patrol}px`, {fontFamily:'Lato',fontSize:'8px',color:'#aaa'}).setDepth(82));
    add(this.add.rectangle(PX+8, patY+16, PW-16, 8, 0x222233).setOrigin(0,0.5).setDepth(82));
    const patFill = add(this.add.rectangle(PX+8, patY+16, Math.max(2,(this._patrol/200)*(PW-16)), 8, 0xffaa44).setOrigin(0,0.5).setDepth(83));
    const updPat  = (ex) => {
      this._patrol = Math.round(((ex-(PX+8))/(PW-16))*200);
      patFill.width= Math.max(2,(this._patrol/200)*(PW-16));
      patLbl.setText(`PATRULLA: ${this._patrol}px`);
    };
    add(this.add.zone(PX+PW/2, patY+16, PW-16, 16).setInteractive().setDepth(84))
      .on('pointerdown',e=>updPat(e.x)).on('pointermove',e=>{ if(this.input.activePointer.isDown) updPat(e.x); });

    /* ── Grid snap toggle ── */
    const snapY = 354;
    const snapBg = add(this.add.graphics().setDepth(81));
    const drawSnap = () => {
      snapBg.clear();
      snapBg.fillStyle(this._gridSnap?0x44ff88:0x222233, 0.6);
      snapBg.fillRoundedRect(PX+4, snapY, PW-8, 20, 4);
    };
    drawSnap();
    add(this.add.text(PX+PW/2, snapY+10, `SNAP GRID (G): ${this._gridSnap?'ON':'OFF'}`, {fontFamily:'Lato',fontSize:'9px',color:this._gridSnap?'#44ff88':'#666'}).setOrigin(0.5).setDepth(82));
    add(this.add.zone(PX+PW/2, snapY+10, PW-8, 20).setInteractive().setDepth(83))
      .on('pointerdown', () => { this._gridSnap=!this._gridSnap; this._drawGrid(); this._showTabContent(); });

    /* ── Selected object info ── */
    const selObj = this._objs.find(o=>o._selected);
    if (selObj) {
      add(this.add.text(PX+6, 380, `SEL: ${selObj.type}`, {fontFamily:'Lato',fontSize:'8px',color:'#f5d87a'}).setDepth(82));
      add(this.add.text(PX+6, 390, `wx:${Math.round(selObj.wx)}  wy:${Math.round(selObj.wy)}`, {fontFamily:'Lato',fontSize:'8px',color:'#aaa'}).setDepth(82));
      if (selObj.key) add(this.add.text(PX+6, 400, selObj.key, {fontFamily:'Lato',fontSize:'8px',color:'#888'}).setDepth(82));
      /* Duplicate */
      const dupG = add(this.add.graphics().setDepth(81));
      dupG.fillStyle(0x4488ff,0.25); dupG.fillRoundedRect(PX+4,408,PW-8,20,4);
      dupG.lineStyle(1,0x4488ff,0.6); dupG.strokeRoundedRect(PX+4,408,PW-8,20,4);
      add(this.add.text(PX+PW/2,418,'DUPLICAR (D)',{fontFamily:'Lato',fontSize:'9px',color:'#88aaff'}).setOrigin(0.5).setDepth(82));
      add(this.add.zone(PX+PW/2,418,PW-8,20).setInteractive().setDepth(83))
        .on('pointerdown',()=>{ sfxClick(); this._duplicateSelected(); });
    }
  }

  /* ─── TAB: FONDOS ─── */
  _buildAssetsTab() {
    const PW=this.PW, PX=this.PX;
    const add = o => { this._tabContainer.push(o); return o; };
    const lv  = this._lv;

    const FAR_KEYS   = ['bg_city_far','bg_desert_far','bg_beach_far','bg_halloween_far','bg_mexican_far','bg_church_far'];
    const MID_KEYS   = ['bg_city_mid','bg_desert_mid','bg_beach_mid','bg_halloween_mid','bg_mexican_mid','bg_church_mid'];
    const FLOOR_KEYS = ['floor_city','floor_desert','floor_beach','floor_halloween','floor_mexican','floor_church','win_floor_church'];
    const WORLD_COLS = [0x4488ff,0xffaa44,0x44ddcc,0xaa44ff,0xff4488,0xffd700];

    const section = (label, keys, layer, currentKey, startY) => {
      add(this.add.text(PX+6, startY, label, {fontFamily:'Cinzel',fontSize:'9px',color:'#b89a6a',letterSpacing:1}).setDepth(82));
      keys.forEach((k, i) => {
        const by  = startY+14 + Math.floor(i/2)*22;
        const bx  = PX+4 + (i%2)*(PW/2-2);
        const sel = (this._lvBg[layer]||currentKey) === k;
        const col = WORLD_COLS[i % WORLD_COLS.length];
        const bg  = add(this.add.graphics().setDepth(81));
        bg.fillStyle(col, sel?0.45:0.12);
        bg.fillRoundedRect(bx, by, PW/2-4, 20, 3);
        bg.lineStyle(sel?2:1, col, sel?1:0.35);
        bg.strokeRoundedRect(bx, by, PW/2-4, 20, 3);
        const shortName = k.replace('bg_','').replace('floor_','').replace('_far','FAR').replace('_mid','MID');
        add(this.add.text(bx+(PW/2-4)/2, by+10, shortName.toUpperCase(), {fontFamily:'Lato',fontSize:'7px',color:sel?'#fff':'#888'}).setOrigin(0.5).setDepth(82));
        add(this.add.zone(bx+(PW/2-4)/2, by+10, PW/2-4, 20).setInteractive().setDepth(83))
          .on('pointerdown', () => { sfxClick(); this._swapBG(layer, k); this._showTabContent(); });
      });
      return startY + 14 + Math.ceil(keys.length/2)*22 + 6;
    };

    let y = 84;
    y = section('FONDO FAR',   FAR_KEYS,   'bgFar', lv.bgFar,  y);
    add(this.add.rectangle(PX+6, y, PW-12, 1, 0x333355).setOrigin(0,0).setDepth(81));
    y += 4;
    y = section('FONDO MID',   MID_KEYS,   'bgMid', lv.bgMid,  y);
    add(this.add.rectangle(PX+6, y, PW-12, 1, 0x333355).setOrigin(0,0).setDepth(81));
    y += 4;
    y = section('PISO (FLOOR)',FLOOR_KEYS, 'floor', lv.floor,  y);

    /* Reset BG button */
    add(this.add.graphics().setDepth(81)).fillStyle(0x441111,0.4).fillRoundedRect(PX+4,y+4,PW-8,20,4);
    add(this.add.text(PX+PW/2,y+14,'RESET FONDOS',{fontFamily:'Lato',fontSize:'9px',color:'#ff8888'}).setOrigin(0.5).setDepth(82));
    add(this.add.zone(PX+PW/2,y+14,PW-8,20).setInteractive().setDepth(83))
      .on('pointerdown',()=>{ sfxClick(); this._lvBg={bgFar:null,bgMid:null,floor:null}; this.scene.restart(); });
  }

  /* ─── TAB: ESCALA ─── */
  _buildScaleTab() {
    const PW=this.PW, PX=this.PX;
    const add = o => { this._tabContainer.push(o); return o; };
    const s   = this._scales;

    const SLIDERS = [
      {lbl:'Jugador H',  key:'playerH',    min:30,  max:130, step:1   },
      {lbl:'Props H',    key:'propH',       min:16,  max:90,  step:1   },
      {lbl:'Obstáculo H',key:'obstH',       min:20,  max:100, step:1   },
      {lbl:'Plataforma H',key:'platH',      min:6,   max:40,  step:1   },
      {lbl:'Piso H',     key:'floorH',      min:30,  max:180, step:2   },
      {lbl:'BG Far Esc', key:'bgFarScaleY', min:0.3, max:2.5, step:0.05},
      {lbl:'BG Mid Esc', key:'bgMidScaleY', min:0.3, max:2.5, step:0.05},
    ];

    add(this.add.text(PX+6,84,'TAMAÑOS:', {fontFamily:'Lato',fontSize:'8px',color:'#666'}).setDepth(82));

    SLIDERS.forEach((sl, i) => {
      const y = 96 + i*44;
      add(this.add.text(PX+6, y, sl.lbl, {fontFamily:'Lato',fontSize:'8px',color:'#aaa'}).setDepth(82));
      const valTxt = add(this.add.text(PX+PW-6, y, `${s[sl.key]}`, {fontFamily:'Lato',fontSize:'8px',color:'#f5d87a'}).setOrigin(1,0).setDepth(82));
      add(this.add.rectangle(PX+8, y+18, PW-16, 8, 0x1a1a2e).setOrigin(0,0.5).setDepth(82));
      const range = sl.max - sl.min;
      const fw    = Math.max(2,((s[sl.key]-sl.min)/range)*(PW-16));
      const fill  = add(this.add.rectangle(PX+8, y+18, fw, 8, 0xb89a6a).setOrigin(0,0.5).setDepth(83));
      const hdl   = add(this.add.circle(PX+8+fw, y+18, 6, 0xf5d87a).setDepth(84));
      const upd   = (ex) => {
        const t = Phaser.Math.Clamp((ex-(PX+8))/(PW-16),0,1);
        let v = Math.round((sl.min+t*range)/sl.step)*sl.step;
        v = Phaser.Math.Clamp(v, sl.min, sl.max);
        s[sl.key] = v;
        valTxt.setText(Number.isInteger(v)?`${v}`:v.toFixed(2));
        const nfw = Math.max(2,((v-sl.min)/range)*(PW-16));
        fill.width = nfw; hdl.x = PX+8+nfw;
        this._refreshBG(); this._refreshPreviewSprites();
        /* Update sprite scales on existing objects */
        this._objs.forEach(o => {
          if (!o.spr || !o.key) return;
          const tH = o.type==='obstacle' ? s.obstH : s.propH;
          o.spr.setScale(tH / this._texH(o.key));
        });
        this._redrawAll();
      };
      add(this.add.zone(PX+PW/2,y+18,PW-16,16).setInteractive().setDepth(85))
        .on('pointerdown',e=>upd(e.x)).on('pointermove',e=>{ if(this.input.activePointer.isDown) upd(e.x); });
    });

    /* Reset button */
    const resetY = 96 + SLIDERS.length*44 + 4;
    const rg = add(this.add.graphics().setDepth(81));
    rg.fillStyle(0x333322,0.7); rg.fillRoundedRect(PX+4,resetY,PW-8,22,4);
    add(this.add.text(PX+PW/2,resetY+11,'RESET ESCALAS',{fontFamily:'Lato',fontSize:'9px',color:'#cccc88'}).setOrigin(0.5).setDepth(82));
    add(this.add.zone(PX+PW/2,resetY+11,PW-8,22).setInteractive().setDepth(83))
      .on('pointerdown',()=>{
        sfxClick();
        this._scales = {playerH:P_H,propH:48,obstH:60,platH:20,bgFarScaleY:1,bgMidScaleY:1,floorH:TILE_H,goalX:null,worldW:null};
        this._refreshBG(); this._refreshPreviewSprites(); this._redrawAll(); this._showTabContent();
      });
  }

  /* ─── TAB: MUNDO ─── */
  _buildWorldTab() {
    const PW=this.PW, PX=this.PX;
    const add = o => { this._tabContainer.push(o); return o; };
    const lv  = this._lv;
    const s   = this._scales;

    add(this.add.text(PX+6,84,'CONFIGURACIÓN MUNDO:', {fontFamily:'Lato',fontSize:'8px',color:'#666'}).setDepth(82));

    const mkSlider = (label, y, curVal, min, max, step, onVal) => {
      add(this.add.text(PX+6, y, label, {fontFamily:'Lato',fontSize:'8px',color:'#aaa'}).setDepth(82));
      const vTxt = add(this.add.text(PX+PW-6, y, `${curVal}`, {fontFamily:'Lato',fontSize:'8px',color:'#f5d87a'}).setOrigin(1,0).setDepth(82));
      add(this.add.rectangle(PX+8,y+18,PW-16,8,0x1a1a2e).setOrigin(0,0.5).setDepth(82));
      const range = max-min;
      const fw0   = Math.max(2,((curVal-min)/range)*(PW-16));
      const fill  = add(this.add.rectangle(PX+8,y+18,fw0,8,0x44aaff).setOrigin(0,0.5).setDepth(83));
      const hdl   = add(this.add.circle(PX+8+fw0,y+18,6,0x88ccff).setDepth(84));
      const upd   = (ex) => {
        const t = Phaser.Math.Clamp((ex-(PX+8))/(PW-16),0,1);
        const v = Math.round((min+t*range)/step)*step;
        vTxt.setText(`${v}`);
        const fw = Math.max(2,((v-min)/range)*(PW-16)); fill.width=fw; hdl.x=PX+8+fw;
        onVal(v);
      };
      add(this.add.zone(PX+PW/2,y+18,PW-16,16).setInteractive().setDepth(85))
        .on('pointerdown',e=>upd(e.x)).on('pointermove',e=>{ if(this.input.activePointer.isDown) upd(e.x); });
    };

    mkSlider('Ancho Mundo (px)', 96,  s.worldW||lv.worldW, 1000, 12000, 100, v=>{ s.worldW=v; });
    mkSlider('Meta - Vale X',    148, s.goalX||lv.goal,    200,  12000, 50,  v=>{ s.goalX=v; });
    mkSlider('Nivel Y piso',     200, GROUND_Y,             200,  H-20,  4,   v=>{ /* informational */});

    /* Level info */
    add(this.add.text(PX+6,254,`Nivel ${lv.id}: ${lv.label}`,{fontFamily:'Cinzel',fontSize:'10px',color:('#'+lv.color.toString(16).padStart(6,'0'))}).setDepth(82));
    add(this.add.text(PX+6,268,`Plataformas: ${this._objs.filter(o=>o.type==='platform').length}`,{fontFamily:'Lato',fontSize:'9px',color:'#888'}).setDepth(82));
    add(this.add.text(PX+6,280,`Coleccionables: ${this._objs.filter(o=>o.type==='collect').length}`,{fontFamily:'Lato',fontSize:'9px',color:'#888'}).setDepth(82));
    add(this.add.text(PX+6,292,`Obstáculos: ${this._objs.filter(o=>o.type==='obstacle').length}`,{fontFamily:'Lato',fontSize:'9px',color:'#888'}).setDepth(82));

    /* Minimap */
    const mmY=310, mmW=PW-12, mmH=24;
    add(this.add.text(PX+6,mmY-12,'MAPA NIVEL:',{fontFamily:'Lato',fontSize:'8px',color:'#666'}).setDepth(82));
    const mmBg = add(this.add.graphics().setDepth(81));
    mmBg.fillStyle(0x111122,0.9); mmBg.fillRoundedRect(PX+6,mmY,mmW,mmH,3);
    const ww = s.worldW||lv.worldW;
    /* Objects dots on minimap */
    this._objs.forEach(o => {
      const mx = PX+6 + (o.wx/ww)*mmW;
      const col = o.type==='platform'?lv.color:o.type==='collect'?0xffdd44:0xff5555;
      mmBg.fillStyle(col,0.8);
      mmBg.fillRect(Math.round(mx),mmY+mmH-4,2,4);
    });
    /* Camera position */
    const cx = PX+6 + (this._camX/ww)*mmW;
    mmBg.fillStyle(0xffffff,0.5); mmBg.fillRect(Math.round(cx),mmY,Math.round((this.CW/ww)*mmW),mmH);
  }

  /* ════ BOTTOM BAR ════ */
  _buildBottomBar() {
    this.add.rectangle(this.CX, H-18, this.CW, 18, 0x000000, 0.75).setOrigin(0,0).setDepth(80);
    this._coordTxt = this.add.text(this.CX+6, H-9, 'wx:0 wy:0  camX:0',
      {fontFamily:'Lato',fontSize:'8px',color:'rgba(255,255,255,.45)'}).setOrigin(0,0.5).setDepth(81);
    this.add.text(W-6, H-9, 'Click=colocar  Drag=mover  Del=borrar  Wheel/←→=scroll  G=grid  Z=undo  D=dup',
      {fontFamily:'Lato',fontSize:'7px',color:'rgba(255,255,255,.22)'}).setOrigin(1,0.5).setDepth(81);
  }

  /* ════ KEYBOARD ════ */
  _buildKeyboard() {
    const kb = this.input.keyboard;
    const scroll = (dx) => {
      const maxX = (this._scales.worldW||this._lv.worldW) - this.CW;
      this._camX = Phaser.Math.Clamp(this._camX+dx, 0, Math.max(0,maxX));
      this._refreshBG(); this._redrawAll(); this._updateCoords(0,0);
    };
    kb.on('keydown-ESC',    () => this.scene.start('Menu'));
    kb.on('keydown-LEFT',   () => scroll(-60));
    kb.on('keydown-RIGHT',  () => scroll(60));
    kb.on('keydown-DELETE', () => { this._snapshot(); this._deleteSelected(); });
    kb.on('keydown-G',      () => { this._gridSnap=!this._gridSnap; this._drawGrid(); this._showTabContent(); });
    kb.on('keydown-Z',      () => { sfxClick(); this._undo(); });
    kb.on('keydown-D',      () => { sfxClick(); this._duplicateSelected(); });
  }

  /* ════ INTERACTION ════ */
  _snapToGrid(v) { return this._gridSnap ? Math.round(v/40)*40 : v; }

  _onDown(ptr) {
    if (ptr.x < this.CX) return;
    if (ptr.y > H-18)    return;

    /* Resize handle — triangle at right edge of selected platform */
    const selPlat = this._objs.find(o=>o._selected&&o.type==='platform');
    if (selPlat) {
      const sx = (selPlat.wx-this._camX)+this.CX;
      if (ptr.x>=sx+(selPlat.w||120)-2 && ptr.x<=sx+(selPlat.w||120)+14 && ptr.y>=selPlat.wy && ptr.y<=selPlat.wy+this._scales.platH+10) {
        this._drag = {resize:true, obj:selPlat, startW:selPlat.w||120, startX:ptr.x};
        return;
      }
    }

    /* Hit test — collect & obstacle first (sprites are bigger now) */
    let hit = null;
    for (let i=this._objs.length-1; i>=0; i--) {
      const o  = this._objs[i];
      const sx = (o.wx-this._camX)+this.CX;
      const sy = o.wy;
      const ph = this._scales.platH;
      let inside = false;
      if (o.type==='platform') inside = ptr.x>=sx && ptr.x<=sx+(o.w||120) && ptr.y>=sy && ptr.y<=sy+ph;
      else                      inside = Math.hypot(ptr.x-sx, ptr.y-sy) < 28;
      if (inside) { hit=o; break; }
    }

    if (hit) {
      this._objs.forEach(o=>{ o._selected=false; this._redrawObj(o); });
      hit._selected = true; this._redrawObj(hit);
      this._drag = {obj:hit, offX:ptr.x-((hit.wx-this._camX)+this.CX), offY:ptr.y-hit.wy};
      this._showTabContent();
    } else {
      this._snapshot();
      this._objs.forEach(o=>{ o._selected=false; this._redrawObj(o); });
      let wx = this._snapToGrid((ptr.x-this.CX)+this._camX);
      let wy = ptr.y;
      /* Y snap: ground or platform tops */
      if (Math.abs(wy-GROUND_Y) < 24)  wy = GROUND_Y;
      this._objs.filter(o=>o.type==='platform').forEach(p => { if(Math.abs(wy-p.wy)<18) wy=p.wy; });
      wy = this._snapToGrid(wy);

      if      (this._mode==='platform') this._addObj({type:'platform',wx,wy,w:120});
      else if (this._mode==='collect')  this._addObj({type:'collect', wx,wy,key:this._selKey,pts:this._selKey.startsWith('points')?100:0});
      else                               this._addObj({type:'obstacle',wx,wy,key:this._selKey,obsType:this._selKey.includes('life')?'life':'money',patrol:this._patrol});
    }
  }

  _onMove(ptr) {
    this._updateCoords(ptr.x, ptr.y);
    if (!this._drag) return;

    if (this._drag.resize) {
      this._drag.obj.w = Math.max(40, Math.round(this._drag.startW+(ptr.x-this._drag.startX)));
      this._redrawObj(this._drag.obj);
      return;
    }

    const o = this._drag.obj;
    let wx = this._snapToGrid((ptr.x-this._drag.offX)-this.CX+this._camX);
    let wy = ptr.y - this._drag.offY;
    if (Math.abs(wy-GROUND_Y) < 16) wy = GROUND_Y;
    if (this._gridSnap) wy = this._snapToGrid(wy);
    o.wx = wx; o.wy = wy;
    this._redrawObj(o);
  }

  _onUp() {
    if (this._drag) this._snapshot();
    this._drag = null;
  }

  _deleteSelected() {
    this._objs.filter(o=>o._selected).forEach(o => {
      o.gfx?.destroy(); o.lbl?.destroy(); o.rhGfx?.destroy(); o.spr?.destroy();
    });
    this._objs = this._objs.filter(o=>!o._selected);
    this._redrawAll();
    this._showTabContent();
  }

  _duplicateSelected() {
    const sel = this._objs.find(o=>o._selected);
    if (!sel) return;
    this._snapshot();
    const copy = {...sel, wx:sel.wx+40, wy:sel.wy, gfx:undefined, lbl:undefined, rhGfx:undefined, spr:undefined, _selected:false};
    delete copy.gfx; delete copy.lbl; delete copy.rhGfx; delete copy.spr;
    this._addObj(copy);
  }

  _redrawAll() { this._objs.forEach(o=>this._redrawObj(o)); }

  _updateCoords(px, py) {
    const wx = Math.round((px-this.CX)+this._camX);
    const wy = Math.round(py);
    this._coordTxt.setText(`wx:${wx}  wy:${wy}  camX:${Math.round(this._camX)}  objetos:${this._objs.length}`);
  }

  /* ════ UNDO ════ */
  _snapshot() {
    const data = this._objs.map(o => ({
      type:o.type, wx:o.wx, wy:o.wy, w:o.w,
      key:o.key, pts:o.pts, obsType:o.obsType, patrol:o.patrol
    }));
    this._undoStack.push(JSON.stringify(data));
    if (this._undoStack.length > 25) this._undoStack.shift();
  }

  _undo() {
    if (this._undoStack.length < 2) { this._toast('Nada que deshacer',0xff8844); return; }
    this._undoStack.pop();
    const data = JSON.parse(this._undoStack[this._undoStack.length-1]);
    this._objs.forEach(o => { o.gfx?.destroy(); o.lbl?.destroy(); o.rhGfx?.destroy(); o.spr?.destroy(); });
    this._objs = [];
    data.forEach(d => this._addObj(d));
    this._redrawAll();
    this._showTabContent();
    this._toast('Deshecho ↩',0xffaa44);
  }

  /* ════ APPLY TO LEVELS ════ */
  _applyToLevel() {
    const lv = this._lv;
    const s  = this._scales;
    lv.platforms    = this._objs.filter(o=>o.type==='platform').map(o=>({x:Math.round(o.wx),y:Math.round(o.wy),w:o.w||120}));
    lv.collectibles = this._objs.filter(o=>o.type==='collect') .map(o=>({x:Math.round(o.wx),y:Math.round(o.wy),key:o.key,pts:o.pts||0}));
    lv.obstacles    = this._objs.filter(o=>o.type==='obstacle').map(o=>({x:Math.round(o.wx),y:Math.round(o.wy),key:o.key,type:o.obsType||'money',patrol:o.patrol||0}));
    if (this._lvBg.bgFar)  lv.bgFar  = this._lvBg.bgFar;
    if (this._lvBg.bgMid)  lv.bgMid  = this._lvBg.bgMid;
    if (this._lvBg.floor)  lv.floor  = this._lvBg.floor;
    if (s.worldW)          lv.worldW = s.worldW;
    if (s.goalX)           lv.goal   = s.goalX;
  }

  /* ════ EXPORT ════ */
  _export() {
    const lv = this._lv;
    const s  = this._scales;
    const out = {
      id: lv.id, label: lv.label,
      platforms:    this._objs.filter(o=>o.type==='platform').map(o=>({x:Math.round(o.wx),y:Math.round(o.wy),w:o.w||120})),
      collectibles: this._objs.filter(o=>o.type==='collect') .map(o=>({x:Math.round(o.wx),y:Math.round(o.wy),key:o.key,pts:o.pts||0})),
      obstacles:    this._objs.filter(o=>o.type==='obstacle').map(o=>({x:Math.round(o.wx),y:Math.round(o.wy),key:o.key,type:o.obsType||'money',patrol:o.patrol||0})),
      bg: { far:this._lvBg.bgFar||lv.bgFar, mid:this._lvBg.bgMid||lv.bgMid, floor:this._lvBg.floor||lv.floor },
      world: { worldW:s.worldW||lv.worldW, goalX:s.goalX||lv.goal },
    };
    console.log('=== LEVEL EXPORT ===\n'+JSON.stringify(out,null,2));
    this._toast('Exportado → F12 Console', 0x44aaff);
  }

  /* ════ TOAST ════ */
  _toast(msg, col=0xffffff) {
    const t = this.add.text(this.CX+this.CW/2, H/2, msg,
      {fontFamily:'Lato',fontSize:'13px',color:'#'+col.toString(16).padStart(6,'0'),
       backgroundColor:'#001122',padding:{x:14,y:8},borderRadius:6})
      .setOrigin(0.5).setDepth(200);
    this.tweens.add({targets:t,alpha:0,y:t.y-30,delay:1600,duration:500,onComplete:()=>t.destroy()});
  }
}

/* ════════════════════════════════════════════════════
   VICTORY SCENE
════════════════════════════════════════════════════ */
class VictoryScene extends Phaser.Scene {
  constructor() { super({ key:'Victory' }); }
  init(d) { this.finalScore=d.score||0; this.elapsed=d.elapsed||0; }

  create() {
    this.cameras.main.setBackgroundColor('#0a0520');
    for(let i=0;i<80;i++) this.add.circle(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),

    if(this.textures.exists('win_church_background')) this.add.image(W/2,H/2,'win_church_background').setDisplaySize(W,H).setDepth(1).setAlpha(0.55);
    if(this.textures.exists('win_church_people')) this.add.image(W/2,H/2,'win_church_people').setDisplaySize(W,H).setDepth(2).setAlpha(0.8);
    this.add.rectangle(0,0,W,H,0x000000,0.42).setOrigin(0,0).setDepth(3);

    p.fillStyle(0x0a0510,0.93); p.fillRoundedRect(W/2-240,12,480,H-24,14);
    p.lineStyle(2,0xb89a6a,0.9); p.strokeRoundedRect(W/2-240,12,480,H-24,14);

    this.add.text(W/2,28,'✦  ¡VIVAN LOS NOVIOS!  ✦',{fontFamily:'Cinzel',fontSize:'11px',color:'#b89a6a',letterSpacing:4}).setOrigin(0.5).setDepth(5);
    this.add.text(W/2,46,'La Boda de Cris & José',{fontFamily:'Cinzel',fontSize:'22px',color:'#f5e8c0',fontStyle:'italic'}).setOrigin(0.5).setDepth(5);
    this.add.text(W/2,72,'03 · OCTUBRE · 2026',{fontFamily:'Cinzel',fontSize:'10px',color:'rgba(184,154,106,.6)',letterSpacing:3}).setOrigin(0.5).setDepth(5);

    const wk=this.textures.exists('novios_kiss01')?'novios_kiss01':'novios_idle01';
    if(this.textures.exists(wk)){
      const img=this.add.image(W/2,118,wk).setDepth(5);
      img.setScale(86/230);
    }

    this.add.text(W/2,162,`${this.finalScore}`,{fontFamily:'Cinzel',fontSize:'46px',color:'#f5d87a',fontStyle:'bold'}).setOrigin(0.5).setDepth(5);
    this.add.text(W/2,204,'PUNTOS TOTALES',{fontFamily:'Lato',fontSize:'10px',color:'rgba(255,255,255,.4)',letterSpacing:4}).setOrigin(0.5).setDepth(5);

    /* Save & show leaderboard */
    this._save();
    this.add.text(W/2,224,'── TABLA DE HONOR ──',{fontFamily:'Cinzel',fontSize:'10px',color:'rgba(184,154,106,.7)',letterSpacing:3}).setOrigin(0.5).setDepth(5);
    const sc=JSON.parse(localStorage.getItem('camino_scores')||'[]');
    const medals=['🥇','🥈','🥉','4°','5°'];
    sc.slice(0,5).forEach((e,i)=>{
      const y=238+i*20, isMe=e.score===this.finalScore&&e.name===STATE.playerName;
      this.add.text(W/2-210,y,`${medals[i]}  ${e.name}`,{fontFamily:'Lato',fontSize:'12px',color:isMe?'#f5d87a':'rgba(255,255,255,.6)',fontStyle:isMe?'bold':''}).setDepth(5);
      this.add.text(W/2+80,y,`${e.score} pts`,{fontFamily:'Cinzel',fontSize:'11px',color:isMe?'#f5d87a':'rgba(255,255,255,.4)'}).setDepth(5);
    });

    this._btn(W/2-88,H-34,160,'▶ JUGAR DE NUEVO',()=>{ sfxClick(); STATE.level=1; STATE.totalScore=0; this.scene.start('NameEntry'); });
    this._btn(W/2+92,H-34,120,'← MENÚ',()=>{ sfxClick(); this.scene.start('Menu'); });

    /* falling confetti */
    const cols=[0xffd700,0xff6699,0x44aaff,0xff8844,0x44cc88,0xcc44ff];
    for(let i=0;i<50;i++){
      const r=this.add.rectangle(Phaser.Math.Between(0,W),-10,Phaser.Math.Between(4,10),Phaser.Math.Between(4,10),Phaser.Utils.Array.GetRandom(cols)).setDepth(8);
      this.tweens.add({targets:r,y:H+20,angle:Phaser.Math.Between(-360,360),duration:Phaser.Math.Between(2500,5000),delay:Phaser.Math.Between(0,2000),repeat:-1});
    }
    sfxWin();
  }

  _save() {
    const e={name:STATE.playerName,score:this.finalScore,date:new Date().toLocaleDateString('es-MX')};
    const prev=JSON.parse(localStorage.getItem('camino_scores')||'[]');
    prev.push(e); prev.sort((a,b)=>b.score-a.score);
    localStorage.setItem('camino_scores',JSON.stringify(prev.slice(0,10)));
  }

  _btn(x,y,w,lbl,cb){
    const g=this.add.graphics().setDepth(6);
    g.fillStyle(0xb89a6a,0.18); g.fillRoundedRect(x-w/2,y-15,w,30,6);
    g.lineStyle(1.5,0xb89a6a,0.85); g.strokeRoundedRect(x-w/2,y-15,w,30,6);
    const t=this.add.text(x,y,lbl,{fontFamily:'Cinzel',fontSize:'11px',color:'#f5d87a'}).setOrigin(0.5).setDepth(7);
    t.setInteractive(new Phaser.Geom.Rectangle(-w/2,-15,w,30),Phaser.Geom.Rectangle.Contains)
      .on('pointerover',()=>{ g.clear(); g.fillStyle(0xb89a6a,0.45); g.fillRoundedRect(x-w/2,y-15,w,30,6); t.setColor('#fff'); })
      .on('pointerout', ()=>{ g.clear(); g.fillStyle(0xb89a6a,0.18); g.fillRoundedRect(x-w/2,y-15,w,30,6); g.lineStyle(1.5,0xb89a6a,.85); g.strokeRoundedRect(x-w/2,y-15,w,30,6); t.setColor('#f5d87a'); })
      .on('pointerdown',cb);
  }
}
