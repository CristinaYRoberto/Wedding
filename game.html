/* ── Frame animator ── */
class Anim {
  constructor(img, frames, fps = 7) {
    this.img = img; this.fps = fps;
    this._t = 0; this._f = 0; this._frames = frames;
  }
  set(frames, fps = 7) {
    if (this._frames === frames) return;
    this._frames = frames; this.fps = fps; this._f = 0; this._t = 0; this._show();
  }
  update(dt) {
    if (!this._frames || this._frames.length < 2) return;
    this._t += dt;
    if (this._t >= 1000 / this.fps) {
      this._t = 0; this._f = (this._f + 1) % this._frames.length; this._show();
    }
  }
  _show() {
    const k = this._frames[this._f];
    if (this.img.scene && this.img.scene.textures.exists(k)) this.img.setTexture(k);
  }
}

/* ── Audio ── */
let _audioCtx = null;
function getAudio() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function tone(f, d = 0.1, type = 'sine', v = 0.14) {
  try {
    const ctx = getAudio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
    o.start(); o.stop(ctx.currentTime + d);
  } catch (e) {}
}
function chime() { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'sine'), i * 110)); }

/* ═══════════════════════════════════════════════════════════════
   BOOT SCENE
═══════════════════════════════════════════════════════════════ */
class BootScene extends Phaser.Scene {
  constructor() { super({ key: 'Boot' }); }

  preload() {
    this.cameras.main.setBackgroundColor('#1a0a00');
    const bar = this.add.rectangle(W / 2, H / 2, 4, 20, 0xb89a6a);
    this.add.text(W / 2, H / 2 - 28, 'LA BODA DE CRIS Y JOSÉ', {
      fontFamily: 'Cinzel', fontSize: '15px', color: '#f5d87a'
    }).setOrigin(0.5);
    const txt = this.add.text(W / 2, H / 2 + 36, 'Cargando…', {
      fontFamily: 'Lato', fontSize: '11px', color: '#b89a6a'
    }).setOrigin(0.5);

    const all = [...CHAR_KEYS, ...BG_KEYS, ...PROP_KEYS, 'portada', 'ui_besttime', 'ui_score'];
    let n = 0;
    this.load.on('loaderror', f => console.warn('Asset missing:', f.key));
    this.load.on('filecomplete', () => {
      n++; bar.setDisplaySize((n / all.length) * 300, 20);
      txt.setText(`Cargando ${n}/${all.length}…`);
    });
    CHAR_KEYS.forEach(k => this.load.image(k, `assets/characters/${k}.png`));
    BG_KEYS.forEach(k => this.load.image(k, `assets/bg/${k}.png`));
    PROP_KEYS.forEach(k => this.load.image(k, `assets/props/${k}.png`));
    this.load.image('portada', 'assets/UI/GamePortada.png');
    this.load.image('ui_besttime', 'assets/UI/UI-BestTime.png');
    this.load.image('ui_score', 'assets/UI/UI-Score.png');
  }

  create() { this.scene.start('Menu'); }
}

/* ═══════════════════════════════════════════════════════════════
   GAME SCENE
═══════════════════════════════════════════════════════════════ */
class GameScene extends Phaser.Scene {
  constructor() { super({ key: 'Game' }); }

  init() {
    this.score = 0;
    this.lives = 3;
    this.elapsed = 0;
    this.worldX = 0;         /* camera / world scroll position */
    this.velX = 0;
    this.velY = 0;
    this.isGrounded = true;
    this.jumpCount = 0;
    this.shielded = false;
    this.boosted = false;
    this.shieldT = 0;
    this.boostT = 0;
    this.hitCooldown = 0;
    this.victoryStarted = false;
    this.themeIndex = 0;
    this.themeAlpha = 0;      /* 0→1 transition progress */
    this.items = [];
    this.cats = [];
    this.spawnX = W + 300;   /* next spawn world-x */
    this.keys = {};
    this.touch = { left: false, right: false, jump: false };
  }

  /* ── helpers ── */
  _imgScale(key, targetH) {
    const t = this.textures.get(key).getSourceImage();
    return (t && t.height) ? targetH / t.height : 1;
  }

  _scaledTile(worldY, height, key, depth) {
    const scale = this._imgScale(key, height);
    const tex = this.textures.get(key).getSourceImage();
    const tw = tex ? tex.width : W;
    const ts = this.add.tileSprite(0, worldY, tw, tex ? tex.height : height, key)
      .setOrigin(0, 0).setDepth(depth).setScale(scale);
    return ts;
  }

  create() {
    /* Backgrounds — two sets for crossfade */
    this.bgFarA  = this._scaledTile(0, H, 'bg_beach_far', 0);
    this.bgFarB  = this._scaledTile(0, H, 'bg_beach_far', 0).setAlpha(0);
    this.bgMidA  = this._scaledTile(0, H - 85, 'bg_beach_mid', 1);
    this.bgMidB  = this._scaledTile(0, H - 85, 'bg_beach_mid', 1).setAlpha(0);
    this.gndA    = this._scaledTile(H - 85, 85, 'floor_beach', 3);
    this.gndB    = this._scaledTile(H - 85, 85, 'floor_beach', 3).setAlpha(0);

    /* Player */
    this.playerX = 120;   /* world-space X, player always near left of screen */
    this.playerY = GROUND_Y;
    this.playerImg = this.add.image(120, GROUND_Y, 'novios_running01')
      .setOrigin(0.5, 1).setDepth(10);
    this.playerImg.setScale(this._imgScale('novios_running01', 100));
    this.playerAnim = new Anim(this.playerImg, ANIMS.novios.idle, 7);
    this.shadow = this.add.ellipse(120, GROUND_Y + 4, 80, 12, 0x000000, 0.18).setDepth(3);

    /* Vale — placed at end of world */
    this.valeWorldX = WORLD_W - 160;
    this.valeImg = this.add.image(this.valeWorldX - this.worldX, GROUND_Y, 'vale_idle-Stand01')
      .setOrigin(0.5, 1).setDepth(8);
    this.valeImg.setScale(this._imgScale('vale_idle-Stand01', 140));
    this.valeAnim = new Anim(this.valeImg, ANIMS.vale.idle, 3);

    /* HUD */
    this._buildHUD();

    /* Mobile controls */
    this._buildMobileControls();

    /* Keyboard */
    const kb = this.input.keyboard;
    this.keys.left  = kb.addKey(Phaser.Input.Keyboard.KeyCodes.LEFT);
    this.keys.right = kb.addKey(Phaser.Input.Keyboard.KeyCodes.RIGHT);
    this.keys.up    = kb.addKey(Phaser.Input.Keyboard.KeyCodes.UP);
    this.keys.space = kb.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.keys.a     = kb.addKey(Phaser.Input.Keyboard.KeyCodes.A);
    this.keys.d     = kb.addKey(Phaser.Input.Keyboard.KeyCodes.D);
    this.keys.w     = kb.addKey(Phaser.Input.Keyboard.KeyCodes.W);

    kb.on('keydown-UP',    () => this._jump());
    kb.on('keydown-SPACE', () => this._jump());
    kb.on('keydown-W',     () => this._jump());

    /* Pre-spawn items and cats across the world */
    this._preSpawnWorld();
  }

  _buildHUD() {
    /* Score */
    const uiScoreImg = this.add.image(10, 10, 'ui_score').setOrigin(0, 0).setDepth(50);
    uiScoreImg.setScale(this._imgScale('ui_score', 46));
    this.scoreTxt = this.add.text(
      10 + (uiScoreImg.displayWidth) / 2,
      10 + (uiScoreImg.displayHeight) / 2,
      'PUNTOS  0',
      { fontFamily: 'Cinzel', fontSize: '13px', color: '#ffffff', fontStyle: 'bold' }
    ).setOrigin(0.5).setDepth(51);

    /* Timer */
    const uiTimeImg = this.add.image(W - 10, 10, 'ui_besttime').setOrigin(1, 0).setDepth(50);
    uiTimeImg.setScale(this._imgScale('ui_besttime', 46));
    this.timeTxt = this.add.text(
      W - 10 - uiTimeImg.displayWidth / 2,
      10 + uiTimeImg.displayHeight / 2,
      '0:00',
      { fontFamily: 'Cinzel', fontSize: '13px', color: '#ffffff', fontStyle: 'bold' }
    ).setOrigin(0.5).setDepth(51);

    /* Progress bar */
    this.add.graphics().setDepth(51)
      .lineStyle(1, 0x444400, 1)
      .strokeRect(W / 2 - 150, 30, 300, 10);
    this.add.graphics().setDepth(52)
      .fillStyle(0xffd700, 1)
      .fillCircle(W / 2 + 150, 35, 6);
    this.progBar = this.add.graphics().setDepth(52);

    /* Lives + status */
    this.livesTxt = this.add.text(12, 46, '❤️❤️❤️', {
      fontFamily: 'Lato', fontSize: '11px', color: '#ff4444'
    }).setDepth(52);
    this.shTxt = this.add.text(90, 46, '', {
      fontFamily: 'Lato', fontSize: '11px', color: '#44aaff'
    }).setDepth(52);
    this.bsTxt = this.add.text(160, 46, '', {
      fontFamily: 'Lato', fontSize: '11px', color: '#ffaa00'
    }).setDepth(52);
  }

  _buildMobileControls() {
    const btnStyle = { fontFamily: 'Lato', fontSize: '22px', color: '#ffffff' };
    const alpha = 0.45;
    const btnH = H - 26;

    const mkBtn = (x, label, w, h, cb) => {
      const g = this.add.graphics().setDepth(60).setScrollFactor(0);
      g.fillStyle(0xffffff, alpha); g.fillRoundedRect(x - w / 2, btnH - h / 2, w, h, 8);
      const t = this.add.text(x, btnH, label, btnStyle).setOrigin(0.5).setDepth(61).setScrollFactor(0);
      const z = this.add.zone(x, btnH, w, h).setInteractive().setScrollFactor(0).setDepth(62);
      z.on('pointerdown', () => cb(true));
      z.on('pointerup', () => cb(false));
      z.on('pointerout', () => cb(false));
      return { g, t, z };
    };

    mkBtn(36, '←', 54, 44, v => this.touch.left = v);
    mkBtn(96, '→', 54, 44, v => this.touch.right = v);
    mkBtn(W - 46, '↑', 54, 44, v => { if (v) this._jump(); });

    /* Only show on touch */
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (!isTouchDevice) {
      /* hide — still functional for hybrid devices */
    }
  }

  _preSpawnWorld() {
    /* Collectibles */
    const ptTypes = ['points_01','points_02','points_03','points_04','points_05'];
    const bmTypes = ['blocker_money_01','blocker_money_02','blocker_money_03','blocker_money-04'];
    const blTypes = ['blocker_life-01','blocker_life-02','blocker_life-03'];
    const pwTypes = ['booster','life','shield'];

    let wx = 600;
    while (wx < WORLD_W - 300) {
      const r = Math.random();
      let key, cat;
      if (r < 0.45)      { key = Phaser.Utils.Array.GetRandom(ptTypes); cat = 'points'; }
      else if (r < 0.65) { key = Phaser.Utils.Array.GetRandom(bmTypes); cat = 'block_money'; }
      else if (r < 0.82) { key = Phaser.Utils.Array.GetRandom(blTypes); cat = 'block_life'; }
      else               { key = Phaser.Utils.Array.GetRandom(pwTypes); cat = 'powerup'; }

      /* Varying heights: ground / elevated / floating */
      const h = (cat === 'block_money') ? GROUND_Y - Phaser.Math.Between(60, 130)
              : (cat === 'powerup')      ? GROUND_Y - Phaser.Math.Between(40, 100)
              : GROUND_Y;

      const img = this.add.image(wx - this.worldX, h, key)
        .setOrigin(0.5, 1).setDepth(7);
      img.setScale(this._imgScale(key, 55));
      if (cat !== 'block_life') {
        this.tweens.add({ targets: img, alpha: { from: 0.6, to: 1 }, duration: 500, yoyo: true, repeat: -1 });
      }
      img._wx = wx;
      img._cat = cat;
      img._key = key;
      img._alive = true;
      this.items.push(img);

      wx += Phaser.Math.Between(180, 420);
    }

    /* Cats */
    const catDefs = [
      { key: 'iker',  effect: 'shield',  label: '🛡 ¡ESCUDO!' },
      { key: 'finch', effect: 'points',  label: '+500 PUNTOS' },
      { key: 'pilly', effect: 'boost',   label: '⚡ ¡TURBO!' },
    ];
    let cx = 500;
    while (cx < WORLD_W - 400) {
      cx += Phaser.Math.Between(600, 1100);
      const d = Phaser.Utils.Array.GetRandom(catDefs);
      const sleeping = Math.random() < 0.3;
      const frames = sleeping ? ANIMS[d.key].sleep : ANIMS[d.key].idle;
      const img = this.add.image(cx - this.worldX, GROUND_Y, frames[0])
        .setOrigin(0.5, 1).setDepth(9);
      img.setScale(this._imgScale(frames[0], 60));
      img._wx = cx;
      img._catKey = d.key;
      img._effect = d.effect;
      img._label = d.label;
      img._alive = true;
      img._anim = new Anim(img, frames, 5);
      this.cats.push(img);
    }
  }

  /* ── Jump ── */
  _jump() {
    if (this.victoryStarted) return;
    if (this.jumpCount >= 2) return;
    this.velY = -510;
    this.jumpCount++;
    this.isGrounded = false;
    this.playerAnim.set(ANIMS.novios.jump, 6);
    tone(440, 0.08, 'square');
    this._burst();
  }

  /* ── Update ── */
  update(_t, dt) {
    if (this.victoryStarted) return;
    const dts = dt / 1000;

    /* ── Input ── */
    const goLeft  = this.keys.left.isDown  || this.keys.a.isDown    || this.touch.left;
    const goRight = this.keys.right.isDown || this.keys.d.isDown    || this.touch.right;

    const baseSpeed = this.boosted ? 260 : 180;
    if (goRight)     this.velX =  baseSpeed;
    else if (goLeft) this.velX = -baseSpeed;
    else             this.velX = 0;

    /* ── Physics ── */
    if (!this.isGrounded) {
      this.velY += GRAVITY * dts;
      this.playerY += this.velY * dts;
    }
    if (this.playerY >= GROUND_Y) {
      this.playerY = GROUND_Y; this.velY = 0;
      if (!this.isGrounded) { this.isGrounded = true; this.jumpCount = 0; }
    }

    /* ── World scroll (camera follow) ── */
    const targetWorldX = Math.max(0, Math.min(this.playerX - 120, WORLD_W - W));
    this.worldX += (targetWorldX - this.worldX) * Math.min(1, dts * 12);

    /* Move player in world space */
    this.playerX = Math.max(60, Math.min(WORLD_W - 60, this.playerX + this.velX * dts));
    this.playerImg.x = this.playerX - this.worldX;
    this.playerImg.y = this.playerY;
    this.playerImg.setFlipX(this.velX < 0);

    /* Shadow */
    const airFrac = Math.max(0, 1 - (GROUND_Y - this.playerY) / 200);
    this.shadow.setPosition(this.playerImg.x, GROUND_Y + 4).setScale(airFrac, 1).setAlpha(0.18 * airFrac);

    /* ── Animation state ── */
    if (!this.hitCooldown) {
      if (!this.isGrounded)     this.playerAnim.set(ANIMS.novios.jump, 6);
      else if (Math.abs(this.velX) > 10) this.playerAnim.set(ANIMS.novios.run, 8);
      else                      this.playerAnim.set(ANIMS.novios.idle, 5);
    }

    /* ── Theme transitions ── */
    this._updateTheme(dts);

    /* ── Parallax scroll ── */
    const spd = Math.abs(this.velX) > 10 ? Math.abs(this.velX) : 60;
    const dir = this.velX >= 0 ? 1 : -1;
    this.bgFarA.tilePositionX  += spd * 0.08 * dts * dir;
    this.bgFarB.tilePositionX  += spd * 0.08 * dts * dir;
    this.bgMidA.tilePositionX  += spd * 0.25 * dts * dir;
    this.bgMidB.tilePositionX  += spd * 0.25 * dts * dir;
    this.gndA.tilePositionX    += spd * dts * dir;
    this.gndB.tilePositionX    += spd * dts * dir;

    /* ── Items ── */
    this.items.forEach(item => {
      if (!item._alive) return;
      item.x = item._wx - this.worldX;
    });

    /* ── Cats ── */
    this.cats.forEach(cat => {
      if (!cat._alive) return;
      cat.x = cat._wx - this.worldX;
      if (cat._anim) cat._anim.update(dt);
    });

    /* ── Vale ── */
    this.valeImg.x = this.valeWorldX - this.worldX;
    this.valeAnim.update(dt);

    /* ── Collisions ── */
    this._checkCollisions();

    /* ── Victory check ── */
    const distToVale = this.valeWorldX - this.playerX;
    if (distToVale < 80 && !this.victoryStarted) {
      this._startVictory();
      return;
    }

    /* ── Timers ── */
    this.elapsed += dts;
    if (this.hitCooldown > 0) this.hitCooldown -= dt;

    if (this.shielded) {
      this.shieldT -= dt;
      this.shTxt.setText(`🛡 ${(this.shieldT / 1000).toFixed(1)}s`);
      if (this.shieldT <= 0) { this.shielded = false; this.shTxt.setText(''); }
    }
    if (this.boosted) {
      this.boostT -= dt;
      this.bsTxt.setText(`⚡ ${(this.boostT / 1000).toFixed(1)}s`);
      if (this.boostT <= 0) { this.boosted = false; this.bsTxt.setText(''); }
    }

    /* ── HUD ── */
    this.playerAnim.update(dt);
    this._updateHUD();
  }

  _updateTheme(dts) {
    let nextTheme = 0;
    for (let i = THEME_STARTS.length - 1; i >= 0; i--) {
      if (this.playerX >= THEME_STARTS[i]) { nextTheme = i; break; }
    }
    if (nextTheme !== this.themeIndex) {
      const t = THEMES[nextTheme];
      this.bgFarB.setTexture(`bg_${t}_far`);
      this.bgMidB.setTexture(`bg_${t}_mid`);
      this.gndB.setTexture(`floor_${t}`);
      this.bgFarB.setAlpha(0); this.bgMidB.setAlpha(0); this.gndB.setAlpha(0);

      this.tweens.add({
        targets: [this.bgFarB, this.bgMidB, this.gndB],
        alpha: 1, duration: 1200,
        onComplete: () => {
          const t2 = THEMES[nextTheme];
          this.bgFarA.setTexture(`bg_${t2}_far`).setAlpha(1);
          this.bgMidA.setTexture(`bg_${t2}_mid`).setAlpha(1);
          this.gndA.setTexture(`floor_${t2}`).setAlpha(1);
          this.bgFarB.setAlpha(0); this.bgMidB.setAlpha(0); this.gndB.setAlpha(0);
        }
      });
      this.themeIndex = nextTheme;
    }
  }

  _checkCollisions() {
    const px = this.playerImg.x, py = this.playerImg.y;
    const pr = 50;

    /* Items */
    this.items.forEach(item => {
      if (!item._alive) return;
      const dx = item.x - px, dy = item.y - py;
      if (Math.sqrt(dx * dx + dy * dy) > pr) return;
      item._alive = false;

      switch (item._cat) {
        case 'points': {
          const pts = { points_01:100,points_02:200,points_03:300,points_04:150,points_05:250 };
          const add = pts[item._key] || 100;
          this.score += add;
          this._popup(item.x, item.y, `+${add}`, 0xffdd44);
          chime();
          break;
        }
        case 'block_money':
          if (this.shielded) { this._popup(item.x, item.y, 'BLOCKED!', 0x44aaff); }
          else {
            this.score = Math.max(0, this.score - 200);
            this._popup(item.x, item.y, '-200 💸', 0xff4444);
            tone(120, 0.25, 'sawtooth');
            this._hitEffect();
          }
          break;
        case 'block_life':
          if (this.shielded) { this._popup(item.x, item.y, 'BLOCKED!', 0x44aaff); }
          else {
            this.lives--;
            this._popup(item.x, item.y, '-1 VIDA 💔', 0xff4444);
            this._updateLives();
            tone(120, 0.25, 'sawtooth');
            this._hitEffect();
            if (this.lives <= 0) { this._gameOver(); return; }
          }
          break;
        case 'powerup':
          if (item._key === 'life') {
            this.lives = Math.min(this.lives + 1, 5);
            this._updateLives();
            this._popup(item.x, item.y, '+1 VIDA ❤️', 0xff4444);
            chime();
          } else if (item._key === 'shield') {
            this.shielded = true; this.shieldT = 6000;
            this._popup(item.x, item.y, '🛡 ¡ESCUDO!', 0x44aaff);
            chime();
          } else if (item._key === 'booster') {
            this.boosted = true; this.boostT = 5000;
            this._popup(item.x, item.y, '⚡ ¡TURBO!', 0xffaa00);
            tone(660, 0.2, 'square');
          }
          break;
      }
      this.tweens.add({ targets: item, alpha: 0, scaleX: 2, scaleY: 2, duration: 300, onComplete: () => item.destroy() });
    });

    /* Cats */
    this.cats.forEach(cat => {
      if (!cat._alive) return;
      const dx = cat.x - px, dy = cat.y - py;
      if (Math.sqrt(dx * dx + dy * dy) > pr + 10) return;
      cat._alive = false;
      cat._anim && cat._anim.set(ANIMS[cat._catKey].happy, 8);

      switch (cat._effect) {
        case 'shield':
          this.shielded = true; this.shieldT = 6000;
          this._popup(cat.x, cat.y, cat._label, 0x44aaff);
          chime(); break;
        case 'points':
          this.score += 500;
          this._popup(cat.x, cat.y, cat._label, 0xffdd44);
          chime(); break;
        case 'boost':
          this.boosted = true; this.boostT = 5000;
          this._popup(cat.x, cat.y, cat._label, 0xffaa00);
          tone(660, 0.2, 'square'); break;
      }
      this.time.delayedCall(600, () => {
        this.tweens.add({ targets: cat, alpha: 0, y: cat.y - 30, duration: 500, onComplete: () => cat.destroy() });
      });
    });
  }

  _hitEffect() {
    if (this.hitCooldown > 0) return;
    this.hitCooldown = 1500;
    this.velY = -300;
    this.isGrounded = false;
    this.playerAnim.set(ANIMS.novios.hit, 4);
    this.cameras.main.shake(150, 0.012);
    this.cameras.main.flash(100, 255, 60, 60);
    this.time.delayedCall(400, () => {
      if (!this.victoryStarted) this.playerAnim.set(ANIMS.novios.idle, 5);
    });
  }

  _gameOver() {
    this.victoryStarted = true;
    this.speed = 0;
    this._popup(this.playerImg.x, this.playerImg.y - 40, 'GAME OVER', 0xff2222);
    this.cameras.main.shake(300, 0.02);
    this.time.delayedCall(2000, () => this.scene.start('Menu'));
  }

  _startVictory() {
    this.victoryStarted = true;
    this.velX = 0;

    /* Vale reacts */
    this.valeAnim.set(ANIMS.vale.happy, 6);

    /* Fade to win scene */
    this.cameras.main.fadeOut(1200, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => {
      /* Build win scene in-place */
      this.cameras.main.setBackgroundColor('#0a0520');
      this.bgFarA.setAlpha(0); this.bgFarB.setAlpha(0);
      this.bgMidA.setAlpha(0); this.bgMidB.setAlpha(0);
      this.gndA.setAlpha(0);   this.gndB.setAlpha(0);

      this.add.image(W / 2, H / 2, 'win_church_background').setDisplaySize(W, H).setDepth(4);
      this.add.image(W / 2, H / 2, 'win_church_people').setDisplaySize(W, H).setDepth(5);
      this.add.image(W / 2, H, 'win_floor_church').setDisplaySize(W, H * 0.35).setOrigin(0.5, 1).setDepth(5);

      /* Reset positions */
      this.playerImg.x = W / 2 - 60;
      this.playerImg.y = GROUND_Y;
      this.valeImg.x = W / 2 + 60;
      this.valeImg.y = GROUND_Y;
      this.valeImg.setDepth(8);

      this.cameras.main.fadeIn(800);

      /* Walk toward each other */
      this.playerAnim.set(ANIMS.novios.walk, 6);
      this.tweens.add({
        targets: this.playerImg, x: W / 2 - 18, duration: 1400, ease: 'Sine.Out',
        onComplete: () => {
          this.playerAnim.set(ANIMS.novios.kiss, 5);
          this.valeAnim.set(ANIMS.vale.happy, 4);
          chime();
          this._confetti();

          const bonus = Math.max(0, Math.floor(5000 - this.elapsed * 10));
          this.score += bonus;
          const prev = JSON.parse(localStorage.getItem('boda_scores') || '[]');
          prev.unshift({ score: this.score, time: Math.round(this.elapsed), date: new Date().toLocaleDateString('es-MX') });
          prev.sort((a, b) => b.score - a.score);
          localStorage.setItem('boda_scores', JSON.stringify(prev.slice(0, 10)));

          this.time.delayedCall(1200, () => {
            this.playerAnim.set(ANIMS.novios.dance, 5);
            this.time.delayedCall(2000, () => {
              this.playerAnim.set(ANIMS.novios.win, 6);
              this.time.delayedCall(1500, () => {
                this.scene.start('Victory', { score: this.score, elapsed: this.elapsed });
              });
            });
          });
        }
      });
    });
  }

  _updateHUD() {
    this.scoreTxt.setText(`PUNTOS  ${this.score}`);
    const m = Math.floor(this.elapsed / 60);
    const s = Math.floor(this.elapsed % 60).toString().padStart(2, '0');
    this.timeTxt.setText(`${m}:${s}`);
    const prog = Math.min(this.playerX / WORLD_W, 1);
    this.progBar.clear();
    this.progBar.fillStyle(0xb89a6a, 1).fillRect(W / 2 - 150, 30, 300 * prog, 10);
  }

  _updateLives() {
    let h = '';
    for (let i = 0; i < this.lives; i++) h += '❤️';
    this.livesTxt.setText(h);
  }

  _popup(x, y, msg, col) {
    const t = this.add.text(
      Math.max(20, Math.min(x, W - 20)), y - 30, msg,
      { fontFamily: 'Lato', fontSize: '12px', fontStyle: 'bold', color: '#' + col.toString(16).padStart(6, '0'), stroke: '#000', strokeThickness: 3 }
    ).setOrigin(0.5, 1).setDepth(60);
    this.tweens.add({ targets: t, y: t.y - 40, alpha: 0, duration: 1100, onComplete: () => t.destroy() });
  }

  _confetti() {
    const cols = [0xffd700, 0xff6699, 0x44aaff, 0xff8844, 0x44cc88, 0xcc44ff];
    for (let i = 0; i < 60; i++) this.time.delayedCall(i * 60, () => {
      const r = this.add.rectangle(
        Phaser.Math.Between(60, W - 60),
        Phaser.Math.Between(10, H - 10),
        8, 8, Phaser.Utils.Array.GetRandom(cols)
      ).setDepth(70);
      this.tweens.add({ targets: r, y: r.y + 60, alpha: 0, angle: Phaser.Math.Between(-180, 180), duration: 1400, onComplete: () => r.destroy() });
    });
  }

  _burst() {
    for (let i = 0; i < 6; i++) {
      const r = this.add.rectangle(
        this.playerImg.x + Phaser.Math.Between(-20, 20), this.playerImg.y,
        6, 6, Phaser.Utils.Array.GetRandom([0xffd700, 0xff6699, 0x44aaff])
      ).setDepth(15);
      this.tweens.add({ targets: r, y: r.y + 30, alpha: 0, duration: 400, onComplete: () => r.destroy() });
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   VICTORY SCENE
═══════════════════════════════════════════════════════════════ */
class VictoryScene extends Phaser.Scene {
  constructor() { super({ key: 'Victory' }); }
  init(d) { this.finalScore = d.score || 0; this.elapsed = d.elapsed || 0; }

  create() {
    this.cameras.main.setBackgroundColor('#0a0a1a');
    for (let i = 0; i < 60; i++)
      this.add.circle(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
        Phaser.Math.Between(1, 3), 0xffffff, Phaser.Math.FloatBetween(0.2, 0.9)
      );

    const p = this.add.graphics();
    p.fillStyle(0x1a0e00, 0.96); p.fillRoundedRect(W / 2 - 260, 28, 520, H - 56, 12);
    p.lineStyle(2, 0xb89a6a, 1); p.strokeRoundedRect(W / 2 - 260, 28, 520, H - 56, 12);

    this.add.text(W / 2, 44, '✦  ¡VIVAN LOS NOVIOS!  ✦', {
      fontFamily: 'Cinzel', fontSize: '13px', color: '#f5d87a', letterSpacing: 2
    }).setOrigin(0.5);
    this.add.text(W / 2, 64, 'La Boda de Cris y José', {
      fontFamily: 'Cinzel', fontSize: '19px', color: '#fff', fontStyle: 'italic'
    }).setOrigin(0.5);

    const wk = this.textures.exists('novios_win01') ? 'novios_win01' : 'novios_kiss01';
    this.add.image(W / 2, 108, wk).setDisplaySize(108, 96);

    const m = Math.floor(this.elapsed / 60);
    const s = Math.floor(this.elapsed % 60).toString().padStart(2, '0');
    this.add.text(W / 2, 152, `${this.finalScore}`, {
      fontFamily: 'Cinzel', fontSize: '44px', color: '#f5d87a', fontStyle: 'bold'
    }).setOrigin(0.5);
    this.add.text(W / 2, 194, 'PUNTOS', {
      fontFamily: 'Lato', fontSize: '11px', color: 'rgba(255,255,255,.4)', letterSpacing: 4
    }).setOrigin(0.5);
    this.add.text(W / 2, 212, `Tiempo: ${m}:${s}`, {
      fontFamily: 'Lato', fontSize: '11px', color: '#aaddff'
    }).setOrigin(0.5);

    this.add.text(W / 2, 232, '— TABLA DE LÍDERES —', {
      fontFamily: 'Cinzel', fontSize: '10px', color: '#b89a6a', letterSpacing: 3
    }).setOrigin(0.5);
    const sc = JSON.parse(localStorage.getItem('boda_scores') || '[]').slice(0, 5);
    if (!sc.length) this.add.text(W / 2, 258, '(sin récords aún)', {
      fontFamily: 'Lato', fontSize: '11px', color: 'rgba(255,255,255,.3)'
    }).setOrigin(0.5);
    const medals = ['🥇', '🥈', '🥉', '4º', '5º'];
    sc.forEach((entry, i) => {
      const y = 250 + i * 21;
      const isMe = i === 0 && entry.score === this.finalScore;
      this.add.text(W / 2 - 130, y,
        `${medals[i]}  ${entry.score} pts`,
        { fontFamily: 'Lato', fontSize: '12px', color: isMe ? '#f5d87a' : 'rgba(255,255,255,.6)', fontStyle: isMe ? 'bold' : '' }
      );
      this.add.text(W / 2 + 55, y,
        `${entry.time}s · ${entry.date}`,
        { fontFamily: 'Lato', fontSize: '10px', color: 'rgba(255,255,255,.35)' }
      );
    });

    this._btn(W / 2 - 108, H - 68, 190, '▶ JUGAR DE NUEVO', () => this.scene.start('Game'));
    this._btn(W / 2 + 100, H - 68, 148, '← MENÚ', () => this.scene.start('Menu'));

    const cols = [0xffd700, 0xff6699, 0x44aaff, 0xff8844];
    for (let i = 0; i < 50; i++) {
      const r = this.add.rectangle(
        Phaser.Math.Between(0, W), Phaser.Math.Between(-20, 0),
        Phaser.Math.Between(4, 10), Phaser.Math.Between(4, 10),
        Phaser.Utils.Array.GetRandom(cols)
      );
      this.tweens.add({
        targets: r, y: H + 20,
        angle: Phaser.Math.Between(-360, 360),
        duration: Phaser.Math.Between(2000, 5000),
        delay: Phaser.Math.Between(0, 2000),
        repeat: -1
      });
    }
  }

  _btn(x, y, w, label, cb) {
    const g = this.add.graphics();
    g.fillStyle(0xb89a6a, 0.15); g.fillRoundedRect(x - w / 2, y - 15, w, 30, 6);
    g.lineStyle(1.5, 0xb89a6a, 1); g.strokeRoundedRect(x - w / 2, y - 15, w, 30, 6);
    const t = this.add.text(x, y, label, { fontFamily: 'Cinzel', fontSize: '11px', color: '#f5d87a' }).setOrigin(0.5);
    t.setInteractive(new Phaser.Geom.Rectangle(-w / 2, -15, w, 30), Phaser.Geom.Rectangle.Contains)
      .on('pointerover', () => { g.clear(); g.fillStyle(0xb89a6a, 0.5); g.fillRoundedRect(x - w / 2, y - 15, w, 30, 6); t.setColor('#fff'); })
      .on('pointerout',  () => { g.clear(); g.fillStyle(0xb89a6a, 0.15); g.fillRoundedRect(x - w / 2, y - 15, w, 30, 6); g.lineStyle(1.5, 0xb89a6a, 1); g.strokeRoundedRect(x - w / 2, y - 15, w, 30, 6); t.setColor('#f5d87a'); })
      .on('pointerdown', cb);
  }
}

/* ─── Launch ─── */
new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  backgroundColor: '#1a0a00',
  parent: 'game-container',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
  scene: [BootScene, MenuScene, GameScene, VictoryScene],
});

document.getElementById('game-container').addEventListener('dblclick', () => {
  document.fullscreenElement
    ? document.exitFullscreen()
    : document.getElementById('game-container').requestFullscreen?.();
});
</script>
