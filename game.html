<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Memory Game</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fdf8f0;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .card-scene {
      width: 100%;
      height: 100%;
      perspective: 800px;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      overflow: hidden;
    }
    .card-back { background: #fdf8f0; }
    .card-front { transform: rotateY(180deg); }
    @keyframes matchGlow {
      0%   { box-shadow: 0 0 0 0 rgba(201,168,76,0); }
      40%  { box-shadow: 0 0 20px 8px rgba(201,168,76,0.8); }
      100% { box-shadow: 0 0 0 0 rgba(201,168,76,0); }
    }
    .card-matched { animation: matchGlow 1s ease forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.5s ease forwards; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.05); }
    }
    .btn-primary {
      background: linear-gradient(135deg, #c9a84c, #e8c96b);
      color: #3d2b00;
      border: none;
      padding: 12px 32px;
      font-size: 1rem;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 15px rgba(201,168,76,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201,168,76,0.6);
    }
    .btn-secondary {
      background: transparent;
      color: #8b4a6b;
      border: 2px solid #8b4a6b;
      padding: 10px 24px;
      font-size: 0.9rem;
      font-family: 'Playfair Display', Georgia, serif;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #8b4a6b;
      color: #fff;
    }
    input[type="text"] {
      background: rgba(255,255,255,0.8);
      border: 2px solid #c9a84c;
      border-radius: 25px;
      padding: 10px 20px;
      font-size: 1rem;
      font-family: 'Playfair Display', Georgia, serif;
      color: #3d2b00;
      outline: none;
      width: 100%;
      max-width: 300px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: #8b4a6b;
      box-shadow: 0 0 0 3px rgba(139,74,107,0.15);
    }
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(61,43,0,0.5);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: fadeIn 0.3s ease;
    }
    .modal-box {
      background: linear-gradient(145deg, #fdf8f0, #fff9f0);
      border: 2px solid #c9a84c;
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(61,43,0,0.3);
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #fdf8f0; }
    ::-webkit-scrollbar-thumb { background: #c9a84c; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

// ── Storage (window.storage if available, else localStorage) ──────────────────
const storage = window.storage || {
  getItem: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  setItem: (k, v) => { try { localStorage.setItem(k, v); } catch {} }

// ── Constants ─────────────────────────────────────────────────────────────────
const DIFFICULTIES = {
  Easy:   { cards: 8,  cols: 4, rows: 2, pairs: 4,  base: 1000 },
  Medium: { cards: 16, cols: 4, rows: 4, pairs: 8,  base: 2500 },
  Hard:   { cards: 32, cols: 8, rows: 4, pairs: 16, base: 5000 },
};
const WEDDING_IMAGE = 'assets/UI/GamePortada.png';

// ── Floral SVG corner decoration ──────────────────────────────────────────────

      <circle cx="14" cy="30" r="2" fill="#c9a84c"/>

      <path d="M10 10 Q2 20 14 30" stroke="#c9a84c" strokeWidth="1.5" fill="none"/>
      <path d="M22 8 Q35 5 38 18" stroke="#8b4a6b" strokeWidth="1" fill="none"/>
      <path d="M8 22 Q5 35 18 38" stroke="#8b4a6b" strokeWidth="1" fill="none"/>

      <text x="30" y="75" fontSize="14" fill="#8b4a6b" opacity="0.5">❀</text>
      <text x="60" y="28" fontSize="14" fill="#c9a84c" opacity="0.4">❀</text>

);

// ── Card back SVG pattern ─────────────────────────────────────────────────────
const CardBackSVG = () => (

    <rect width="100" height="100" fill="#fdf8f0"/>
    <rect x="4" y="4" width="92" height="92" rx="6" fill="none" stroke="#c9a84c" strokeWidth="1.5"/>
    <rect x="8" y="8" width="84" height="84" rx="4" fill="none" stroke="#c9a84c" strokeWidth="0.5" strokeDasharray="3,3"/>
    <circle cx="38" cy="50" r="10" fill="none" stroke="#c9a84c" strokeWidth="2"/>
    <circle cx="52" cy="50" r="10" fill="none" stroke="#c9a84c" strokeWidth="2"/>
    <path d="M50 30 C50 27 46 24 43 27 C40 30 44 34 50 38 C56 34 60 30 57 27 C54 24 50 27 50 30Z" fill="#8b4a6b" opacity="0.7"/>
    <path d="M50 72 C50 70 48 68 46 70 C44 72 46 74 50 76 C54 74 56 72 54 70 C52 68 50 70 50 72Z" fill="#c9a84c" opacity="0.6"/>
    <text x="12" y="24" fontSize="12" fill="#c9a84c" opacity="0.5">✿</text>
    <text x="74" y="24" fontSize="12" fill="#c9a84c" opacity="0.5">✿</text>
    <text x="12" y="96" fontSize="12" fill="#c9a84c" opacity="0.5">✿</text>
    <text x="74" y="96" fontSize="12" fill="#c9a84c" opacity="0.5">✿</text>
  </svg>
);

// ── Canvas image slicer ───────────────────────────────────────────────────────
function sliceImage(src, cols, rows, cb) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const tileW = img.width / cols;
    const tileH = img.height / rows;
    const tiles = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const canvas = document.createElement('canvas');
        canvas.width = tileW;
        canvas.height = tileH;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, c * tileW, r * tileH, tileW, tileH, 0, 0, tileW, tileH);
        tiles.push(canvas.toDataURL());
      }
    }
    cb(tiles);
  };
  img.onerror = () => {
    const tiles = [];
    const colors = ['#c9a84c','#8b4a6b','#d4956a','#6b8b4a','#4a6b8b','#8b6b4a','#6b4a8b','#4a8b6b',
                    '#e8c96b','#c96b8b','#6bc9a8','#a86bc9','#c9a86b','#6b8bc9','#c96ba8','#8bc96b'];
    const totalTiles = cols * rows;
    for (let i = 0; i < totalTiles; i++) {
      const canvas = document.createElement('canvas');
      canvas.width = 200; canvas.height = 150;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = colors[i % colors.length];
      ctx.fillRect(0, 0, 200, 150);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '40px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText(['💑','💒','💍','💐','🥂','🎊','❤️','✨'][i % 8], 100, 90);
      tiles.push(canvas.toDataURL());
    }
    cb(tiles);
  };
  img.src = src;
}

// ── Leaderboard helpers ───────────────────────────────────────────────────────
function getLeaderboard(difficulty) {
  try {
    const raw = storage.getItem('wedding_lb_' + difficulty);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function saveLeaderboard(difficulty, entries) {
  try { storage.setItem('wedding_lb_' + difficulty, JSON.stringify(entries)); } catch {}
}
function addEntry(difficulty, entry) {
  const lb = getLeaderboard(difficulty);
  lb.push(entry);
  lb.sort((a, b) => b.score - a.score);
  const top10 = lb.slice(0, 10);
  saveLeaderboard(difficulty, top10);
  const rank = top10.findIndex(e => e.timestamp === entry.timestamp) + 1;
  return rank;
}
function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = (seconds % 60).toString().padStart(2, '0');
  return m + ':' + s;
}
function calcScore(difficulty, errors, seconds) {
  const { base } = DIFFICULTIES[difficulty];
  return Math.max(base - errors * 50 - seconds, 0);
}

// ══════════════════════════════════════════════════════════════════════════════
// LEADERBOARD SCREEN
// ══════════════════════════════════════════════════════════════════════════════
function LeaderboardScreen({ onBack, highlightEntry }) {
  const [tab, setTab] = useState((highlightEntry && highlightEntry.difficulty) || 'Easy');
  const entries = getLeaderboard(tab);
  const medals = ['🥇','🥈','🥉'];

  return (
    <div style={{ minHeight:'100vh', background:'linear-gradient(160deg,#fdf8f0,#fff5e6)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'flex-start', padding:'20px', position:'relative', overflow:'hidden' }}>
      <FloralCorner style={{ position:'absolute', top:0, left:0 }}/>
      <FloralCorner style={{ position:'absolute', top:0, right:0, transform:'scaleX(-1)' }}/>

      <div className="fade-in" style={{ width:'100%', maxWidth:600, marginTop:20 }}>

          <h1 style={{ fontFamily:"'Playfair Display',Georgia,serif", color:'#3d2b00', fontSize:'2rem', fontWeight:700 }}>Leaderboard</h1>
          <div style={{ width:60, height:2, background:'linear-gradient(90deg,transparent,#c9a84c,transparent)', margin:'10px auto' }}/>
        </div>

        <div style={{ display:'flex', justifyContent:'center', gap:8, marginBottom:20 }}>
          {Object.keys(DIFFICULTIES).map(function(d) {
            return (
              <button key={d} onClick={function(){ setTab(d); }} style={{
                padding:'8px 20px', borderRadius:20, border:'2px solid #c9a84c',
                background: tab===d ? 'linear-gradient(135deg,#c9a84c,#e8c96b)' : 'transparent',
                color: tab===d ? '#3d2b00' : '#c9a84c',
                fontFamily:"'Playfair Display',Georgia,serif", fontWeight:600,
                cursor:'pointer', transition:'all 0.2s'
              }}>{d}</button>
            );
          })}
        </div>

        <div style={{ background:'rgba(255,255,255,0.7)', border:'1px solid #e8d8a0', borderRadius:16, overflow:'hidden', marginBottom:20 }}>
          {entries.length === 0 ? (
            <div style={{ padding:40, textAlign:'center', color:'#999', fontStyle:'italic' }}>No scores yet. Be the first!</div>
          ) : (
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead>
                <tr style={{ background:'linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.25))' }}>
                  {['Rank','Name','Score','Time','Errors','Date'].map(function(h) {
                    return <th key={h} style={{ padding:'10px 12px', color:'#8b6a00', fontSize:'0.8rem', fontWeight:700, letterSpacing:'0.05em', textAlign:'center', borderBottom:'1px solid #e8d8a0' }}>{h}</th>;
                  })}
                </tr>
              </thead>
              <tbody>
                {entries.map(function(e, i) {
                  const isHighlight = highlightEntry && e.timestamp === highlightEntry.timestamp;
                  return (
                    <tr key={i} style={{
                      background: isHighlight ? 'rgba(201,168,76,0.2)' : i%2===0 ? 'transparent' : 'rgba(255,255,255,0.5)',
                      borderLeft: isHighlight ? '3px solid #c9a84c' : '3px solid transparent'
                    }}>
                      <td style={{ padding:'10px 12px', textAlign:'center', fontSize:'1rem' }}>{medals[i] || ('#'+(i+1))}</td>
                      <td style={{ padding:'10px 12px', textAlign:'center', fontFamily:"'Playfair Display',Georgia,serif", fontWeight:600, color:'#3d2b00' }}>{e.name}</td>
                      <td style={{ padding:'10px 12px', textAlign:'center', color:'#c9a84c', fontWeight:700 }}>{e.score.toLocaleString()}</td>
                      <td style={{ padding:'10px 12px', textAlign:'center', color:'#666' }}>{e.time}</td>
                      <td style={{ padding:'10px 12px', textAlign:'center', color:'#8b4a6b' }}>{e.errors}</td>
                      <td style={{ padding:'10px 12px', textAlign:'center', color:'#999', fontSize:'0.8rem' }}>{e.date}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>

        <div style={{ textAlign:'center' }}>
          <button className="btn-secondary" onClick={onBack}>← Back</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// ENTRY SCREEN
// ══════════════════════════════════════════════════════════════════════════════
function EntryScreen({ onPlay, onLeaderboard }) {
  const [name, setName] = useState('');
  const [difficulty, setDifficulty] = useState('Medium');

  function handlePlay() {
    const n = name.trim();
    if (!n) return;
    onPlay(n, difficulty);
  }

  return (
    <div style={{ minHeight:'100vh', background:'linear-gradient(160deg,#fdf8f0,#fff5e6)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'20px', position:'relative', overflow:'hidden' }}>
      <FloralCorner style={{ position:'absolute', top:0, left:0 }}/>
      <FloralCorner style={{ position:'absolute', top:0, right:0, transform:'scaleX(-1)' }}/>
      <FloralCorner style={{ position:'absolute', bottom:0, left:0, transform:'scaleY(-1)' }}/>
      <FloralCorner style={{ position:'absolute', bottom:0, right:0, transform:'scale(-1,-1)' }}/>

      <div className="fade-in" style={{ textAlign:'center', maxWidth:500, width:'100%' }}>
        <div style={{ marginBottom:8 }}>
          <div style={{ fontSize:'1rem', color:'#8b4a6b', letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:4 }}>You're invited to celebrate</div>
          <h1 style={{ fontFamily:"'Playfair Display',Georgia,serif", fontSize:'clamp(2rem,6vw,3.2rem)', color:'#3d2b00', fontWeight:700, lineHeight:1.2 }}>Vale & Iker</h1>
          <div style={{ fontFamily:"'Playfair Display',Georgia,serif", fontSize:'1.1rem', color:'#8b4a6b', fontStyle:'italic', marginTop:4 }}>Wedding Memory Game</div>
        </div>

        <div style={{ display:'flex', alignItems:'center', gap:12, margin:'20px auto', maxWidth:300 }}>
          <div style={{ flex:1, height:1, background:'linear-gradient(90deg,transparent,#c9a84c)' }}/>
          <span style={{ color:'#c9a84c', fontSize:'1.2rem' }}>❧</span>
          <div style={{ flex:1, height:1, background:'linear-gradient(90deg,#c9a84c,transparent)' }}/>
        </div>

        <div style={{ width:260, height:190, margin:'0 auto 24px', borderRadius:14, overflow:'hidden', border:'3px solid #c9a84c', boxShadow:'0 8px 30px rgba(201,168,76,0.3)' }}>
          <img src={WEDDING_IMAGE} alt="Vale & Iker" style={{ width:'100%', height:'100%', objectFit:'cover', objectPosition:'center top' }}
            onError={function(e){ e.target.parentNode.style.background='linear-gradient(135deg,#c9a84c,#8b4a6b)'; e.target.style.display='none'; }}
          />
        </div>

        <div style={{ marginBottom:20 }}>
          <label style={{ display:'block', color:'#8b4a6b', marginBottom:8, fontFamily:"'Playfair Display',Georgia,serif", fontSize:'0.95rem', fontStyle:'italic' }}>Enter your name to play</label>
          <input
            type="text"
            value={name}
            onChange={function(e){ setName(e.target.value); }}
            onKeyDown={function(e){ if(e.key==='Enter') handlePlay(); }}
            placeholder="Your name..."
            maxLength={20}

        <div style={{ marginBottom:28 }}>
          <div style={{ color:'#8b4a6b', marginBottom:10, fontSize:'0.9rem', letterSpacing:'0.05em' }}>Difficulty</div>
          <div style={{ display:'flex', justifyContent:'center', gap:10 }}>
            {Object.entries(DIFFICULTIES).map(function([d, cfg]) {
              return (
                <button key={d} onClick={function(){ setDifficulty(d); }} style={{
                  padding:'8px 16px', borderRadius:20, border:'2px solid #c9a84c',
                  background: difficulty===d ? 'linear-gradient(135deg,#c9a84c,#e8c96b)' : 'transparent',
                  color: difficulty===d ? '#3d2b00' : '#c9a84c',
                  fontFamily:"'Playfair Display',Georgia,serif", fontWeight:600, fontSize:'0.85rem',

                  {d}

                </button>
              );
            })}
          </div>
        </div>

        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:12 }}>
          <button className="btn-primary" onClick={handlePlay} style={{ width:200, opacity: name.trim() ? 1 : 0.5 }}>Play ✨</button>
          <button className="btn-secondary" onClick={onLeaderboard}>🏆 Leaderboard</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// VICTORY MODAL
// ══════════════════════════════════════════════════════════════════════════════
function VictoryModal({ playerName, difficulty, errors, seconds, rank, onPlayAgain, onChangeDifficulty, onLeaderboard }) {
  const score = calcScore(difficulty, errors, seconds);
  return (
    <div className="modal-overlay">
      <div className="modal-box fade-in">
        <div style={{ fontSize:'2.5rem', marginBottom:8 }}>🎉</div>
        <h2 style={{ fontFamily:"'Playfair Display',Georgia,serif", color:'#3d2b00', fontSize:'1.8rem', marginBottom:4 }}>Congratulations!</h2>
        <p style={{ color:'#8b4a6b', fontStyle:'italic', marginBottom:20 }}>{playerName}, you matched them all!</p>

        <div style={{ background:'rgba(201,168,76,0.1)', border:'1px solid #c9a84c', borderRadius:12, padding:20, marginBottom:20 }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
            <div style={{ textAlign:'center' }}>
              <div style={{ color:'#999', fontSize:'0.8rem', marginBottom:2 }}>TIME</div>
              <div style={{ color:'#3d2b00', fontWeight:700, fontSize:'1.2rem' }}>⏱ {formatTime(seconds)}</div>
            </div>
            <div style={{ textAlign:'center' }}>
              <div style={{ color:'#999', fontSize:'0.8rem', marginBottom:2 }}>ERRORS</div>
              <div style={{ color:'#8b4a6b', fontWeight:700, fontSize:'1.2rem' }}>❌ {errors}</div>
            </div>
          </div>
          <div style={{ textAlign:'center', marginTop:16, paddingTop:16, borderTop:'1px solid #e8d8a0' }}>
            <div style={{ color:'#999', fontSize:'0.8rem', marginBottom:4 }}>FINAL SCORE</div>
            <div style={{ color:'#c9a84c', fontWeight:700, fontSize:'2rem' }}>{score.toLocaleString()}</div>
          </div>
        </div>

        {rank && (
          <div style={{ background:'linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.25))', borderRadius:10, padding:10, marginBottom:16, color:'#8b6a00', fontWeight:600 }}>
            🏆 You entered the leaderboard at rank #{rank}!

        )}

        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          <button className="btn-primary" onClick={onPlayAgain}>Play Again</button>
          <div style={{ display:'flex', gap:8, justifyContent:'center', flexWrap:'wrap' }}>
            <button className="btn-secondary" onClick={onChangeDifficulty}>Change Difficulty</button>
            <button className="btn-secondary" onClick={onLeaderboard}>🏆 Leaderboard</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// GAME BOARD
// ══════════════════════════════════════════════════════════════════════════════
function GameBoard({ playerName, difficulty, onVictory, onQuit }) {
  const cfg = DIFFICULTIES[difficulty];
  const [tiles, setTiles] = useState([]);
  const [cards, setCards] = useState([]);
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState(new Set());
  const [errors, setErrors] = useState(0);
  const [moves, setMoves] = useState(0);
  const [seconds, setSeconds] = useState(0);
  const [timerActive, setTimerActive] = useState(false);
  const [locked, setLocked] = useState(false);
  const [glowing, setGlowing] = useState(new Set());
  const timerRef = useRef(null);
  const victoryFiredRef = useRef(false);

  useEffect(function() {
    sliceImage(WEDDING_IMAGE, cfg.cols, cfg.rows, function(t) {
      setTiles(t);
    });
  }, [difficulty]);

  useEffect(function() {
    if (tiles.length === 0) return;
    const pairs = [];
    tiles.forEach(function(url, i) {
      pairs.push({ id: i*2,   pairId: i, url });
      pairs.push({ id: i*2+1, pairId: i, url });
    });
    for (let i = pairs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      const tmp = pairs[i]; pairs[i] = pairs[j]; pairs[j] = tmp;
    }
    setCards(pairs);
    setFlipped([]);
    setMatched(new Set());
    setErrors(0);
    setMoves(0);
    setSeconds(0);
    setTimerActive(false);
    setLocked(false);
    victoryFiredRef.current = false;
    clearInterval(timerRef.current);
  }, [tiles]);

  useEffect(function() {
    if (timerActive) {
      timerRef.current = setInterval(function() { setSeconds(function(s){ return s+1; }); }, 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return function() { clearInterval(timerRef.current); };
  }, [timerActive]);

  const handleCardClick = useCallback(function(cardId) {
    if (locked) return;
    const card = cards.find(function(c){ return c.id===cardId; });
    if (!card) return;
    if (matched.has(card.pairId)) return;
    if (flipped.includes(cardId)) return;
    if (flipped.length >= 2) return;

    if (!timerActive) setTimerActive(true);

    const newFlipped = flipped.concat([cardId]);
    setFlipped(newFlipped);

    if (newFlipped.length === 2) {
      setMoves(function(m){ return m+1; });
      setLocked(true);
      const cardA = cards.find(function(c){ return c.id===newFlipped[0]; });
      const cardB = cards.find(function(c){ return c.id===newFlipped[1]; });
      if (cardA.pairId === cardB.pairId) {
        const newPairId = cardA.pairId;
        setGlowing(new Set([newPairId]));
        setTimeout(function() {
          setMatched(function(prev) {
            const next = new Set(prev);
            next.add(newPairId);
            return next;
          });
          setFlipped([]);
          setLocked(false);
          setGlowing(new Set());
        }, 800);
      } else {
        setErrors(function(e){ return e+1; });
        setTimeout(function() {
          setFlipped([]);
          setLocked(false);
        }, 1000);
      }
    }
  }, [locked, matched, flipped, cards, timerActive]);

  useEffect(function() {
    if (victoryFiredRef.current) return;
    if (matched.size > 0 && matched.size === cfg.pairs) {
      victoryFiredRef.current = true;
      setTimerActive(false);
      // Capture errors and seconds via closure — need current values
      // Use a ref snapshot to avoid stale closure issue
      const finalErrors = errors;
      const finalSeconds = seconds;
      const entry = {
        name: playerName,
        difficulty: difficulty,
        score: calcScore(difficulty, finalErrors, finalSeconds),
        time: formatTime(finalSeconds),
        errors: finalErrors,
        date: new Date().toLocaleDateString(),
        timestamp: Date.now(),
      };
      const rank = addEntry(difficulty, entry);
      setTimeout(function() { onVictory(finalErrors, finalSeconds, rank, entry.timestamp); }, 600);
    }
  }, [matched]);

  if (tiles.length === 0) {
    return (
      <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#fdf8f0' }}>
        <div style={{ textAlign:'center', color:'#c9a84c' }}>
          <div style={{ fontSize:'2rem' }}>💒</div>
          <div style={{ marginTop:8, fontFamily:"'Playfair Display',Georgia,serif", color:'#8b4a6b' }}>Preparing the cards...</div>
        </div>
      </div>
    );
  }

  const cardW = difficulty === 'Hard' ? 'min(95px,10vw)' : difficulty === 'Medium' ? 'min(130px,20vw)' : 'min(160px,22vw)';
  const cardH = difficulty === 'Hard' ? 'min(75px,8vw)'  : difficulty === 'Medium' ? 'min(100px,16vw)' : 'min(120px,18vw)';

  return (
    <div style={{ minHeight:'100vh', background:'linear-gradient(160deg,#fdf8f0,#fff5e6)', display:'flex', flexDirection:'column', alignItems:'center', padding:'12px 8px' }}>
      {/* HUD */}
      <div style={{ width:'100%', maxWidth:950, background:'rgba(255,255,255,0.85)', border:'1px solid #e8d8a0', borderRadius:16, padding:'10px 20px', marginBottom:16, display:'flex', flexWrap:'wrap', alignItems:'center', justifyContent:'space-between', gap:8, boxShadow:'0 2px 12px rgba(201,168,76,0.15)' }}>
        <div style={{ fontFamily:"'Playfair Display',Georgia,serif", color:'#3d2b00', fontWeight:600 }}>👰 {playerName}</div>
        <div style={{ display:'flex', gap:16, flexWrap:'wrap', alignItems:'center' }}>
          <span style={{ color:'#8b4a6b', fontSize:'0.9rem' }}>
            <span style={{ opacity:0.7 }}>Mode: </span><strong>{difficulty}</strong>
          </span>
          <span style={{ color:'#3d2b00', fontWeight:700, fontFamily:'monospace', fontSize:'1.05rem', minWidth:50 }}>
            ⏱ {formatTime(seconds)}
          </span>
          <span style={{ color:'#666', fontSize:'0.9rem' }}>🔄 {moves}</span>
          <span style={{ color:'#8b4a6b', fontSize:'0.9rem' }}>❌ {errors}</span>
          <span style={{ color:'#c9a84c', fontSize:'0.9rem' }}>✅ {matched.size}/{cfg.pairs}</span>
        </div>
        <button className="btn-secondary" style={{ padding:'6px 14px', fontSize:'0.8rem' }} onClick={onQuit}>Quit</button>
      </div>

      {/* Grid */}
      <div style={{
        display:'grid',
        gridTemplateColumns:'repeat(' + cfg.cols + ', ' + cardW + ')',
        gap: difficulty === 'Hard' ? 5 : 8,
        justifyContent:'center',
        padding:'0 8px'
      }}>
        {cards.map(function(card) {
          const isFlipped = flipped.includes(card.id) || matched.has(card.pairId);
          const isMatched = matched.has(card.pairId);
          const isGlowing = glowing.has(card.pairId);
          return (
            <div
              key={card.id}
              onClick={function(){ handleCardClick(card.id); }}
              className={isGlowing ? 'card-matched' : ''}
              style={{
                width: cardW, height: cardH,
                cursor: (!isMatched && !locked) ? 'pointer' : 'default',
                borderRadius: 10,
                boxShadow: isMatched ? '0 0 0 2px #c9a84c, 0 2px 8px rgba(201,168,76,0.3)' : '0 3px 10px rgba(0,0,0,0.15)',
              }}
            >
              <div className="card-scene">
                <div className={'card-inner' + (isFlipped ? ' flipped' : '')}>
                  <div className="card-face card-back">
                    <CardBackSVG/>
                  </div>
                  <div className="card-face card-front" style={{ backgroundColor:'#fff' }}>
                    <img src={card.url} alt="" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }}/>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ marginTop:16, color:'#bbb', fontSize:'0.78rem', fontStyle:'italic' }}>
        Find all {cfg.pairs} matching pairs to complete the puzzle
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen] = useState('entry');
  const [playerName, setPlayerName] = useState('');
  const [difficulty, setDifficulty] = useState('Medium');
  const [victoryData, setVictoryData] = useState(null);
  const [lbHighlight, setLbHighlight] = useState(null);
  const [gameKey, setGameKey] = useState(0);

  useEffect(function() {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap';
    document.head.appendChild(link);
  }, []);

  function handlePlay(name, diff) {
    setPlayerName(name);
    setDifficulty(diff);
    setVictoryData(null);
    setGameKey(function(k){ return k+1; });
    setScreen('game');
  }

  function handleVictory(errors, seconds, rank, timestamp) {
    setVictoryData({ errors, seconds, rank, timestamp });
  }

  function handlePlayAgain() {
    setVictoryData(null);
    setGameKey(function(k){ return k+1; });
  }

  function handleChangeDifficulty() {
    setVictoryData(null);
    setScreen('entry');
  }

  function handleShowLeaderboard() {
    if (victoryData) {
      setLbHighlight({ difficulty: difficulty, timestamp: victoryData.timestamp });
    }
    setVictoryData(null);
    setScreen('leaderboard');
  }

  return (
    <div>
      {screen === 'entry' && (
        <EntryScreen
          onPlay={handlePlay}
          onLeaderboard={function(){ setLbHighlight(null); setScreen('leaderboard'); }}
        />
      )}
      {screen === 'game' && (
        <div>
          <GameBoard
            key={gameKey}
            playerName={playerName}
            difficulty={difficulty}
            onVictory={handleVictory}
            onQuit={function(){ setVictoryData(null); setScreen('entry'); }}
          />
          {victoryData && (
            <VictoryModal
              playerName={playerName}
              difficulty={difficulty}
              errors={victoryData.errors}
              seconds={victoryData.seconds}
              rank={victoryData.rank}
              onPlayAgain={handlePlayAgain}
              onChangeDifficulty={handleChangeDifficulty}
              onLeaderboard={handleShowLeaderboard}
            />
          )}
        </div>
      )}
      {screen === 'leaderboard' && (
        <LeaderboardScreen
          onBack={function(){ setScreen('entry'); }}
          highlightEntry={lbHighlight}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
