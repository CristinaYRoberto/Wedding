<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141312">
<title>Filtro · Cristina &amp; Roberto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Cinzel:wght@400;500;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --gold: #b89a6a;
    --gold-hi: #e6c563;
    --rec: #e0584e;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* Sin esto, el display de .btn / #countdown gana sobre [hidden]. */
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body {
    font-family:'Lato',sans-serif;
    background:radial-gradient(circle at 50% 0%, #34302c 0%, #1c1a18 55%, #121110 100%);
    color:var(--cream);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  /* Con la cámara abierta la página no hace scroll: el visor se mide
     para que todo quepa. */
  body.shooting { overflow:hidden; }
  button { font-family:inherit; }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }

  /* ── Cabecera ───────────────────────────────────────────────── */
  header {
    width:100%; max-width:520px;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:10px 16px 8px;
  }
  .back {
    display:inline-flex; align-items:center; gap:4px;
    color:var(--cream); text-decoration:none; font-size:0.8rem; letter-spacing:0.04em;
    background:rgba(245,240,232,0.08); border:1px solid rgba(245,240,232,0.14);
    padding:8px 14px 8px 9px; border-radius:999px; white-space:nowrap; cursor:pointer;
  }
  .back:active { background:rgba(245,240,232,0.18); }
  #lang-toggle {
    display:flex; padding:3px; border-radius:999px;
    background:rgba(245,240,232,0.08); border:1px solid rgba(245,240,232,0.14);
  }
  #lang-toggle button {
    font-size:0.7rem; letter-spacing:0.08em; font-weight:700;
    background:none; border:none; color:rgba(245,240,232,0.55);
    padding:6px 11px; border-radius:999px; cursor:pointer;
  }
  #lang-toggle button.active { background:var(--cream); color:#1b1a18; }

  /* ── Pantallas ──────────────────────────────────────────────── */
  section { width:100%; max-width:520px; padding:4px 16px 16px; }

  /* ── Intro ──────────────────────────────────────────────────── */
  #intro { text-align:center; padding-top:7vh; }
  .intro-mark { font-family:'Great Vibes',cursive; font-size:clamp(2.4rem,12vw,3.6rem); color:var(--gold); line-height:1.1; }
  .rule { width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:14px auto; }
  .title { font-family:'Cinzel',serif; font-size:clamp(1.05rem,4.5vw,1.35rem); letter-spacing:0.18em; }
  .subtitle {
    font-family:'Cormorant Garamond',serif; font-style:italic;
    color:rgba(245,240,232,0.7); font-size:clamp(1rem,4.2vw,1.12rem);
    margin:12px auto 0; line-height:1.55; max-width:340px;
  }
  .intro-note {
    margin:26px auto 0; font-size:0.74rem; color:rgba(245,240,232,0.42);
    line-height:1.6; max-width:300px;
  }

  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    font-size:0.82rem; letter-spacing:0.1em; font-weight:700; text-transform:uppercase;
    padding:16px 26px; border-radius:999px; border:1px solid transparent;
    cursor:pointer; text-decoration:none; transition:transform .1s ease;
  }
  .btn:active { transform:scale(0.97); }
  .btn-primary { background:var(--gold); color:#1b1a18; box-shadow:0 8px 24px rgba(184,154,106,0.25); }
  .btn-ghost { background:rgba(245,240,232,0.08); border-color:rgba(245,240,232,0.16); color:var(--cream); }
  #btn-start { margin-top:28px; padding:18px 32px; }

  /* ── Visor ──────────────────────────────────────────────────── */
  /* Tamaño fijado por fitViewport(): mide lo que ocupa todo lo demás y
     le da al visor el hueco exacto, así nunca se corta un botón. */
  #viewport {
    position:relative; margin-inline:auto;
    border-radius:22px; overflow:hidden; background:#0d0c0b;
    box-shadow:0 18px 50px rgba(0,0,0,0.55);
    /* El deslizamiento para cambiar de filtro necesita los eventos
       crudos; sin touch-action el navegador los usaría para su gesto. */
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  #viewport canvas { display:block; width:100%; height:100%; }
  #cam { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  .vp-tools { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:10px; }
  .glass {
    position:relative; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:#fff; background:rgba(20,19,18,0.42);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .glass svg.i { width:22px; height:22px; }
  .glass:active { transform:scale(0.92); }
  .glass.on { background:var(--gold); border-color:var(--gold); color:#1b1a18; }
  .glass .badge {
    position:absolute; right:-3px; bottom:-3px;
    font-size:0.56rem; font-weight:700; line-height:1;
    background:var(--cream); color:#1b1a18; border-radius:999px; padding:3px 5px;
  }

  .pill {
    position:absolute; left:50%; transform:translateX(-50%);
    background:rgba(20,19,18,0.62); color:#fff;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.16);
    padding:8px 14px; border-radius:999px; font-size:0.74rem; white-space:nowrap;
    pointer-events:none;
  }
  #face-hint { top:58%; }

  #countdown {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel',serif; font-size:22vh; color:rgba(250,247,242,0.95);
    text-shadow:0 4px 30px rgba(0,0,0,0.6); pointer-events:none;
  }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s ease; }
  #rec-bar { position:absolute; left:0; top:0; height:4px; width:0%; background:var(--rec); }
  #strip-dots { position:absolute; top:18px; left:16px; display:flex; gap:6px; }
  #strip-dots i { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.35); }
  #strip-dots i.done { background:var(--gold-hi); }

  /* ── Selector de filtros + obturador ────────────────────────── */
  /* Como en Instagram y Snapchat: los filtros pasan por dentro del
     aro del obturador y el que queda al centro es el activo. Se toca
     uno, se desliza la fila, o se desliza sobre la cámara. */
  #filter-name {
    margin-top:12px; height:18px; line-height:18px; text-align:center;
    font-family:'Cinzel',serif; font-size:0.76rem; letter-spacing:0.18em; text-transform:uppercase;
  }
  /* Flechitas junto al nombre: dicen, sin palabras, que se desliza. */
  #filter-name::before, #filter-name::after { content:'‹'; opacity:0.45; margin:0 12px; font-family:'Lato',sans-serif; }
  #filter-name::after { content:'›'; }
  .rail-wrap { position:relative; height:92px; margin-top:4px; }
  #rail {
    position:relative; display:flex; align-items:center; gap:14px; height:100%;
    overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;
    padding-inline:calc(50% - 28px);
    touch-action:pan-x;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 16%,#000 84%,transparent 100%);
  }
  #rail::-webkit-scrollbar { display:none; }
  #rail button {
    flex:0 0 56px; width:56px; height:56px; padding:0; border-radius:50%; overflow:hidden;
    border:2px solid rgba(245,240,232,0.22); background:#26231f;
    scroll-snap-align:center; cursor:pointer; -webkit-touch-callout:none;
  }
  #rail button canvas { display:block; width:100%; height:100%; }
  #rail button.active { border-color:transparent; }

  /* touch-action:none — sin esto, mantener presionado en el móvil
     dispara el scroll y el gesto de video nunca llega a empezar. */
  #shutter {
    position:absolute; left:50%; top:50%; width:82px; height:82px; margin:-41px 0 0 -41px;
    border-radius:50%; background:transparent; cursor:pointer;
    border:5px solid var(--cream);
    box-shadow:0 0 0 1px rgba(0,0,0,0.2), 0 6px 22px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.2);
    touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    transition:transform .18s ease, border-color .18s ease;
  }
  #shutter:active { transform:scale(0.93); }
  #shutter:disabled { opacity:0.5; }
  #shutter.rec {
    border-color:var(--rec); transform:scale(1.12);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 rgba(224,88,78,0.55); }
    50%     { box-shadow:0 0 0 12px rgba(224,88,78,0); }
  }

  #modes { display:flex; justify-content:center; gap:26px; margin-top:4px; }
  #modes button {
    position:relative; background:none; border:none; cursor:pointer;
    color:rgba(245,240,232,0.45); font-size:0.72rem; font-weight:700;
    letter-spacing:0.16em; text-transform:uppercase; padding:6px 2px 9px;
  }
  #modes button.active { color:var(--cream); }
  #modes button.active::after {
    content:''; position:absolute; left:50%; bottom:1px; width:5px; height:5px; margin-left:-2.5px;
    border-radius:50%; background:var(--gold-hi);
  }
  .shoot-hint {
    width:fit-content; max-width:92%; margin:6px auto 0; padding:7px 14px;
    text-align:center; font-size:0.8rem; line-height:1.35; color:var(--cream);
    background:rgba(245,240,232,0.08); border:1px solid rgba(245,240,232,0.16); border-radius:14px;
  }
  .shoot-hint:empty { display:none; }
  /* Al abrir la cámara el círculo late tres veces: ahí se toca. */
  #shutter.nudge { animation:nudge 1.1s ease-in-out 3; }
  @keyframes nudge {
    50% { box-shadow:0 0 0 12px rgba(230,197,99,0.45), 0 6px 22px rgba(0,0,0,0.45); }
  }

  /* ── Resultado ──────────────────────────────────────────────── */
  #result { text-align:center; padding-top:4px; }
  #shot, #shot-video {
    display:block; margin:0 auto; max-width:100%;
    max-height:calc(100vh - 290px); max-height:calc(100dvh - 290px);
    border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,0.55); background:#0d0c0b;
  }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
  .actions .full { grid-column:1 / -1; }
  .hint { margin-top:14px; font-size:0.76rem; line-height:1.6; color:rgba(245,240,232,0.55); }
  .hashtag { font-family:'Cinzel',serif; letter-spacing:0.08em; color:var(--gold); }

  .alert {
    background:rgba(180,83,75,0.12); border:1px solid rgba(180,83,75,0.5);
    color:#f0c9c5; border-radius:12px; padding:14px 16px;
    font-size:0.82rem; line-height:1.6; margin-top:20px; text-align:left;
  }
  #toast {
    position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top));
    transform:translate(-50%,-12px); opacity:0; pointer-events:none;
    background:rgba(20,19,18,0.94); border:1px solid rgba(245,240,232,0.16);
    color:var(--cream); padding:10px 16px; border-radius:999px;
    font-size:0.78rem; transition:opacity .25s ease, transform .25s ease; z-index:50;
    max-width:90vw; text-align:center;
  }
  #toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<header>
  <a class="back" id="back" href="index.html">
    <svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="back-label">Volver</span>
  </a>
  <div id="lang-toggle">
    <button type="button" class="active" onclick="setLang('es')">ES</button>
    <button type="button" onclick="setLang('en')">EN</button>
  </div>
</header>

<!-- ══ INTRO ══════════════════════════════════════════════════ -->
<section id="intro">
  <div class="intro-mark">Cristina &amp; Roberto</div>
  <div class="rule"></div>
  <h1 class="title" data-es="FILTROS DE LA BODA" data-en="WEDDING FILTERS">FILTROS DE LA BODA</h1>
  <p class="subtitle"
     data-es="Tómate una foto o un video con nuestros filtros y compártelo en tus historias."
     data-en="Take a photo or a video with our filters and share it to your stories.">
  </p>
  <button type="button" class="btn btn-primary" id="btn-start">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H7l2-2h6l2 2h1.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span data-es="Abrir la cámara" data-en="Open the camera">Abrir la cámara</span>
  </button>
  <p class="intro-note"
     data-es="Tu teléfono pedirá permiso para la cámara. Nada se sube a internet: todo se queda en tu teléfono."
     data-en="Your phone will ask for camera permission. Nothing is uploaded: everything stays on your phone.">
  </p>
  <div class="alert" id="intro-error" hidden></div>
</section>

<!-- ══ CÁMARA ═════════════════════════════════════════════════ -->
<section id="stage" hidden>
  <div id="viewport">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="view"></canvas>

    <div class="vp-tools">
      <button type="button" class="glass" id="btn-flip">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H7l2-2h6l2 2h1.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M8.8 12.2a3.3 3.3 0 0 1 5.9-1.5"/><path d="M15.2 13.8a3.3 3.3 0 0 1-5.9 1.5"/><path d="M14.9 8.8v2h-2"/><path d="M9.1 17.2v-2h2"/></svg>
      </button>
      <button type="button" class="glass" id="btn-timer">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.3 2.3"/><path d="M9.5 2.8h5"/></svg>
        <span class="badge" id="timer-badge" hidden>3s</span>
      </button>
    </div>

    <div id="strip-dots" hidden><i></i><i></i><i></i><i></i></div>
    <div class="pill" id="face-hint" hidden></div>
    <div id="countdown" hidden></div>
    <div id="flash"></div>
    <div id="rec-bar"></div>
  </div>

  <div id="filter-name"></div>
  <div class="rail-wrap">
    <div id="rail"></div>
    <button type="button" id="shutter"></button>
  </div>
  <div id="modes">
    <button type="button" data-mode="photo" class="active"></button>
    <button type="button" data-mode="strip"></button>
  </div>
  <p class="shoot-hint" id="shoot-hint"></p>
</section>

<!-- ══ RESULTADO ══════════════════════════════════════════════ -->
<section id="result" hidden>
  <img id="shot" alt="">
  <video id="shot-video" playsinline autoplay muted loop hidden></video>
  <div class="actions">
    <button type="button" class="btn btn-primary full" id="btn-share">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      <span data-es="Compartir en redes" data-en="Share to social">Compartir en redes</span>
    </button>
    <a class="btn btn-ghost" id="btn-save">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 21h14"/></svg>
      <span data-es="Guardar" data-en="Save">Guardar</span>
    </a>
    <button type="button" class="btn btn-ghost" id="btn-again">
      <svg class="i" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H7l2-2h6l2 2h1.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span data-es="Otra" data-en="Retake">Otra</span>
    </button>
  </div>
  <p class="hint" id="save-hint" hidden></p>
  <p class="hint" id="hint-tag"></p>
</section>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   FILTROS — Cristina & Roberto
   ────────────────────────────────────────────────────────────────
   Piezas del navegador, sin SDK de pago:
     getUserMedia      → cámara
     <canvas>          → el filtro se dibuja sobre el video
     MediaRecorder     → el video
     navigator.share   → menú nativo (Instagram, Facebook, WhatsApp).
                         Es el único camino para publicar en Instagram
                         desde la web: no hay API pública de historias.
     MediaPipe FaceDetector (gratis, CDN, corre en el dispositivo)
                       → posición de cada cara, también en grupo.

   Si MediaPipe no carga, los filtros sin cara siguen funcionando.
   ════════════════════════════════════════════════════════════════ */

const NAMES   = 'Cristina & Roberto';
const DATE_ES = '03 · OCTUBRE · 2026';
const DATE_EN = 'OCTOBER 3 · 2026';
const HASHTAG = '#CristinaYRoberto';

/* 9/16: formato de historias. El feed de Instagram lo recorta a 4/5,
   por eso la firma va dentro de la zona segura de abajo. */
const RATIO = 9 / 16;
const CAP_H = 1920;          /* 1080x1920, medida nativa de una historia */
const HOLD_MS  = 280;        /* a partir de aquí el toque cuenta como video */
const MAX_SECS = 20;         /* tope duro de grabación */
const THUMB    = 112;        /* miniaturas del selector, a 2x */

const MP_VER   = '0.10.14';
const MP_WASM  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER + '/wasm';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/' +
                 'blaze_face_short_range/float16/1/blaze_face_short_range.tflite';

/* iPhone y iPad: "Guardar" descarga a Archivos, no a Fotos. Para que
   quede en la galería hay que ir por el menú de compartir. */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ── Idioma: el mismo que eligieron en index.html ─────────────── */
let lang = 'es';
try { const s = localStorage.getItem('wedding_lang'); if (s === 'es' || s === 'en') lang = s; } catch (_e) {}

const STR = {
  es: {
    back:'Volver', toCamera:'Cámara',
    flip:'Cambiar cámara', timer:'Temporizador de 3 segundos', shutter:'Tomar foto',
    denied:'No diste permiso a la cámara. Actívalo en los ajustes del navegador (el candado junto a la dirección) y vuelve a intentar.',
    nocam:'No encontramos ninguna cámara en este dispositivo.',
    insecure:'La cámara solo funciona en una dirección https://. Abre esta página desde el enlace de la boda.',
    unsupported:'Este navegador no permite usar la cámara. Prueba con Chrome o Safari.',
    saved:'Listo, revisa tus descargas',
    sharefail:'No se abrió el menú de compartir; la guardamos en tu teléfono',
    shotfail:'No se pudo tomar la foto. Intenta de nuevo.',
    tag:'Compártela con <span class="hashtag">' + HASHTAG + '</span>',
    savehint:'Guárdala y súbela desde Instagram, Facebook o WhatsApp.',
    iosSave:'Para guardarla en tu galería: <b>Compartir</b> → <b>Guardar imagen</b> o <b>Guardar video</b>.',
    date:DATE_ES,
    mPhoto:'Foto', mStrip:'Tira',
    stripHint:'Cuatro fotos seguidas. ¡Cambia de pose!',
    holdHint:'Toca una vez el círculo del filtro para tomar foto, o mantenlo presionado para grabar un video',
    tapHint:'Toca una vez el círculo del filtro: se toman 4 fotos seguidas',
    recording:'Grabando… suelta para terminar',
    tooShort:'Muy corto. Mantén presionado más tiempo.',
    faceHint:'Acerca tu cara a la cámara',
    faceLoad:'Preparando el filtro…',
    faceOff:'Este filtro no funciona en este teléfono',
    danceTip:'Para tomar a otros, cambia a la cámara de atrás',
    arcade:{ score:'PUNTOS', level:'NIVEL: CASADOS', cont:'¿CONTINUAR?', yes:'SÍ, PARA SIEMPRE' }
  },
  en: {
    back:'Back', toCamera:'Camera',
    flip:'Switch camera', timer:'3 second timer', shutter:'Take photo',
    denied:'Camera permission was denied. Allow it in your browser settings (the lock next to the address) and try again.',
    nocam:'No camera found on this device.',
    insecure:'The camera only works over https://. Open this page from the wedding link.',
    unsupported:'This browser cannot use the camera. Try Chrome or Safari.',
    saved:'Done — check your downloads',
    sharefail:'The share sheet did not open; we saved it to your phone',
    shotfail:'Could not take the photo. Try again.',

const t = k => STR[lang][k];

/* ════════════════════════════════════════════════════════════════
   IMÁGENES
   ────────────────────────────────────────────────────────────────
   Los novios y los props son los mismos de game.html. Se cargan solo
   cuando el invitado elige el filtro que los usa.
   ════════════════════════════════════════════════════════════════ */
const A = {
  /* Los novios, en sus tres animaciones. Cada filtro usa una sola. */
  dancing  : ['assets/characters/novios_dancing01.png', 'assets/characters/novios_dancing02.png',
              'assets/characters/novios_dancing03.png'],
  kiss     : ['assets/characters/novios_kiss01.png', 'assets/characters/novios_kiss02.png'],
  win      : ['assets/characters/novios_win01.png', 'assets/characters/novios_win02.png'],
  rings    : ['assets/props/weddingStuff05.png'],
  champagne: ['assets/props/weddingStuff06.png'],
  cake     : ['assets/props/weddingStuff03.png'],
  heels    : ['assets/props/weddingStuff07.png'],
  bouquet  : ['assets/props/weddingStuff02.png'],
  outfits  : ['assets/props/weddingStuff04.png'],
  /* Fotos de la sesión, reducidas a 640 px (assets/ar/moments). Las
     originales de la galería pesan hasta 500 KB y 2048 px: doce de esas
     decodificadas se comen la memoria de un teléfono modesto. */
  moments  : ['m01','m02','m03','m04','m05','m06','m07','m08','m09','m10','m11','m12']
               .map(n => 'assets/ar/moments/' + n + '.jpg')
};

const IMG = {};
/* Devuelve la imagen solo si ya está lista; si no, este cuadro se
   dibuja sin ella y el siguiente ya la tendrá. */
function img(src) {
  let i = IMG[src];
  if (!i) { i = IMG[src] = new Image(); i.decoding = 'async'; i.src = src; }
  return (i.complete && i.naturalWidth) ? i : null;
}
function preload(list) {
  return Promise.all(list.map(src => {
    const i = IMG[src] || (IMG[src] = Object.assign(new Image(), { decoding:'async', src }));
    return i.complete ? Promise.resolve() : new Promise(r => { i.addEventListener('load', r); i.addEventListener('error', r); });
  }));
}
function drawSprite(c, src, x, y, h, rot, alpha) {
  const im = img(src); if (!im) return;
  const w = h * im.naturalWidth / im.naturalHeight;
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.translate(x, y); if (rot) c.rotate(rot);
  c.drawImage(im, -w / 2, -h / 2, w, h);
  c.restore();
}
/* Cuadro de una animación de sprites, según el reloj. */
const anim = (list, fps, tt) => list[Math.floor(tt * fps) % list.length];

/* Azar estable: la misma partícula cae siempre por el mismo sitio, así
   la foto sale idéntica a lo que se veía en pantalla. */
const rnd = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

/* ════════════════════════════════════════════════════════════════
   EFECTOS REUTILIZABLES
   Todos reciben tt (segundos) y son funciones puras del tiempo.
   ════════════════════════════════════════════════════════════════ */

/* Lluvia o ascenso de sprites. up:true sube. */
function field(c, W, H, tt, srcs, o) {
  o = o || {};
  const n = o.n || 12, speed = o.speed || 0.08, size = o.size || 0.13;
  for (let i = 0; i < n; i++) {
    const life = ((tt * speed * (0.6 + rnd(i, 7) * 0.8)) + rnd(i, 1)) % 1;
    const p = o.up ? 1 - life : life;
    const x = (0.06 + rnd(i, 2) * 0.88) * W + Math.sin(tt * 0.9 + i * 1.7) * W * 0.05;
    const y = p * H * 1.2 - H * 0.1;
    const s = size * (0.65 + rnd(i, 3) * 0.7) * W;
    drawSprite(c, srcs[i % srcs.length], x, y, s,
               Math.sin(tt * (o.spin || 0.7) + i) * (o.tilt || 0.3),
               o.alpha === undefined ? 0.95 : o.alpha);
  }
}

/* Pétalos y confeti dibujados a mano: más ligeros que un PNG. */
function flakes(c, W, H, tt, o) {
  const n = o.n || 26;
  for (let i = 0; i < n; i++) {
    const life = ((tt * (o.speed || 0.09) * (0.6 + rnd(i, 5) * 0.9)) + rnd(i, 1)) % 1;
    const x = (0.03 + rnd(i, 2) * 0.94) * W + Math.sin(tt * 1.4 + i) * W * 0.05;
    const y = life * H * 1.2 - H * 0.1;
    const r = (o.size || 0.022) * (0.6 + rnd(i, 3) * 0.9) * W;
    c.save();
    c.translate(x, y);
    c.rotate(tt * (1 + rnd(i, 4) * 2) + i);
    c.fillStyle = o.colors[i % o.colors.length];
    if (o.rect) c.fillRect(-r * 0.5, -r * 0.22, r, r * 0.44);
    else { c.beginPath(); c.ellipse(0, 0, r, r * 0.55, 0, 0, Math.PI * 2); c.fill(); }
    c.restore();
  }
}

/* Destellos de cuatro puntas. */
function sparkles(c, W, H, tt, n, tint) {
  for (let i = 0; i < (n || 14); i++) {
    const life = ((tt * 0.5 + rnd(i, 9)) % 1);
    const a = Math.sin(life * Math.PI);
    if (a <= 0.02) continue;
    const x = rnd(i, 11) * W, y = rnd(i, 13) * H;
    const r = (0.012 + rnd(i, 17) * 0.02) * W * (0.5 + a);
    c.save(); c.translate(x, y); c.rotate(tt * 0.6 + i);
    c.globalAlpha = a * 0.9; c.fillStyle = tint || '#f3e3b0';
    c.beginPath();
    c.moveTo(0, -r); c.quadraticCurveTo(0, 0, r, 0);
    c.quadraticCurveTo(0, 0, 0, r); c.quadraticCurveTo(0, 0, -r, 0);
    c.quadraticCurveTo(0, 0, 0, -r);
    c.fill(); c.restore();
  }
}

/* Luces desenfocadas de fiesta. */
function bokeh(c, W, H, tt) {
  for (let i = 0; i < 16; i++) {
    const x = (rnd(i, 21) + Math.sin(tt * 0.15 + i) * 0.06) * W;
    const y = (rnd(i, 23) + Math.cos(tt * 0.12 + i * 1.3) * 0.06) * H;
    const r = (0.03 + rnd(i, 27) * 0.07) * W;
    const a = 0.10 + 0.10 * (0.5 + 0.5 * Math.sin(tt * 0.8 + i));
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(246,225,160,' + a + ')');
    g.addColorStop(1, 'rgba(246,225,160,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
}

/* ── Marcos ──────────────────────────────────────────────────── */
function goldFrame(c, W, H) {
  const m = W * 0.035;
  c.strokeStyle = 'rgba(184,154,106,0.95)'; c.lineWidth = Math.max(2, W * 0.006);
  c.strokeRect(m, m, W - m * 2, H - m * 2);
  c.strokeStyle = 'rgba(184,154,106,0.5)'; c.lineWidth = Math.max(1, W * 0.002);
  const n = m + W * 0.016;
  c.strokeRect(n, n, W - n * 2, H - n * 2);
}

function thinFrame(c, W, H) {
  const m = W * 0.03;
  c.strokeStyle = 'rgba(245,240,232,0.75)'; c.lineWidth = Math.max(1, W * 0.003);
  c.strokeRect(m, m, W - m * 2, H - m * 2);
}

function vignette(c, W, H) {
  const g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(30,22,14,0.55)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

/* Canvas no tiene letter-spacing: se simula con espacios. */
const spread = s => s.split('').join(' ');

/* SAFE = franja que Instagram tapa con la barra de "enviar mensaje"
   cuando la foto se sube como historia. El texto se levanta por
   encima; el degradado sí baja hasta el borde. */
function signature(c, W, H) {
  const pad  = W * 0.075;
  const safe = H * 0.07;
  const top  = H - pad * 3.4 - safe;
  const g = c.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, 'rgba(20,19,18,0)');
  g.addColorStop(0.75, 'rgba(20,19,18,0.7)');
  g.addColorStop(1, 'rgba(20,19,18,0.78)');
  c.fillStyle = g; c.fillRect(0, top, W, H - top);

  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#f5f0e8';
  c.font = '400 ' + (W * 0.115) + 'px "Great Vibes", cursive';
  c.fillText(NAMES, W / 2, H - safe - pad * 1.62);

  c.fillStyle = 'rgba(184,154,106,0.95)';
  c.font = '600 ' + (W * 0.036) + 'px Cinzel, serif';
  c.fillText(spread(t('date')), W / 2, H - safe - pad * 0.92);

  c.fillStyle = 'rgba(245,240,232,0.62)';
  c.font = '400 ' + (W * 0.031) + 'px Lato, sans-serif';
  c.fillText(HASHTAG, W / 2, H - safe - pad * 0.3);
}

/* ── Stickers en alta calidad ────────────────────────────────────
   Cada adorno tiene un dibujo vectorial de respaldo. Para cambiarlo por
   arte de verdad (PNG con fondo transparente, 1024 px de ancho), pon el
   archivo en assets/ar/stickers/ y descomenta su línea. La posición y el
   tamaño sobre la cara ya están calculados: no hay que tocar nada más.
   Sin la línea el archivo no se pide, así no hay errores 404. */
const HQ = {
  crown:        'assets/ar/stickers/crown.png',
  // mustache:     'assets/ar/stickers/mustache.png',
  lips:         'assets/ar/stickers/lips.png',
  discoball:    'assets/ar/stickers/discoball.png',
  sunglasses:   'assets/ar/stickers/sunglasses.png',
  // heartglasses: 'assets/ar/stickers/heart-glasses.png',
  // flowercrown:  'assets/ar/stickers/flower-crown.png',
  // veil:         'assets/ar/stickers/veil.png',
  tophat:       'assets/ar/stickers/top-hat.png'
};
/* Dibuja el sticker centrado en (x, y) con ancho w, si ya cargó. w
   incluye el margen transparente del PNG: los de Fluent traen ~12%, por
   eso sus anchos aquí son algo mayores que los del dibujo vectorial. */
function hq(c, key, x, y, w) {
  const im = HQ[key] && img(HQ[key]);
  if (!im) return false;
  const h = w * im.naturalHeight / im.naturalWidth;
  c.drawImage(im, x - w / 2, y - h / 2, w, h);
  return true;
}

/* ── Adornos sobre la cara ───────────────────────────────────────
   f = { x, y, d, a }: centro entre los ojos, distancia entre ojos,
   inclinación. Todo se mide en múltiplos de d para que el adorno
   crezca con la cara. */
/* Proporciones de cada cara en distancias entre ojos. Las miniaturas
   no traen cara real y usan los valores típicos. */
const noseY  = f => f.ny || 0.7;
const mouthY = f => f.my || 1.15;
const headW  = f => f.hw || 2.4;
/* Coronilla: los ojos quedan a media cabeza, así que hacia arriba hay
   más o menos lo mismo que de los ojos a la barbilla (~1,5 veces la
   distancia ojos-boca). */
const headTop = f => -mouthY(f) * 1.5;

function faceSpace(c, f, fn, tt) {
  c.save(); c.translate(f.x, f.y); c.rotate(f.a);
  fn(c, f.d, tt);
  c.restore();
}

function petal5(c, x, y, r, fill) {
  c.save(); c.translate(x, y);
  for (let i = 0; i < 5; i++) {
    c.rotate(Math.PI * 2 / 5);
    c.beginPath();
    c.ellipse(0, -r * 0.62, r * 0.42, r * 0.66, 0, 0, Math.PI * 2);
    c.fillStyle = fill; c.fill();
  }
  c.beginPath(); c.arc(0, 0, r * 0.3, 0, Math.PI * 2);
  c.fillStyle = '#e6c563'; c.fill();
  c.restore();
}

function flowerCrown(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    c.translate(0, (headTop(f) * 0.8 + 1.2) * d);          /* sobre el nacimiento del pelo */
    if (hq(c, 'flowercrown', 0, -d * 1.35, d * 4)) return;
    for (let k = 0; k <= 16; k++) {
      const u = -1 + (k / 16) * 2;
      const x = u * d * 1.85;
      const y = -d * 1.18 - (1 - u * u) * d * 0.5;
      c.save(); c.translate(x, y); c.rotate(u * 1.1 + Math.sin(tt * 1.5 + k) * 0.05);
      c.beginPath(); c.ellipse(0, d * 0.18, d * 0.12, d * 0.3, 0, 0, Math.PI * 2);
      c.fillStyle = 'rgba(122,140,110,0.95)'; c.fill();
      c.restore();
    }
    const tints = ['#fdf6f2', '#f7dfe4', '#fbeccd', '#f3d3d8'];
    for (let k = 0; k <= 10; k++) {
      const u = -1 + (k / 10) * 2;
      const x = u * d * 1.78;
      const y = -d * 1.22 - (1 - u * u) * d * 0.52;
      /* Respiración: cada flor late con un desfase distinto. */
      const beat = 1 + Math.sin(tt * 2 + k * 0.8) * 0.06;
      petal5(c, x, y, d * (0.24 + (1 - Math.abs(u)) * 0.12) * beat, tints[k % tints.length]);
    }
  }, tt);
}

function heartPath(c, r) {
  c.beginPath();
  c.moveTo(0, r * 0.72);
  c.bezierCurveTo(-r * 1.35, -r * 0.25, -r * 0.5, -r * 1.15, 0, -r * 0.42);
  c.bezierCurveTo(r * 0.5, -r * 1.15, r * 1.35, -r * 0.25, 0, r * 0.72);
  c.closePath();
}

function heartGlasses(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    const gs = headW(f) / 2.4; c.scale(gs, gs);            /* ancho de la cabeza */
    if (hq(c, 'heartglasses', 0, 0, d * 3.3)) return;
    const beat = 1 + Math.sin(tt * 4) * 0.07;
    const r = d * 0.52 * beat;
    c.strokeStyle = '#b89a6a'; c.lineWidth = d * 0.09;
    c.beginPath(); c.moveTo(-d * 0.18, -d * 0.05); c.lineTo(d * 0.18, -d * 0.05); c.stroke();
    c.beginPath(); c.moveTo(-d * 1.02, -d * 0.12); c.lineTo(-d * 1.5, -d * 0.3); c.stroke();
    c.beginPath(); c.moveTo(d * 1.02, -d * 0.12);  c.lineTo(d * 1.5, -d * 0.3);  c.stroke();
    for (const sx of [-1, 1]) {
      c.save(); c.translate(sx * d * 0.52, 0);
      heartPath(c, r);
      c.fillStyle = 'rgba(180,83,75,0.42)'; c.fill();
      c.lineWidth = d * 0.08; c.strokeStyle = '#b89a6a'; c.stroke();
      c.restore();
    }
  }, tt);
}

/* Lentes negros tipo wayfarer: ceja recta arriba, lente redondeado
   abajo, filo dorado para que no se pierdan sobre fondos oscuros, y
   un brillo que cruza el cristal. */
function lensPath(c, w, h) {
  c.beginPath();
  c.moveTo(-w / 2, -h / 2);
  c.lineTo(w / 2, -h / 2);
  c.quadraticCurveTo(w / 2 + w * 0.04, h * 0.2, w * 0.28, h / 2);
  c.quadraticCurveTo(0, h * 0.64, -w * 0.28, h / 2);
  c.quadraticCurveTo(-w / 2 - w * 0.04, h * 0.2, -w / 2, -h / 2);
  c.closePath();
}

function sunglasses(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    const gs = headW(f) / 2.4; c.scale(gs, gs);            /* ancho de la cabeza */
    if (hq(c, 'sunglasses', 0, d * 0.05, d * 3.6)) return;
    const w = d * 0.98, h = d * 0.66;
    /* Patillas */
    c.strokeStyle = '#141312'; c.lineWidth = d * 0.1; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-d * 1.02, -d * 0.2); c.lineTo(-d * 1.5, -d * 0.3); c.stroke();
    c.beginPath(); c.moveTo( d * 1.02, -d * 0.2); c.lineTo( d * 1.5, -d * 0.3); c.stroke();
    /* Puente */
    c.beginPath(); c.moveTo(-d * 0.1, -d * 0.16); c.quadraticCurveTo(0, -d * 0.24, d * 0.1, -d * 0.16); c.stroke();

    for (const sx of [-1, 1]) {
      c.save(); c.translate(sx * d * 0.54, d * 0.06);
      lensPath(c, w, h);
      const g = c.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, 'rgba(10,10,10,0.96)'); g.addColorStop(1, 'rgba(42,40,38,0.93)');
      c.fillStyle = g; c.fill();
      /* Brillo que cruza el cristal cada ~3 s, recortado al lente. */
      c.save(); c.clip();
      const p = ((tt * 0.35 + (sx > 0 ? 0.08 : 0)) % 1) * 2.4 - 0.7;
      c.translate(p * w, 0); c.rotate(0.5);
      c.fillStyle = 'rgba(255,255,255,0.28)'; c.fillRect(-w * 0.09, -h * 1.5, w * 0.12, h * 3);
      c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect( w * 0.07, -h * 1.5, w * 0.05, h * 3);
      c.restore();
      /* Ceja gruesa y filo dorado */
      c.fillStyle = '#141312'; c.fillRect(-w / 2 - d * 0.03, -h / 2 - d * 0.07, w + d * 0.06, d * 0.14);
      lensPath(c, w, h);
      c.strokeStyle = 'rgba(184,154,106,0.9)'; c.lineWidth = d * 0.035; c.stroke();
      c.restore();
    }
  }, tt);
}

function veil(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    c.translate(0, (headTop(f) * 0.82 + 1.28) * d);        /* tiara en la coronilla */
    if (hq(c, 'veil', 0, d * 1.0, d * 6.5)) return;
    const sway = Math.sin(tt * 1.2) * d * 0.18;
    c.fillStyle = 'rgba(250,247,242,0.3)';
    c.beginPath();
    c.moveTo(-d * 1.5, -d * 1.25);
    c.bezierCurveTo(-d * 3.1 + sway, d * 0.6, -d * 2.6 + sway, d * 3.4, -d * 1.7 + sway, d * 3.6);
    c.lineTo(d * 1.7 + sway, d * 3.6);
    c.bezierCurveTo(d * 2.6 + sway, d * 3.4, d * 3.1 + sway, d * 0.6, d * 1.5, -d * 1.25);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(230,197,99,0.95)'; c.lineWidth = d * 0.11;
    c.beginPath(); c.ellipse(0, -d * 1.28, d * 1.45, d * 0.62, 0, Math.PI, 0); c.stroke();
    for (let k = -1; k <= 1; k++) petal5(c, k * d * 0.78, -d * 1.72, d * 0.2, '#fdf6f2');
  }, tt);
}

function topHat(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    c.rotate(Math.sin(tt * 1.1) * 0.03);
    c.translate(0, (headTop(f) * 0.95 + 1.58) * d);        /* ala sobre la coronilla */
    /* El ala del PNG queda al 94% de su alto: se sube para que apoye ahí. */
    if (hq(c, 'tophat', 0, -1.58 * d - d * 4.2 * 0.44, d * 4.2)) return;
    c.fillStyle = '#24221f';
    c.fillRect(-d * 2.1, -d * 1.58, d * 4.2, d * 0.2);
    c.fillRect(-d * 1.18, -d * 3.1, d * 2.36, d * 1.55);
    c.fillStyle = '#b89a6a';
    c.fillRect(-d * 1.18, -d * 1.94, d * 2.36, d * 0.3);
  }, tt);
}

/* Aureola de anillos girando sobre la cabeza. */
function ringHalo(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    const im = img(A.rings[0]); if (!im) return;
    const s = d * 1.5, w = s * im.naturalWidth / im.naturalHeight;
    c.save();
    c.translate(0, (headTop(f) - 0.4) * d);
    c.rotate(Math.sin(tt * 1.3) * 0.25);
    c.scale(Math.cos(tt * 1.1) * 0.35 + 0.65, 1);   /* giro fingido en 3D */
    c.drawImage(im, -w / 2, -s / 2, w, s);
    c.restore();
  }, tt);
}

/* Corazoncitos que salen de la cara. */
function loveBurst(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    for (let k = 0; k < 7; k++) {
      const life = ((tt * 0.45) + rnd(k + i * 9, 3)) % 1;
      const x = (rnd(k + i * 9, 4) - 0.5) * d * 4;
      const y = -life * d * 4.2 + d * 1.2;
      c.save(); c.globalAlpha = Math.sin(life * Math.PI) * 0.9;
      c.translate(x + Math.sin(tt * 2 + k) * d * 0.25, y);
      c.rotate(Math.sin(tt + k) * 0.3);
      heartPath(c, d * (0.16 + rnd(k, 5) * 0.16));
      c.fillStyle = '#e0798c'; c.fill();
      c.restore();
    }
  }, tt);
}

/* ── Fotos de nuestros momentos ──────────────────────────────── */

/* Foto recortada en "cover" dentro de un rectángulo. El recorte se
   sesga hacia arriba: en los retratos las caras están en el tercio
   superior y centrar las cortaría. */
function coverImage(c, im, x, y, w, h) {
  const s = Math.max(w / im.naturalWidth, h / im.naturalHeight);
  const sw = w / s, sh = h / s;
  c.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) * 0.3, sw, sh, x, y, w, h);
}

/* Foto que cambia sola cada `period` segundos, con fundido en el
   último 20% del ciclo. `offset` desfasa varias para que no cambien
   todas a la vez. */
function slideshow(c, list, x, y, w, h, tt, period, offset) {
  const p = tt / period + (offset || 0);
  const i = Math.floor(p), fade = Math.max(0, (p - i - 0.8) / 0.2);
  const a = img(list[i % list.length]), b = img(list[(i + 1) % list.length]);
  if (a) coverImage(c, a, x, y, w, h);
  if (b && fade > 0) { c.save(); c.globalAlpha = fade; coverImage(c, b, x, y, w, h); c.restore(); }
}

function polaroid(c, list, cx, cy, w, rot, tt, offset) {
  const m = w * 0.06, ph = w - m * 2, h = w * 1.2;
  c.save();
  c.translate(cx, cy); c.rotate(rot);
  c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = w * 0.08; c.shadowOffsetY = w * 0.03;
  c.fillStyle = '#fbf8f2'; c.fillRect(-w / 2, -h / 2, w, h);
  c.shadowColor = 'transparent';
  c.fillStyle = '#ddd5c8'; c.fillRect(-w / 2 + m, -h / 2 + m, ph, ph);   /* mientras carga */
  slideshow(c, list, -w / 2 + m, -h / 2 + m, ph, ph, tt, 3.2, offset);
  /* Cinta adhesiva */
  c.save(); c.translate(0, -h / 2); c.rotate(-0.06);
  c.fillStyle = 'rgba(230,214,170,0.78)'; c.fillRect(-w * 0.18, -w * 0.045, w * 0.36, w * 0.09);
  c.restore();
  c.restore();
}

/* Tira de película que corre de lado. Es más ancha que la pantalla
   para que la inclinación no deje esquinas vacías. */
function filmStrip(c, W, H, list, cy, tt, dir, tilt) {
  const bh = W * 0.3, fw = bh * 0.8, gap = bh * 0.1, cell = fw + gap;
  const L = W * 1.4;
  const off  = tt * W * 0.07 * dir;
  const base = Math.floor(off / cell);
  const shift = off - base * cell;
  c.save();
  c.translate(W / 2, cy); c.rotate(tilt);
  c.fillStyle = 'rgba(20,18,15,0.94)'; c.fillRect(-L / 2, -bh / 2, L, bh);

  const ph = bh * 0.7;
  const n = Math.ceil(L / cell) + 2;
  for (let k = -1; k < n; k++) {
    const x = -L / 2 + k * cell + shift;
    /* El índice viaja con la celda: la foto no salta al moverse. */
    const src = list[(((k - base) % list.length) + list.length) % list.length];
    const im = img(src);
    c.fillStyle = '#2d2a25'; c.fillRect(x, -ph / 2, fw, ph);
    if (im) coverImage(c, im, x, -ph / 2, fw, ph);
  }
  /* Perforaciones */
  c.fillStyle = 'rgba(245,240,232,0.85)';
  const hs = cell / 4, hw = bh * 0.07, hh = bh * 0.055;
  const hshift = ((shift % hs) + hs) % hs;
  for (let x = -L / 2 - hs + hshift; x < L / 2; x += hs) {
    c.fillRect(x, -bh / 2 + bh * 0.04, hw, hh);
    c.fillRect(x,  bh / 2 - bh * 0.04 - hh, hw, hh);
  }
  c.restore();
}

/* ── Para la pista ───────────────────────────────────────────── */

const PARTY = ['255,92,160', '92,200,255', '255,214,92', '168,112,255', '120,255,176'];

/* Bola disco. o = { cx, cy, r, noDots, noString } para dibujarla en
   otro lugar (la miniatura). Por defecto cuelga arriba al centro,
   debajo de la franja que la historia tapa con el avatar. */
function discoBall(c, W, H, tt, o) {
  o = o || {};
  const cx = o.cx !== undefined ? o.cx : W * 0.5;
  const cy = o.cy !== undefined ? o.cy : H * 0.17;
  const r  = o.r  !== undefined ? o.r  : W * 0.12;

  c.save();
  c.globalCompositeOperation = 'lighter';
  /* Haces que giran */
  const reach = Math.hypot(W, H);
  for (let i = 0; i < 8; i++) {
    const ang = i / 8 * Math.PI * 2 + tt * (i % 2 ? 0.5 : -0.35);
    const spread = 0.07 + rnd(i, 31) * 0.05;
    const col = PARTY[i % PARTY.length];
    const g = c.createRadialGradient(cx, cy, r, cx, cy, reach);
    g.addColorStop(0, 'rgba(' + col + ',0.32)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(cx, cy);
    c.arc(cx, cy, reach, ang - spread, ang + spread);
    c.closePath(); c.fill();
  }
  /* Puntitos de luz reflejados, girando por toda la escena */
  if (!o.noDots) for (let i = 0; i < 36; i++) {
    const ang = rnd(i, 41) * Math.PI * 2 + tt * 0.35;
    const dist = (0.25 + rnd(i, 43) * 0.9) * Math.max(W, H) * 0.6;
    const pr = W * (0.008 + rnd(i, 47) * 0.012);
    c.fillStyle = 'rgba(' + PARTY[i % PARTY.length] + ',' + (0.35 + 0.35 * Math.sin(tt * 3 + i)) + ')';
    c.beginPath(); c.arc(cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist * 1.3, pr, 0, Math.PI * 2); c.fill();
  }
  c.restore();

  if (!o.noString) {
    c.strokeStyle = 'rgba(230,230,230,0.8)'; c.lineWidth = Math.max(1, W * 0.004);
    c.beginPath(); c.moveTo(cx, 0); c.lineTo(cx, cy - r); c.stroke();
  }
  if (hq(c, 'discoball', cx, cy, r * 2.7)) return;

  /* La bola: cuadritos de espejo que se encienden al girar */
  c.save();
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.clip();
  const base = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  base.addColorStop(0, '#f4f4f4'); base.addColorStop(1, '#5a5a5e');
  c.fillStyle = base; c.fillRect(cx - r, cy - r, r * 2, r * 2);
  const n = 9, cell = (r * 2) / n, spin = tt * 1.2;
  const shift = (spin % 1) * cell;
  for (let row = 0; row < n; row++) for (let col = -1; col <= n; col++) {
    const lit = rnd(row * 13 + (col - Math.floor(spin)), 53);
    if (lit < 0.55) continue;
    c.fillStyle = 'rgba(255,255,255,' + ((lit - 0.55) * 1.8) + ')';
    c.fillRect(cx - r + col * cell + shift + cell * 0.08, cy - r + row * cell + cell * 0.08, cell * 0.84, cell * 0.84);
  }
  c.strokeStyle = 'rgba(40,40,44,0.45)'; c.lineWidth = Math.max(1, r * 0.02);
  for (let k = 0; k <= n; k++) {
    c.beginPath(); c.moveTo(cx - r, cy - r + k * cell); c.lineTo(cx + r, cy - r + k * cell); c.stroke();
    const x = cx - r + k * cell + shift;
    c.beginPath(); c.moveTo(x, cy - r); c.lineTo(x, cy + r); c.stroke();
  }
  /* Sombra de esfera, para que no se vea como un cuadro plano */
  const rim = c.createRadialGradient(cx, cy, r * 0.55, cx, cy, r);
  rim.addColorStop(0, 'rgba(0,0,0,0)'); rim.addColorStop(1, 'rgba(0,0,0,0.55)');
  c.fillStyle = rim; c.fillRect(cx - r, cy - r, r * 2, r * 2);
  c.restore();
}

/* Cañones de confeti: una ráfaga desde cada esquina de abajo cada 2,6 s.
   Tiro parabólico con resistencia del aire, en función del tiempo: la
   foto congela el mismo instante que se ve.
   Con v' = g - k·v:  y(t) = y0 + (g/k)·t + (vy - g/k)·(1 - e^-kt)/k */
const CONFETTI = ['#b89a6a', '#e6c563', '#f5f0e8', '#7a8c6e', '#e0798c', '#7fc4e8'];
function cannons(c, W, H, tt) {
  const period = 2.6, life = 3, g = H * 1.1, kd = 1.2;
  const now = Math.floor(tt / period);
  for (let b = now - 1; b <= now; b++) {
    for (const side of [-1, 1]) {
      const t = tt - b * period - (side > 0 ? 0.12 : 0);
      if (t < 0 || t > life) continue;
      const fade = Math.min(1, (life - t) / 0.6);
      const x0 = side < 0 ? W * 0.02 : W * 0.98, y0 = H * 0.8;
      const e = (1 - Math.exp(-kd * t)) / kd;
      for (let i = 0; i < 34; i++) {
        const seed = b * 97 + i * 3 + (side > 0 ? 500 : 0);
        const off = 0.2 + rnd(seed, 1) * 0.6;
        const sp = H * (1.1 + rnd(seed, 2) * 0.6);
        const vx = -side * Math.sin(off) * sp, vy = -Math.cos(off) * sp;
        const x = x0 + vx * e;
        const y = y0 + (vy - g / kd) * e + g * t / kd;
        const sz = W * (0.018 + rnd(seed, 3) * 0.014);
        const rot = t * (4 + rnd(seed, 4) * 6) + seed;
        c.save();
        c.globalAlpha = fade;
        c.translate(x, y); c.rotate(rot);
        c.fillStyle = CONFETTI[i % CONFETTI.length];
        c.fillRect(-sz / 2, -sz * 0.3, sz * Math.cos(rot * 1.3), sz * 0.6);
        c.restore();
      }
    }
  }
}

/* Corona del rey de la pista: brinca a 120 BPM, el tempo de casi toda
   la música de fiesta. */
function danceCrown(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    const beat = Math.abs(Math.sin(tt * Math.PI * 2));
    c.translate(0, headTop(f) * 0.9 * d - beat * d * 0.12);   /* base sobre la coronilla */
    c.rotate(Math.sin(tt * Math.PI * 2) * 0.05);
    /* La base de la corona del PNG está al 93% de su alto: el centro se
       sube para que esa base, y no el centro, quede sobre la cabeza. */
    const cw = headW(f) * d * 1.35;
    if (hq(c, 'crown', 0, -cw * 0.43, cw)) return;
    const w = headW(f) * d * 1.25, h = w * 0.42;
    c.beginPath();
    c.moveTo(-w / 2, 0); c.lineTo(-w / 2, -h * 0.55); c.lineTo(-w * 0.25, -h * 0.2);
    c.lineTo(0, -h); c.lineTo(w * 0.25, -h * 0.2); c.lineTo(w / 2, -h * 0.55); c.lineTo(w / 2, 0);
    c.closePath();
    const g = c.createLinearGradient(0, -h, 0, 0);
    g.addColorStop(0, '#f7e08a'); g.addColorStop(1, '#b8872e');
    c.fillStyle = g; c.fill();
    c.strokeStyle = '#8a6420'; c.lineWidth = d * 0.05; c.stroke();
    c.fillStyle = '#c99a3a'; c.fillRect(-w / 2, -h * 0.14, w, h * 0.18);
    [[-w * 0.3, '#e0584e'], [0, '#5aa9e6'], [w * 0.3, '#7a8c6e']].forEach(([x, col]) => {
      c.fillStyle = col; c.beginPath(); c.arc(x, -h * 0.05, d * 0.09, 0, Math.PI * 2); c.fill();
    });
    [[-w / 2, -h * 0.55], [0, -h], [w / 2, -h * 0.55]].forEach(([x, y]) => {
      c.fillStyle = '#fff3c4'; c.beginPath(); c.arc(x, y, d * 0.08, 0, Math.PI * 2); c.fill();
    });
  }, tt);
}

/* ── Chistosos ───────────────────────────────────────────────── */

/* Bigote o labios en palito, como los accesorios de photobooth. Alterna
   por cara: en pareja, uno bigote y otro labios. */
function mustacheStick(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    c.rotate(Math.sin(tt * 2 + i) * 0.04);
    const lips = i % 2 === 1;
    /* Entre la punta de la nariz y la boca, un poco más cerca de la boca:
       ahí queda el bigote pegado a la nariz. */
    const mY = noseY(f) + (mouthY(f) - noseY(f)) * 0.55;
    c.save();
    c.translate(lips ? -d * 0.2 : d * 0.2, (lips ? mouthY(f) + 0.05 : mY) * d);
    c.rotate(lips ? 0.35 : -0.35);
    c.fillStyle = '#b8894e'; c.fillRect(-d * 0.05, 0, d * 0.1, d * 3.2);
    c.restore();
    if (!lips) {
      if (hq(c, 'mustache', 0, mY * d, d * 2.4)) return;
      c.save(); c.translate(0, mY * d); c.scale(1.05, 1.05); c.fillStyle = '#2b1d15';
      for (const sx of [1, -1]) {
        c.save(); c.scale(sx, 1);
        c.beginPath();
        c.moveTo(0, -d * 0.06);
        c.bezierCurveTo(d * 0.3, -d * 0.3, d * 0.62, -d * 0.12, d * 0.72, d * 0.02);
        c.bezierCurveTo(d * 0.86, d * 0.1, d * 1.02, -d * 0.05, d * 0.98, -d * 0.3);
        c.bezierCurveTo(d * 1.12, -d * 0.02, d * 0.95, d * 0.3, d * 0.62, d * 0.24);
        c.bezierCurveTo(d * 0.38, d * 0.2, d * 0.16, d * 0.12, 0, d * 0.2);
        c.closePath(); c.fill();
        c.restore();
      }
      c.restore();
    } else {
      /* Los labios del PNG están un poco abajo del centro (56%). */
      if (hq(c, 'lips', 0, (mouthY(f) - 0.12) * d, d * 2.0)) return;
      c.save(); c.translate(0, mouthY(f) * d); c.scale(1.15, 1.15);
      c.fillStyle = '#d0344a';
      c.beginPath();
      c.moveTo(-d * 0.62, 0);
      c.bezierCurveTo(-d * 0.35, -d * 0.32, -d * 0.12, -d * 0.3, 0, -d * 0.16);
      c.bezierCurveTo(d * 0.12, -d * 0.3, d * 0.35, -d * 0.32, d * 0.62, 0);
      c.bezierCurveTo(d * 0.35, d * 0.4, -d * 0.35, d * 0.4, -d * 0.62, 0);
      c.closePath(); c.fill();
      c.strokeStyle = 'rgba(120,20,35,0.6)'; c.lineWidth = d * 0.04;
      c.beginPath(); c.moveTo(-d * 0.55, d * 0.01); c.quadraticCurveTo(0, d * 0.08, d * 0.55, d * 0.01); c.stroke();
      c.fillStyle = 'rgba(255,255,255,0.35)';
      c.beginPath(); c.ellipse(-d * 0.22, d * 0.14, d * 0.12, d * 0.04, 0, 0, Math.PI * 2); c.fill();
      c.restore();
    }
  }, tt);
}

/* Game over, como pantalla de arcade: guiño al juego de la boda. */
const PIXEL = '"Press Start 2P", monospace';
function pixelHeart(c, x, y, p, color) {
  const rows = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
  c.fillStyle = color;
  rows.forEach((r, j) => { for (let k = 0; k < r.length; k++) if (r[k] === 'X') c.fillRect(x + k * p, y + j * p, p, p); });
}

function arcade(c, W, H, tt) {
  const T8 = STR[lang].arcade;
  /* Líneas de tele vieja */
  const step = Math.max(3, Math.round(H * 0.004));
  c.fillStyle = 'rgba(0,0,0,0.13)';
  for (let y = 0; y < H; y += step) c.fillRect(0, y, W, Math.max(1, step * 0.4));

  c.textBaseline = 'middle'; c.fillStyle = '#ffffff';
  c.font = (W * 0.027) + 'px ' + PIXEL;
  c.textAlign = 'left';  c.fillText(T8.score + ' 031026', W * 0.07, H * 0.135);
  c.textAlign = 'right'; c.fillText(T8.level, W * 0.93, H * 0.135);
  for (let k = 0; k < 3; k++) pixelHeart(c, W * 0.07 + k * W * 0.07, H * 0.152, W * 0.008, '#ff4d6d');

  c.textAlign = 'center';
  const big = W * 0.088;
  c.font = big + 'px ' + PIXEL;
  c.fillStyle = '#2c2c2c'; c.fillText('GAME OVER', W / 2 + big * 0.08, H * 0.24 + big * 0.08);
  c.fillStyle = '#ff4d6d'; c.fillText('GAME OVER', W / 2, H * 0.24);

  c.font = (W * 0.04) + 'px ' + PIXEL; c.fillStyle = '#ffffff';
  c.fillText(T8.cont, W / 2, H * 0.3);
  const opt = W * 0.036;
  c.font = opt + 'px ' + PIXEL; c.fillStyle = '#e6c563';
  c.fillText(T8.yes, W / 2 + opt * 0.9, H * 0.345);
  if (Math.floor(tt * 2.5) % 2 === 0) {                /* la flechita parpadea */
    const ax = W / 2 + opt * 0.9 - c.measureText(T8.yes).width / 2 - opt * 1.2, ay = H * 0.345;
    c.beginPath(); c.moveTo(ax, ay - opt * 0.45); c.lineTo(ax + opt * 0.7, ay); c.lineTo(ax, ay + opt * 0.45);
    c.closePath(); c.fill();
  }
}

/* ════════════════════════════════════════════════════════════════
   CATÁLOGO DE FILTROS
   ────────────────────────────────────────────────────────────────
   El orden de este arreglo es el orden del selector. Cada filtro
   puede traer:
     face  → adorno sobre cada cara detectada (va espejeado con el
             video, para que caiga donde la persona se ve)
     echo  → la imagen deja estela (ver updateEcho)
     backTip → sugiere la cámara de atrás (filtros para tomar a otros)
     scene → capa sobre el video, sin espejo (sprites, partículas)
     frame → marco y firma, siempre lo último
     needs → imágenes que hay que tener listas antes de disparar
     thumb → miniatura del selector: { src, fit }, { glyph } o
             { draw(c, S) }. Las partículas a escala de miniatura se
             vuelven puntitos irreconocibles, por eso los filtros sin
             imagen dibujan su propio ícono en grande.
   ════════════════════════════════════════════════════════════════ */
const FILTERS = [
  {
    label:{ es:'Clásico', en:'Classic' },
    thumb:{ glyph:'C&R' },
    frame:(c, W, H) => { goldFrame(c, W, H); signature(c, W, H); }
  },

  /* ── Nuestros momentos ─────────────────────────────────────
     Fotos de la sesión. Van por las orillas: el centro queda libre
     para la cara de quien se toma la foto. */
  {
    label:{ es:'Polaroids', en:'Polaroids' },
    needs: A.moments,
    thumb:{ src:A.moments[0], fit:'cover' },
    scene:(c, W, H, tt) => {
      const sway = k => Math.sin(tt * 1.1 + k) * 0.03;
      polaroid(c, A.moments, W * 0.23, H * 0.225, W * 0.34, -0.14 + sway(0), tt, 0);
      polaroid(c, A.moments, W * 0.8,  H * 0.25,  W * 0.3,   0.12 + sway(2), tt, 4.33);
      polaroid(c, A.moments, W * 0.2,  H * 0.61,  W * 0.28,  0.09 + sway(4), tt, 8.66);
    },
    frame:(c, W, H) => { vignette(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Carrete', en:'Film reel' },
    needs: A.moments,
    thumb:{ src:A.moments[6], fit:'cover' },
    scene:(c, W, H, tt) => {
      /* Una sola tira arriba: la segunda tapaba la cara. */
      filmStrip(c, W, H, A.moments, H * 0.165, tt, -1, 0);
    },
    frame:(c, W, H) => { thinFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Nuestra historia', en:'Our story' },
    needs: A.moments,
    thumb:{ src:A.moments[10], fit:'cover' },
    scene:(c, W, H, tt) => {
      polaroid(c, A.moments, W * 0.73, H * 0.605, W * 0.42, 0.06 + Math.sin(tt * 0.9) * 0.025, tt, 0);
      sparkles(c, W, H, tt, 8);
    },
    frame:(c, W, H) => { vignette(c, W, H); signature(c, W, H); }
  },

  /* ── Los novios ────────────────────────────────────────────
     Uno solo por filtro, cada uno con su animación del juego. */
  {
    label:{ es:'Los novios bailan', en:'The couple dances' },
    needs: A.dancing,
    thumb:{ src:A.dancing[0] },
    scene:(c, W, H, tt) => {
      const bob = Math.sin(tt * 6) * H * 0.01;
      drawSprite(c, anim(A.dancing, 6, tt), W * 0.74, H * 0.645 + bob, W * 0.4, Math.sin(tt * 3) * 0.06);
      flakes(c, W, H, tt, { n:14, speed:0.1, size:0.018, colors:['#e6c563','#f5f0e8','#e0798c'] });
    },
    frame:(c, W, H) => { goldFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'El beso', en:'The kiss' },
    needs: A.kiss,
    thumb:{ src:A.kiss[0] },
    scene:(c, W, H, tt) => {
      const bob = Math.sin(tt * 2.2) * H * 0.008;
      drawSprite(c, anim(A.kiss, 1.4, tt), W * 0.74, H * 0.65 + bob, W * 0.38, Math.sin(tt * 1.6) * 0.04);
      /* Corazones subiendo desde los novios. */
      for (let i = 0; i < 9; i++) {
        const life = ((tt * 0.3 + rnd(i, 1)) % 1);
        c.save();
        c.globalAlpha = Math.sin(life * Math.PI) * 0.85;
        c.translate(W * 0.74 + (rnd(i, 2) - 0.5) * W * 0.3, H * 0.6 - life * H * 0.3);
        c.rotate(Math.sin(tt * 2 + i) * 0.3);
        heartPath(c, W * (0.02 + rnd(i, 3) * 0.022));
        c.fillStyle = '#e0798c'; c.fill();
        c.restore();
      }
    },
    frame:(c, W, H) => { goldFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Celebración', en:'Celebration' },
    needs: A.win,
    thumb:{ src:A.win[0] },

/* Miniatura: una foto, un sprite, un monograma, o el filtro mismo
   dibujado sobre una cara imaginaria. Devuelve false si le falta una
   imagen, para volver a pintarla cuando cargue. */
function drawThumb(cv, F) {
  const c = cv.getContext('2d'), S = THUMB;
  const g = c.createRadialGradient(S * 0.5, S * 0.35, 4, S * 0.5, S * 0.5, S * 0.75);
  g.addColorStop(0, '#4a4540'); g.addColorStop(1, '#1c1a17');
  c.globalAlpha = 1; c.fillStyle = g; c.fillRect(0, 0, S, S);
  const th = F.thumb || {};

  if (th.draw) { th.draw(c, S); return true; }
  if (th.glyph) {
    c.fillStyle = '#d9bf8f'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '400 ' + (S * 0.36) + 'px "Great Vibes", cursive';
    c.fillText(th.glyph, S / 2, S * 0.54);
    return true;
  }
  if (th.src) {
    const im = img(th.src); if (!im) return false;
    if (th.fit === 'cover') coverImage(c, im, 0, 0, S, S);
    else {
      const h = S * 0.78, w = h * im.naturalWidth / im.naturalHeight;
      c.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
    }
    return true;
  }
  const tt = 1.3;
  if (F.scene) F.scene(c, S, S, tt);
  if (F.face)  F.face(c, { x:S / 2, y:S * 0.62, d:S * 0.2, a:0 }, 0, tt);
  return true;
}

function buildRail() {
  const rail = $('rail'); rail.innerHTML = '';
  FILTERS.forEach((F, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    const cv = document.createElement('canvas');
    cv.width = cv.height = THUMB;
    b.appendChild(cv);
    b.onclick = () => selectFilter(i, true);
    rail.appendChild(b);
  });
  paintThumbs();
  const srcs = FILTERS.map(F => F.thumb && F.thumb.src).filter(Boolean);
  preload(srcs).then(paintThumbs);
}
function paintThumbs() {
  [...$('rail').children].forEach((b, i) => drawThumb(b.firstChild, FILTERS[i]));
}
function labelRail() {
  [...$('rail').children].forEach((b, i) => b.setAttribute('aria-label', FILTERS[i].label[lang]));
  $('filter-name').textContent = FILTERS[filterIx].label[lang];
}

/* railTarget: mientras el carrusel se desliza solo hacia un filtro,
   los que pasan por el centro en el camino no se activan. */
let railTarget = null, railTargetTimer = 0;

function selectFilter(i, scroll) {
  i = Math.max(0, Math.min(FILTERS.length - 1, i));
  if (i !== filterIx) {
    filterIx = i;
    lastFaceAt = performance.now();
    tileHits = []; smooth = [];
    if (FILTERS[i].needs) preload(FILTERS[i].needs);
    if (FILTERS[i].backTip && facing === 'user' && !danceTipShown) {
      danceTipShown = true;
      toast(t('danceTip'));
    }
  }
  [...$('rail').children].forEach((b, k) => b.classList.toggle('active', k === i));
  $('filter-name').textContent = FILTERS[i].label[lang];
  if (scroll) centerThumb(i, true);
}

function centerThumb(i, smooth) {
  const rail = $('rail'), b = rail.children[i];
  if (!b) return;
  railTarget = i;
  clearTimeout(railTargetTimer);
  railTargetTimer = setTimeout(() => { railTarget = null; }, 700);
  rail.scrollTo({ left: b.offsetLeft + b.offsetWidth / 2 - rail.clientWidth / 2,
                  behavior: smooth ? 'smooth' : 'auto' });
}

function closestThumb() {
  const rail = $('rail'), mid = rail.scrollLeft + rail.clientWidth / 2;
  let best = 0, bd = Infinity;
  [...rail.children].forEach((b, i) => {
    const d = Math.abs(b.offsetLeft + b.offsetWidth / 2 - mid);
    if (d < bd) { bd = d; best = i; }
  });
  return best;
}

$('rail').addEventListener('scroll', () => {
  const k = closestThumb();
  if (railTarget !== null) {
    if (k !== railTarget) return;
    railTarget = null;
  }
  if (k !== filterIx) selectFilter(k, false);
}, { passive: true });
