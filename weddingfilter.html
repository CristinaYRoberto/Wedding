/* ── El visor recibe el hueco que sobra, medido de verdad ─────── */
/* Se mide con posiciones reales: lo que hay entre la parte de abajo
   del visor y el último elemento no depende del alto del visor, así
   que una sola medición da el tamaño exacto en cualquier teléfono. */
function fitViewport() {
  const st = $('stage'); if (st.hidden) return;
  const vp = $('viewport');
  const vr = vp.getBoundingClientRect();
  const below = $('shoot-hint').getBoundingClientRect().bottom - vr.bottom;
  const padBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
  let h = Math.max(220, window.innerHeight - vr.top - below - padBottom - 12);
  const maxW = st.clientWidth - 32;
  let w = h * RATIO;
  if (w > maxW) { w = maxW; h = w / RATIO; }
  vp.style.width  = Math.round(w) + 'px';
  vp.style.height = Math.round(h) + 'px';
}
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', () => setTimeout(fitViewport, 250));

/* ── Arranque de la cámara ───────────────────────────────────── */
async function startCamera() {
  if (!window.isSecureContext) { introError(t('insecure')); return false; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { introError(t('unsupported')); return false; }

  if (stream) stream.getTracks().forEach(tr => tr.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      /* En horizontal a propósito: los teléfonos describen su cámara en
         horizontal y giran el video solos al estar en vertical. Pedir
         1080x1920 hacía que Android eligiera un modo chico, y ese video
         recortado a 9:16 salía borroso y 3 veces más cerca. */
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } }
    });
  } catch (e) {
    introError(e.name === 'NotAllowedError' || e.name === 'SecurityError' ? t('denied')
             : e.name === 'NotFoundError' || e.name === 'OverconstrainedError' ? t('nocam')
             : t('unsupported'));
    return false;
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  lastTs = -1; smooth = []; tileHits = [];
  return true;
}
function introError(msg) { const el = $('intro-error'); el.textContent = msg; el.hidden = false; }

/* ── MediaPipe: se carga aparte, nunca bloquea la cámara ─────── */
async function loadDetector() {
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER);
    const files  = await vision.FilesetResolver.forVisionTasks(MP_WASM);
    detector = await vision.FaceDetector.createFromOptions(files, {
      baseOptions: { modelAssetPath: MP_MODEL, delegate: 'GPU' },
      /* IMAGE y no VIDEO: cada cuadro se le pasan dos imágenes de
         distinto tamaño (el cuadro completo y una sección), y el modo
         VIDEO espera un solo flujo con marcas de tiempo crecientes. */
      runningMode: 'IMAGE',
      minDetectionConfidence: 0.45
    });
    arState = 'on';
  } catch (e) {
    console.warn('Detección de cara no disponible:', e && e.message);
    arState = 'off';
  }
}

/* Encaje del video en el cuadro 9:16. Llenarlo completo ("cover") con
   una cámara de 16:9 o 4:3 recorta hasta dos tercios del ancho y la cara
   se ve 2 o 3 veces más cerca de lo normal. El acercamiento se limita a
   MAX_ZOOM sobre "cabe completo"; si queda espacio, se rellena con el
   mismo video desenfocado, como hacen las historias de Instagram. Una
   cámara vertical 3:4 (lo común en teléfonos) sí llena sin barras. */
const MAX_ZOOM = 1.35;
function videoFit(vw, vh, W, H) {
  const cover = Math.max(W / vw, H / vh), contain = Math.min(W / vw, H / vh);
  const s = Math.min(cover, contain * MAX_ZOOM);
  return { s, dx: (W - vw * s) / 2, dy: (H - vh * s) / 2, bars: s < cover - 1e-6 };
}

/* Fondo desenfocado: el video reducido a 27x48 y vuelto a ampliar en dos
   pasos. Más barato que un filtro de desenfoque, que además Safari no
   soporta en canvas. */
const blurSmall = Object.assign(document.createElement('canvas'), { width: 27,  height: 48 });
const blurMid   = Object.assign(document.createElement('canvas'), { width: 108, height: 192 });
function blurFill(c, W, H) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(27 / vw, 48 / vh);
  const a = blurSmall.getContext('2d'), b = blurMid.getContext('2d');
  a.drawImage(video, (27 - vw * sc) / 2, (48 - vh * sc) / 2, vw * sc, vh * sc);
  b.imageSmoothingEnabled = true; b.drawImage(blurSmall, 0, 0, 108, 192);
  c.imageSmoothingEnabled = true; c.drawImage(blurMid, 0, 0, W, H);
  c.fillStyle = 'rgba(20,19,18,0.35)'; c.fillRect(0, 0, W, H);
}

/* ── Caras en grupo ──────────────────────────────────────────────
   El modelo de MediaPipe (short range) está hecho para selfies: con la
   imagen completa encuentra la cara grande de enfrente y pierde las
   chicas. Probado con fotos de la sesión: en la pareja sentada veía 1
   de 2 caras; en dos parejas juntas, 0 de 4.

   Arreglo: además de la imagen completa, en cada cuadro se revisa UNA
   sección ampliada de una cuadrícula de 3x4 con traslape, por turnos.
   Así las caras chicas llegan al tamaño que el modelo espera (con las
   mismas fotos: 2 de 2 y 3 de 4) y el costo por cuadro se queda en dos
   detecciones.
   ponytail: una cara que solo aparece en secciones se actualiza cada
   12 cuadros (~0,4 s); si estorba, rastrear su sección con prioridad. */
const GRID_COLS = 3, GRID_ROWS = 4;
const TILE_TTL  = 14;          /* cuadros que sobrevive una cara vista solo en una sección */
/* Confianza mínima para lo que se ve en una sección. Ampliar también
   amplía el ruido: en la foto de la pareja sentada una mano salió como
   cara al 69%, y las caras reales al 90–94%. */
const TILE_MIN  = 0.75;
let tileIx = 0, frameNo = 0, tileHits = [];
const tileCv  = document.createElement('canvas');
const tileCtx = tileCv.getContext('2d');

/* Detección → cara en píxeles del video. (sx, sy, rw, rh) es la región
   del video que se le pasó al detector.
   keypoints: 0 y 1 ojos, 2 nariz, 3 boca, 4 y 5 orejas. */
function detToFace(det, sx, sy, rw, rh) {
  const k = det.keypoints;
  if (!k || k.length < 2) return null;
  const kp = i => k[i] ? { x: sx + k[i].x * rw, y: sy + k[i].y * rh } : null;
  const a = kp(0), b = kp(1);
  const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  /* Nariz y boca medidas hacia abajo en el eje de la cara (ya sin la
     inclinación) y en distancias entre ojos. Antes todo se colgaba de
     proporciones fijas: el bigote caía en la boca y la corona en la
     frente, sobre todo con la cara cerca. */
  const cos = Math.cos(-ang), sin = Math.sin(-ang);
  const down = p => p ? ((p.x - x) * sin + (p.y - y) * cos) / d : null;
  const clamp = (v, lo, hi, def) => v === null || !isFinite(v) ? def : Math.max(lo, Math.min(hi, v));
  const e1 = kp(4), e2 = kp(5);
  return {
    x, y, d, a: ang,
    ny: clamp(down(kp(2)), 0.3, 1.2, 0.7),                      /* punta de la nariz */
    my: clamp(down(kp(3)), 0.7, 1.8, 1.15),                     /* centro de la boca */
    hw: clamp(e1 && e2 ? Math.hypot(e2.x - e1.x, e2.y - e1.y) / d : null, 1.6, 3.4, 2.4),  /* oreja a oreja */
    s: det.categories && det.categories[0] ? det.categories[0].score : 0.5
  };
}

function detectFaces(vw, vh) {
  frameNo++;
  const fresh = (detector.detect(video).detections || [])
                  .map(d => detToFace(d, 0, 0, vw, vh)).filter(Boolean);

  /* Con la cámara acostada la cuadrícula se voltea: 4 columnas, 3 filas. */
  const cols = vw > vh ? GRID_ROWS : GRID_COLS, rows = vw > vh ? GRID_COLS : GRID_ROWS;
  const tw = vw * 1.25 / cols, th = vh * 1.25 / rows;
  const col = tileIx % cols, row = Math.floor(tileIx / cols) % rows;
  tileIx = (tileIx + 1) % (cols * rows);
  const sx = col * (vw - tw) / (cols - 1), sy = row * (vh - th) / (rows - 1);

  /* El detector reduce todo a 128 px; mandarle la sección a 480 px basta
     y ahorra copiar píxeles de más. */
  const q = Math.min(1, 480 / Math.max(tw, th));
  const cw = Math.round(tw * q), ch = Math.round(th * q);
  if (tileCv.width !== cw || tileCv.height !== ch) { tileCv.width = cw; tileCv.height = ch; }
  tileCtx.drawImage(video, sx, sy, tw, th, 0, 0, cw, ch);

  /* Lo que esta sección vio antes se reemplaza por lo que ve ahora, así
     el adorno de alguien que se fue no se queda flotando. Solo cuenta el
     centro de la sección: una cara en la orilla puede salir cortada
     aquí y completa en la sección vecina. */
  const mx = tw * 0.15, my = th * 0.15;
  tileHits = tileHits.filter(h => frameNo - h.frame <= TILE_TTL &&
    !(h.x > sx + mx && h.x < sx + tw - mx && h.y > sy + my && h.y < sy + th - my));
  for (const d of detector.detect(tileCv).detections || []) {
    const f = detToFace(d, sx, sy, tw, th);
    if (f && f.s >= TILE_MIN) { f.frame = frameNo; tileHits.push(f); }
  }

  /* Gana la detección más confiable, con un castigo por antigüedad.
     Antes ganaba siempre la imagen completa, y ahí una cara chica sale
     al 50% con los ojos corridos; la misma cara en su sección sale al
     94% y bien puesta. Dos detecciones son la misma persona si sus ojos
     están a menos de una distancia entre ojos: las cajas del detector
     varían demasiado entre pasadas para compararlas. */
  const rank = f => f.s - (f.frame === undefined ? 0 : (frameNo - f.frame) * 0.02);
  const keep = [];
  fresh.concat(tileHits).sort((a, b) => rank(b) - rank(a)).forEach(f => {
    if (!keep.some(k => Math.hypot(k.x - f.x, k.y - f.y) < Math.max(k.d, f.d) * 1.2)) keep.push(f);
  });
  return keep;
}

/* La detección tiembla cuadro a cuadro; un promedio exponencial basta
   para que el adorno no vibre. Cada cara nueva se empareja con la
   anterior más cercana: con grupos el número de caras cambia seguido y
   emparejar por posición en la lista mezclaba a una persona con otra. */
function smoothFaces(list) {
  const prev = smooth.slice(), out = [];
  const L = (a, b) => a + (b - a) * 0.4;
  for (const n of list) {
    let best = -1, bd = Infinity;
    prev.forEach((o, i) => {
      if (!o) return;
      const dd = Math.hypot(o.x - n.x, o.y - n.y);
      if (dd < bd) { bd = dd; best = i; }
    });
    if (best < 0 || bd > n.d * 1.5) { out.push(Object.assign({}, n)); continue; }
    const o = prev[best]; prev[best] = null;
    /* El ángulo se interpola por seno y coseno: así -179° y 179° no se
       promedian en 0°. */
    const ang = Math.atan2(L(Math.sin(o.a), Math.sin(n.a)), L(Math.cos(o.a), Math.cos(n.a)));
    out.push({ x: L(o.x, n.x), y: L(o.y, n.y), d: L(o.d, n.d), a: ang,
               ny: L(o.ny, n.ny), my: L(o.my, n.my), hw: L(o.hw, n.hw) });
  }
  smooth = out;
  /* De izquierda a derecha: el orden no cambia mientras nadie se cruce,
     así el velo y el sombrero no brincan de cabeza en cabeza. */
  return out.slice().sort((a, b) => a.x - b.x);
}

/* ── El dibujado: una sola función para pantalla, foto y video ──
   mirror = true con la cámara frontal, para que la imagen coincida
   con lo que la persona ve. La firma NO se voltea porque se dibuja
   fuera del espejo. */
function render(c, W, H, facesPx, tt, mirror, bare) {
  const F = FILTERS[filterIx];
  c.clearRect(0, 0, W, H);
  const vw = video.videoWidth, vh = video.videoHeight;

  if (vw && vh) {
    const fit = videoFit(vw, vh, W, H);
    /* La estela ya trae el espejo y el encuadre aplicados. */
    const echo = F.echo && echoReady;
    if (echo) c.drawImage(echoCv, 0, 0, W, H);
    c.save();
    if (mirror) { c.translate(W, 0); c.scale(-1, 1); }
    if (!echo) {
      if (fit.bars) blurFill(c, W, H);
      c.drawImage(video, fit.dx, fit.dy, vw * fit.s, vh * fit.s);
    }
    if (F.face) facesPx.forEach((fc, i) => F.face(c, fc, i, tt));
    c.restore();
  }
  if (F.scene) F.scene(c, W, H, tt);
  /* bare = las tomas de la tira: llevan los efectos del filtro pero no
     el marco ni la firma, porque la tira pone los suyos una sola vez
     alrededor de las cuatro. */
  if (bare)         thinFrame(c, W, H);
  else if (F.frame) F.frame(c, W, H, tt);
}

const usesFaces = F => !!F.face;

/* ── Estela ──────────────────────────────────────────────────────
   Cada cuadro se pinta al 30% encima del anterior: lo que se mueve deja
   rastro y lo quieto se ve normal. Es el único filtro con memoria entre
   cuadros, por eso vive aparte y render() solo lo lee.
   ponytail: el búfer mide lo que la pantalla, así que la foto de este
   filtro sale a esa resolución (~650x1150), no a 1080x1920. */
const echoCv = document.createElement('canvas'), echoCtx = echoCv.getContext('2d');
let echoReady = false;
function updateEcho(W, H, vw, vh) {
  if (echoCv.width !== W || echoCv.height !== H) { echoCv.width = W; echoCv.height = H; echoReady = false; }
  const fit = videoFit(vw, vh, W, H);
  echoCtx.save();
  echoCtx.globalAlpha = echoReady ? 0.3 : 1;
  if (facing === 'user') { echoCtx.translate(W, 0); echoCtx.scale(-1, 1); }
  if (fit.bars) blurFill(echoCtx, W, H);
  echoCtx.drawImage(video, fit.dx, fit.dy, vw * fit.s, vh * fit.s);
  echoCtx.restore();
  echoReady = true;
}

/* Aviso sobre la cámara. Solo aparece cuando sirve: un filtro de cara
   sin cara a la vista. */
function updateFaceHint(time) {
  const F = FILTERS[filterIx];
  let hint = '';
  if (usesFaces(F)) {
    if (faces.length) lastFaceAt = time;
    if (arState === 'off') hint = t('faceOff');
    else if (time - lastFaceAt > 1500) hint = arState === 'load' ? t('faceLoad') : t('faceHint');
  }
  if (hint !== shownHint) {
    shownHint = hint;
    $('face-hint').textContent = hint;
    $('face-hint').hidden = !hint;
  }
}

function loop(time) {
  raf = requestAnimationFrame(loop);
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;

  const cssW = viewCv.clientWidth;
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.round(cssW * dpr), H = Math.round(cssW / RATIO * dpr);
  if (viewCv.width !== W || viewCv.height !== H) { viewCv.width = W; viewCv.height = H; }

  if (detector && usesFaces(FILTERS[filterIx]) && video.currentTime !== lastTs) {
    lastTs = video.currentTime;
    try {
      const fit = videoFit(vw, vh, W, H);
      const raw = detectFaces(vw, vh).map(f =>
        ({ x: fit.dx + f.x * fit.s, y: fit.dy + f.y * fit.s, d: f.d * fit.s, a: f.a, ny: f.ny, my: f.my, hw: f.hw }));
      faces = smoothFaces(raw);
    } catch (_e) { /* un cuadro perdido no importa */ }
  } else if (!usesFaces(FILTERS[filterIx])) {
    faces = [];
  }

  if (FILTERS[filterIx].echo) updateEcho(W, H, vw, vh); else echoReady = false;
  updateFaceHint(time);
  render(vctx, W, H, faces, time / 1000, facing === 'user');
}

/* ── Captura de una foto a resolución de historia ─────────────── */
function drawShot(W, H, bare) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  /* Las caras se midieron para el lienzo de pantalla: se reescalan al
     del archivo, que es más grande. */
  const k = W / (viewCv.width || W);
  const scaled = faces.map(f => Object.assign({}, f, { x: f.x * k, y: f.y * k, d: f.d * k }));
  render(cv.getContext('2d'), W, H, scaled, performance.now() / 1000, facing === 'user', bare);
  return cv;
}

async function capturePhoto() {
  const F = FILTERS[filterIx];
  if (F.needs) await preload(F.needs);
  const H = CAP_H, W = Math.round(CAP_H * RATIO);
  const blob = await new Promise(r => drawShot(W, H).toBlob(r, 'image/jpeg', 0.92));
  showResult(blob, 'CristinaYRoberto.jpg');
}

/* ── Tira de 4 fotos, 2x2, como las de las cabinas de boda ────── */
async function captureStrip() {
  const F = FILTERS[filterIx];
  if (F.needs) await preload(F.needs);
  const dots = $('strip-dots');
  dots.hidden = false;
  [...dots.children].forEach(d => d.classList.remove('done'));

  const shots = [];
  for (let n = 0; n < 4; n++) {
    await countdown(n === 0 ? 3 : 2);
    flash();
    shots.push(drawShot(540, 960, true));     /* miniatura sin marco ni firma */
    dots.children[n].classList.add('done');
    await wait(450);
  }
  dots.hidden = true;

  const W = Math.round(CAP_H * RATIO), H = CAP_H;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#17150f'; c.fillRect(0, 0, W, H);

  const pad = W * 0.045, gap = W * 0.03;
  const top = H * 0.09, bottom = H * 0.275;   /* deja libre la firma */
  const cellW = (W - pad * 2 - gap) / 2;
  const cellH = (H - top - bottom - gap) / 2;

  shots.forEach((s, i) => {
    const x = pad + (i % 2) * (cellW + gap);
    const y = top + Math.floor(i / 2) * (cellH + gap);
    /* Recorte "cover" del centro de cada toma. */
    const sc = Math.max(cellW / s.width, cellH / s.height);
    const sw = cellW / sc, sh = cellH / sc;
    c.save();
    c.beginPath(); c.rect(x, y, cellW, cellH); c.clip();
    c.drawImage(s, (s.width - sw) / 2, (s.height - sh) / 2, sw, sh, x, y, cellW, cellH);
    c.restore();
    c.strokeStyle = 'rgba(184,154,106,0.6)'; c.lineWidth = W * 0.004;
    c.strokeRect(x, y, cellW, cellH);
  });

  signature(c, W, H);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
  showResult(blob, 'CristinaYRoberto-tira.jpg');
}

/* ── Video ───────────────────────────────────────────────────── */
/* Solo MP4: es lo que aceptan Instagram, Facebook y WhatsApp. Si el
   navegador únicamente ofrece WebM, el gesto de video no se activa
   antes que dar un archivo que la app va a rechazar. */
function pickMime() {
  if (!window.MediaRecorder) return '';
  for (const m of ['video/mp4;codecs=avc1.42E01E', 'video/mp4']) {
    if (MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

/* Grabación por gesto: empieza cuando el dedo lleva HOLD_MS sobre el
   obturador y termina al soltar, como Snapchat. El corte duro a
   MAX_SECS existe para que un dedo olvidado no llene la memoria del
   teléfono con un video de diez minutos. */
let recStream = null, recChunks = [], recStart = 0, recStopTimer = 0, recBarTimer = 0;

async function startRec() {
  const F = FILTERS[filterIx];
  if (F.needs) preload(F.needs);
  recChunks = [];
  recStream = viewCv.captureStream(30);
  recorder = new MediaRecorder(recStream, { mimeType: recMime, videoBitsPerSecond: 6000000 });
  recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  recorder.start();
  recStart = performance.now();

  $('shutter').classList.add('rec');
  /* Chrome la bloquea si aún no hubo un toque real; no es un problema. */
  try { if (navigator.vibrate) navigator.vibrate(18); } catch (_e) {}
  toast(t('recording'));

  /* La barra va con setInterval y no con rAF: si llega una notificación,
     rAF se pausa y la barra se quedaría congelada mientras la
     grabación sigue corriendo. */
  const bar = $('rec-bar');
  recBarTimer = setInterval(() => {
    bar.style.width = Math.min(100, (performance.now() - recStart) / (MAX_SECS * 1000) * 100) + '%';
  }, 100);
  recStopTimer = setTimeout(stopRec, MAX_SECS * 1000);
}

async function stopRec() {
  if (!recorder || recorder.state !== 'recording') return;
  clearTimeout(recStopTimer); clearInterval(recBarTimer);
  const secs = (performance.now() - recStart) / 1000;
  const done = new Promise(r => { recorder.onstop = r; });
  recorder.stop();
  await done;

  $('rec-bar').style.width = '0%';
  $('shutter').classList.remove('rec');
  recStream.getTracks().forEach(tr => tr.stop());
  recorder = null; recStream = null;

  /* Un video de medio segundo no sirve y algunos navegadores ni
     siquiera cierran bien el contenedor. */
  if (secs < 0.8 || !recChunks.length) { toast(t('tooShort')); return; }
  showResult(new Blob(recChunks, { type: recMime }), 'CristinaYRoberto.mp4');
}

/* ── Cuenta regresiva, destello, esperas ─────────────────────── */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function countdown(from) {
  if (!timerOn && from === 3 && mode === 'photo') return;
  const cd = $('countdown'); cd.hidden = false;
  for (let n = from; n > 0; n--) { cd.textContent = n; await wait(850); }
  cd.hidden = true;
}
function flash() {
  const fl = $('flash');
  fl.style.transition = 'none'; fl.style.opacity = '0.9';
  requestAnimationFrame(() => { fl.style.transition = 'opacity .35s ease'; fl.style.opacity = '0'; });
}

/* ── Resultado ───────────────────────────────────────────────── */
function showResult(blob, name) {
  if (!blob || !blob.size) { toast(t('shotfail')); return; }
  if (shotUrl) URL.revokeObjectURL(shotUrl);
  shotBlob = blob; shotName = name; shotUrl = URL.createObjectURL(blob);

  const isVideo = blob.type.indexOf('video') === 0;
  $('shot').hidden = isVideo;
  $('shot-video').hidden = !isVideo;
  if (isVideo) { $('shot-video').src = shotUrl; $('shot-video').play().catch(() => {}); }
  else         { $('shot').src = shotUrl; }

  $('btn-save').href = shotUrl;
  $('btn-save').setAttribute('download', name);

  /* Con menú de compartir: Compartir es el botón grande. Sin él
     (escritorio, navegadores viejos) Guardar pasa a ser el principal. */
  const file = new File([blob], name, { type: blob.type });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  $('btn-share').hidden = !canShare;
  $('btn-save').className  = 'btn ' + (canShare ? 'btn-ghost' : 'btn-primary full');
  $('btn-again').className = 'btn btn-ghost' + (canShare ? '' : ' full');

  const sh = $('save-hint');
  if (canShare && IS_IOS) { sh.innerHTML = t('iosSave');  sh.hidden = false; }
  else if (!canShare)     { sh.innerHTML = t('savehint'); sh.hidden = false; }
  else                    { sh.hidden = true; }

  show('result');
}

async function share() {
  if (!shotBlob) return;
  const file = new File([shotBlob], shotName, { type: shotBlob.type });
  try {
    /* Solo el archivo. Instagram ignora el texto, y en algunos Android
       pedir texto junto con archivos hace fallar el menú de compartir. */
    await navigator.share({ files: [file] });
  } catch (e) {
    if (e && e.name === 'AbortError') return;      /* el invitado canceló */
    console.warn('Compartir falló:', e && e.name, e && e.message);
    /* Si el menú no abre, que al menos se lleve la foto: se descarga y el
       aviso dice cómo subirla. El nombre del error va entre paréntesis
       para poder diagnosticar teléfonos que no tenemos a la mano. */
    $('btn-save').click();
    toast(t('sharefail') + ' (' + ((e && e.name) || 'error') + ')');
    $('save-hint').innerHTML = t('savehint');
    $('save-hint').hidden = false;
  }
}

/* ── Navegación entre pantallas ──────────────────────────────── */
function show(name) {
  for (const s of ['intro', 'stage', 'result']) $(s).hidden = (s !== name);
  document.body.classList.toggle('shooting', name === 'stage');
  if (name !== 'result') $('shot-video').pause();
  setBack();
  if (name === 'stage') {
    if (!show.nudged) { show.nudged = true; $('shutter').classList.add('nudge'); }
    fitViewport();
    centerThumb(filterIx, false);
    if (!raf) raf = requestAnimationFrame(loop);
  } else if (raf) { cancelAnimationFrame(raf); raf = 0; }
  window.scrollTo(0, 0);
}

/* ── Conexiones ──────────────────────────────────────────────── */
$('btn-start').onclick = async () => {
  $('intro-error').hidden = true;
  if (!await startCamera()) return;
  show('stage');
  if (FILTERS[filterIx].needs) preload(FILTERS[filterIx].needs);
  if (!detector && arState === 'load') loadDetector();
};

/* ── Obturador: toque = foto, mantener = video ────────────────── */
const shutter = $('shutter');
let holdTimer = 0, held = false;

async function runShot() {
  if (busy) return;
  busy = true; shutter.disabled = true;
  try {
    if (mode === 'strip') { await captureStrip(); }
    else                  { await countdown(3); flash(); await capturePhoto(); }
  } catch (e) {
    console.warn(e); toast(t('shotfail'));
  }
  busy = false; shutter.disabled = false;
}

/* Arrastrar desde el obturador también mueve el carrusel: es justo donde
   cae el pulgar, y antes ese gesto no hacía nada. */
let drag = null;
shutter.addEventListener('pointerdown', e => {
  if (busy) return;
  e.preventDefault();
  held = false;
  drag = { x: e.clientX, left: $('rail').scrollLeft, moved: false };
  /* En modo tira el gesto largo no aplica: siempre son 4 fotos. */
  if (mode === 'strip' || !recMime) return;
  holdTimer = setTimeout(() => { held = true; startRec(); }, HOLD_MS);
});

shutter.addEventListener('pointermove', e => {
  if (!drag || held) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 10) return;
  if (!drag.moved) {
    drag.moved = true;
    clearTimeout(holdTimer);
    /* Con el imán del carrusel activo, cada cambio de posición saltaría
       a una miniatura; se apaga mientras el dedo arrastra. */
    $('rail').style.scrollSnapType = 'none';
  }
  $('rail').scrollLeft = drag.left - dx;
});

async function endHold(e) {
  if (e) e.preventDefault();
  clearTimeout(holdTimer);
  const dr = drag; drag = null;
  if (dr && dr.moved) {
    $('rail').style.scrollSnapType = '';
    centerThumb(closestThumb(), true);
    return;
  }
  if (held) { held = false; busy = true; shutter.disabled = true; await stopRec(); busy = false; shutter.disabled = false; }
  else if (!recorder && e && e.type === 'pointerup') { runShot(); }
}
shutter.addEventListener('pointerup', endHold);
shutter.addEventListener('pointercancel', endHold);
/* Si el dedo se sale del botón, el pointerup ya no llega al elemento:
   sin esto la grabación se quedaría corriendo para siempre. */
shutter.addEventListener('lostpointercapture', endHold);
window.addEventListener('pointerup', () => { if (held || recorder) endHold(); });

/* ── Deslizar sobre la cámara cambia de filtro ────────────────── */
let swipe = null;
$('viewport').addEventListener('pointerdown', e => {
  if (e.target.closest('.glass')) return;
  swipe = { x: e.clientX, y: e.clientY };
});
$('viewport').addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) selectFilter(filterIx + (dx < 0 ? 1 : -1), true);
});
$('viewport').addEventListener('pointercancel', () => { swipe = null; });

document.querySelectorAll('#modes button').forEach(b => {
  b.onclick = () => {
    if (busy) return;
    mode = b.dataset.mode;
    buildModes();
    if (mode === 'strip') toast(t('stripHint'));
  };
});

$('btn-timer').onclick = () => {
  timerOn = !timerOn;
  $('btn-timer').classList.toggle('on', timerOn);
  $('timer-badge').hidden = !timerOn;
};

$('btn-flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  if (!await startCamera()) { facing = facing === 'user' ? 'environment' : 'user'; await startCamera(); }
};

$('btn-share').onclick = share;
$('btn-save').onclick  = () => { if (!IS_IOS) toast(t('saved')); };
$('btn-again').onclick = () => show('stage');

/* Soltar la cámara al esconder o cerrar la página: si no, el LED sigue
   encendido y algunos teléfonos no la prestan de vuelta. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
  else if (!document.hidden && !$('stage').hidden && !raf) raf = requestAnimationFrame(loop);
});
window.addEventListener('pagehide', () => { if (stream) stream.getTracks().forEach(tr => tr.stop()); });

/* Las fuentes deben estar listas antes del primer texto en canvas, o la
   firma y el monograma salen con la tipografía de respaldo. */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { paintThumbs(); fitViewport(); }).catch(() => {});
  /* Press Start 2P solo se usa dentro del canvas, y el navegador no baja
     una fuente que ningún texto de la página pide. */
  document.fonts.load('16px "Press Start 2P"').then(paintThumbs).catch(() => {});
}

recMime = pickMime();
buildRail();
selectFilter(0, false);
setLang(lang);
</script>
</body>
</html>
