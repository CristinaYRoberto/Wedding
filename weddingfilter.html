<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#201e1c">
<title>Filtro AR · Cristina &amp; Roberto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Cinzel:wght@400;500;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --gold: #b89a6a;
    --dark-gold: #8a6f45;
    --sage: #7a8c6e;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* Sin esto, el display de .btn / #countdown gana sobre [hidden]. */
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body {
    font-family:'Lato',sans-serif;
    background:radial-gradient(circle at 50% 0%, #3a3632 0%, #201e1c 60%, #141312 100%);
    color:var(--cream);
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  /* Con la cámara abierta la página no debe hacer scroll: el visor se
     mide para que todo quepa. */
  body.shooting { overflow:hidden; }

  /* ── Cabecera ───────────────────────────────────────────────── */
  header {
    width:100%; max-width:520px;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:12px 16px 4px;
  }
  .back {
    color:var(--gold); text-decoration:none; font-size:0.76rem;
    letter-spacing:0.12em; border:1px solid rgba(184,154,106,0.45);
    padding:7px 12px; border-radius:999px; white-space:nowrap;
  }
  .back:active { background:rgba(184,154,106,0.18); }
  #lang-toggle { display:flex; gap:4px; }
  #lang-toggle button {
    font-family:'Lato',sans-serif; font-size:0.72rem; letter-spacing:0.1em;
    background:none; border:1px solid rgba(184,154,106,0.35);
    color:rgba(245,240,232,0.6); padding:6px 10px; border-radius:999px; cursor:pointer;
  }
  #lang-toggle button.active { background:var(--gold); border-color:var(--gold); color:#1b1a18; font-weight:700; }

  .title { font-family:'Cinzel',serif; font-size:clamp(1.05rem,4.5vw,1.35rem); letter-spacing:0.18em; text-align:center; }
  .subtitle {
    font-family:'Cormorant Garamond',serif; font-style:italic;
    color:rgba(245,240,232,0.65); font-size:clamp(0.9rem,3.8vw,1.05rem);
    text-align:center; margin-top:10px; line-height:1.55;
  }
  .rule { width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:14px auto; }

  /* ── Pantallas ──────────────────────────────────────────────── */
  section { width:100%; max-width:520px; padding:8px 16px 24px; }
  section[hidden] { display:none !important; }

  #intro { text-align:center; padding-top:5vh; }
  .intro-mark { font-family:'Great Vibes',cursive; font-size:clamp(2.2rem,11vw,3.4rem); color:var(--gold); line-height:1.1; }
  .intro-note {
    margin-top:20px; font-size:0.76rem; color:rgba(245,240,232,0.42);
    line-height:1.6; border-top:1px solid rgba(184,154,106,0.2); padding-top:14px;
  }

  .btn {
    display:inline-block; font-family:'Lato',sans-serif; font-size:0.8rem;
    letter-spacing:0.14em; font-weight:700; text-transform:uppercase;
    padding:15px 26px; border-radius:999px; border:1px solid var(--gold);
    cursor:pointer; text-decoration:none; transition:transform .1s ease;
  }
  .btn:active { transform:scale(0.97); }
  .btn-primary { background:var(--gold); color:#1b1a18; }
  .btn-outline { background:transparent; color:var(--gold); }
  .btn-row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:20px; }

  /* ── Visor ──────────────────────────────────────────────────── */
  /* El tamaño lo fija fitViewport() en JS: mide lo que ocupan barra,
     modos, filtros y controles, y le da al visor el hueco exacto. Un
     calc() en CSS fallaba en pantallas cortas y cortaba el obturador. */
  #viewport {
    position:relative; margin-inline:auto;
    border-radius:18px; overflow:hidden; background:#0d0c0b;
    border:1px solid rgba(184,154,106,0.35);
    box-shadow:0 18px 50px rgba(0,0,0,0.55);
  }
  #viewport canvas { display:block; width:100%; height:100%; }
  #cam { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  #countdown {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel',serif; font-size:26vh; color:rgba(250,247,242,0.92);
    text-shadow:0 4px 24px rgba(0,0,0,0.6); pointer-events:none;
  }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s ease; }
  .ar-badge {
    position:absolute; top:10px; left:10px;
    font-size:0.56rem; letter-spacing:0.14em; text-transform:uppercase;
    background:rgba(20,19,18,0.72); border:1px solid rgba(184,154,106,0.4);
    color:var(--gold); padding:4px 9px; border-radius:999px;
  }
  /* Progreso de la tira y del video */
  #rec-bar {
    position:absolute; left:0; bottom:0; height:4px; width:0%;
    background:linear-gradient(90deg,var(--gold),#e6c563);
  }
  #strip-dots {
    position:absolute; top:10px; right:10px; display:flex; gap:5px;
  }
  #strip-dots i { width:8px; height:8px; border-radius:50%; background:rgba(245,240,232,0.3); }
  #strip-dots i.done { background:var(--gold); }

  /* ── Modos ──────────────────────────────────────────────────── */
  .modes {
    display:flex; gap:6px; justify-content:center; margin-top:10px;
    background:rgba(245,240,232,0.06); border:1px solid rgba(184,154,106,0.25);
    border-radius:999px; padding:4px; width:fit-content; margin-inline:auto;
  }
  .modes button {
    font-family:'Lato',sans-serif; font-size:0.66rem; letter-spacing:0.1em;
    text-transform:uppercase; background:none; border:none; cursor:pointer;
    color:rgba(245,240,232,0.7); padding:8px 14px; border-radius:999px;
  }
  .modes button.active { background:var(--gold); color:#1b1a18; font-weight:700; }

  /* ── Filtros ────────────────────────────────────────────────── */
  .filters {
    display:flex; gap:8px; overflow-x:auto; padding:10px 2px 2px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .filters::-webkit-scrollbar { display:none; }
  .filters button {
    flex:0 0 auto; font-family:'Lato',sans-serif; font-size:0.69rem;
    letter-spacing:0.07em; text-transform:uppercase;
    background:rgba(245,240,232,0.07); color:rgba(245,240,232,0.75);
    border:1px solid rgba(184,154,106,0.3); border-radius:999px;
    padding:9px 14px; cursor:pointer; white-space:nowrap;
  }
  .filters button.active { background:var(--gold); border-color:var(--gold); color:#1b1a18; font-weight:700; }

  /* ── Controles ──────────────────────────────────────────────── */
  .controls { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:10px; }
  .icon-btn {
    width:48px; height:48px; border-radius:50%; flex:0 0 auto;
    background:rgba(245,240,232,0.08); border:1px solid rgba(184,154,106,0.35);
    color:var(--cream); font-size:0.8rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.on { background:var(--gold); color:#1b1a18; border-color:var(--gold); font-weight:700; }
  /* touch-action:none — sin esto, mantener presionado en el móvil
     dispara el scroll y el gesto de video nunca llega a empezar. */
  #shutter {
    width:72px; height:72px; border-radius:50%; flex:0 0 auto;
    background:var(--cream); border:4px solid var(--gold); cursor:pointer;
    box-shadow:0 0 0 4px rgba(20,19,18,0.8), 0 10px 30px rgba(0,0,0,0.5);
    touch-action:none; user-select:none; -webkit-user-select:none;
    transition:transform .18s ease, background .18s ease, border-color .18s ease;
  }
  #shutter.rec {
    background:#c0453c; border-color:#e8746a; transform:scale(1.14);
    box-shadow:0 0 0 4px rgba(20,19,18,0.8), 0 0 26px rgba(224,90,80,0.7);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow:0 0 0 4px rgba(20,19,18,0.8), 0 0 40px rgba(224,90,80,0.95); } }
  #shutter:active { transform:scale(0.93); }
  #shutter.rec:active { transform:scale(1.14); }
  #shutter:disabled { opacity:0.4; }

  .shoot-hint {
    text-align:center; margin-top:8px; font-size:0.68rem; letter-spacing:0.06em;
    color:rgba(245,240,232,0.42);
  }

  /* ── Resultado ──────────────────────────────────────────────── */
  #shot, #shot-video {
    display:block; width:100%; max-height:62vh; object-fit:contain;
    border-radius:18px; border:1px solid rgba(184,154,106,0.35);
    box-shadow:0 18px 50px rgba(0,0,0,0.55); background:#0d0c0b;
  }
  .hint { margin-top:14px; font-size:0.78rem; line-height:1.6; color:rgba(245,240,232,0.55); text-align:center; }
  .hashtag { font-family:'Cinzel',serif; letter-spacing:0.1em; color:var(--gold); }

  .alert {
    background:rgba(180,83,75,0.12); border:1px solid rgba(180,83,75,0.5);
    color:#f0c9c5; border-radius:12px; padding:14px 16px;
    font-size:0.82rem; line-height:1.6; margin-top:18px; text-align:left;
  }
  #toast {
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translate(-50%,20px); opacity:0; pointer-events:none;
    background:rgba(20,19,18,0.95); border:1px solid rgba(184,154,106,0.45);
    color:var(--cream); padding:11px 18px; border-radius:999px;
    font-size:0.78rem; transition:opacity .25s ease, transform .25s ease; z-index:50;
    max-width:88vw; text-align:center;
  }
  #toast.show { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html" data-es="← Volver" data-en="← Back">← Volver</a>
  <div id="lang-toggle">
    <button type="button" class="active" onclick="setLang('es')">ES</button>
    <button type="button" onclick="setLang('en')">EN</button>
  </div>
</header>

<!-- ══ INTRO ══════════════════════════════════════════════════ -->
<section id="intro">
  <div class="intro-mark">Cristina &amp; Roberto</div>
  <div class="rule"></div>
  <h1 class="title" data-es="FILTRO DE LA BODA" data-en="WEDDING FILTER">FILTRO DE LA BODA</h1>
  <p class="subtitle"
     data-es="14 filtros animados. Toca para foto, mantén presionado para video, o arma una tira de cuatro. Nada se sube a ningún servidor: todo se queda en tu teléfono."
     data-en="14 animated filters. Tap for a photo, hold for video, or make a strip of four. Nothing is uploaded anywhere — it all stays on your phone.">
  </p>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="btn-start" data-es="ABRIR LA CÁMARA" data-en="OPEN THE CAMERA">ABRIR LA CÁMARA</button>
  </div>
  <p class="intro-note"
     data-es="Tu teléfono pedirá permiso para usar la cámara. El video nunca sale de tu dispositivo."
     data-en="Your phone will ask for camera permission. The video never leaves your device.">
  </p>
  <div class="alert" id="intro-error" hidden></div>
</section>

<!-- ══ CÁMARA ═════════════════════════════════════════════════ -->
<section id="stage" hidden>
  <div id="viewport">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
    <div class="ar-badge" id="ar-badge"></div>
    <div id="strip-dots" hidden><i></i><i></i><i></i><i></i></div>
    <div id="countdown" hidden></div>
    <div id="flash"></div>
    <div id="rec-bar"></div>
  </div>

  <div class="modes" id="modes">
    <button type="button" data-mode="photo" class="active"></button>
    <button type="button" data-mode="strip"></button>
  </div>

  <div class="filters" id="filters"></div>

  <div class="controls">
    <button type="button" class="icon-btn" id="btn-timer">off</button>
    <button type="button" id="shutter" aria-label="Foto"></button>
    <button type="button" class="icon-btn" id="btn-flip">⟲</button>
  </div>
  <p class="shoot-hint" id="shoot-hint"></p>
</section>

<!-- ══ RESULTADO ══════════════════════════════════════════════ -->
<section id="result" hidden>
  <img id="shot" alt="">
  <video id="shot-video" playsinline autoplay muted loop hidden></video>
  <div class="btn-row">
    <button type="button" class="btn btn-primary" id="btn-share" data-es="COMPARTIR" data-en="SHARE">COMPARTIR</button>
    <a class="btn btn-outline" id="btn-save" data-es="GUARDAR" data-en="SAVE">GUARDAR</a>
    <button type="button" class="btn btn-outline" id="btn-again" data-es="OTRA" data-en="RETAKE">OTRA</button>
  </div>
  <p class="hint" id="hint-tag"></p>
  <p class="hint" id="save-hint" hidden></p>
</section>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   FILTRO AR — Cristina & Roberto
   ────────────────────────────────────────────────────────────────
   Piezas del navegador, sin SDK de pago:
     getUserMedia      → cámara
     <canvas>          → el filtro se dibuja sobre el video
     MediaRecorder     → el video corto
     navigator.share   → menú nativo (Instagram, Facebook, WhatsApp).
                         Es el único camino para publicar en Instagram
                         desde la web: no hay API pública de historias.
     MediaPipe FaceDetector (gratis, CDN, corre en el dispositivo)
                       → posición de la cara para corona, lentes, velo.

   Si MediaPipe no carga, los filtros sin cara siguen funcionando.
   ════════════════════════════════════════════════════════════════ */

const NAMES   = 'Cristina & Roberto';
const DATE_ES = '03 · OCTUBRE · 2026';
const DATE_EN = 'OCTOBER 3 · 2026';
const HASHTAG = '#CristinaYRoberto';

/* 9/16: formato de historias. El feed de Instagram lo recorta a 4/5,
   por eso la firma va dentro de la zona segura de abajo. */
const RATIO = 9 / 16;
const CAP_H = 1920;          /* 1080x1920, medida nativa de una historia */
const HOLD_MS  = 280;        /* a partir de aquí el toque cuenta como video */
const MAX_SECS = 20;         /* tope duro de grabación */

const MP_VER   = '0.10.14';
const MP_WASM  = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER + '/wasm';
const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/' +
                 'blaze_face_short_range/float16/1/blaze_face_short_range.tflite';

/* ── Idioma: el mismo que eligieron en index.html ─────────────── */
let lang = 'es';
try { const s = localStorage.getItem('wedding_lang'); if (s === 'es' || s === 'en') lang = s; } catch (_e) {}

const STR = {
  es: {
    arOn:'AR activo', arOff:'Solo marco', arLoad:'Cargando AR…',
    denied:'No diste permiso a la cámara. Ábrelo en los ajustes del navegador (candado junto a la dirección) y vuelve a intentar.',
    nocam:'No encontramos ninguna cámara en este dispositivo.',
    insecure:'La cámara solo funciona en una dirección https://. Abre esta página desde el enlace de la boda.',
    unsupported:'Este navegador no permite usar la cámara. Prueba con Chrome o Safari.',
    saved:'Listo, revisa tus descargas',
    sharefail:'No se pudo abrir el menú de compartir. Usa GUARDAR.',
    tag:'Compártela con <span class="hashtag">' + HASHTAG + '</span> para que podamos verla.',
    savehint:'¿No aparece el menú de compartir? Guarda el archivo y súbelo desde Instagram o Facebook.',
    date:DATE_ES,
    mPhoto:'Foto', mStrip:'Tira',
    stripHint:'Cuatro fotos seguidas. ¡No te quedes quieto!',
    holdHint:'Toca para foto · mantén presionado para video',
    tapHint:'Toca para tomar las 4 fotos',
    recording:'Grabando… suelta para terminar',
    tooShort:'Muy corto. Mantén presionado más tiempo.',
    noVideo:'Este navegador no puede grabar video, pero las fotos sí funcionan.'
  },
  en: {
    arOn:'AR on', arOff:'Frame only', arLoad:'Loading AR…',
    denied:'Camera permission was denied. Allow it in your browser settings (the lock icon next to the address) and try again.',
    nocam:'No camera found on this device.',
    insecure:'The camera only works over https://. Open this page from the wedding link.',
    unsupported:'This browser cannot use the camera. Try Chrome or Safari.',
    saved:'Done — check your downloads',
    sharefail:'Could not open the share sheet. Use SAVE instead.',
    tag:'Share it with <span class="hashtag">' + HASHTAG + '</span> so we can see it.',
    savehint:'No share sheet? Save the file and upload it from Instagram or Facebook.',
    date:DATE_EN,
    mPhoto:'Photo', mStrip:'Strip',
    stripHint:'Four shots in a row. Keep moving!',
    holdHint:'Tap for a photo · hold for video',
    tapHint:'Tap to take all 4 shots',
    recording:'Recording… let go to finish',
    tooShort:'Too short. Hold the button longer.',
    noVideo:'This browser cannot record video, but photos work fine.'
  }
};
const t = k => STR[lang][k];

/* ════════════════════════════════════════════════════════════════
   IMÁGENES DEL JUEGO
   ────────────────────────────────────────────────────────────────
   Los mismos personajes y props de game.html, para que la foto y el
   juego se sientan la misma boda. Se cargan solo cuando el invitado
   elige el filtro que los usa.
   ════════════════════════════════════════════════════════════════ */
const A = {
  /* Los novios, en sus tres animaciones. Cada filtro usa una sola. */
  dancing  : ['assets/characters/novios_dancing01.png', 'assets/characters/novios_dancing02.png',
              'assets/characters/novios_dancing03.png'],
  kiss     : ['assets/characters/novios_kiss01.png', 'assets/characters/novios_kiss02.png'],
  win      : ['assets/characters/novios_win01.png', 'assets/characters/novios_win02.png'],
  rings    : ['assets/props/weddingStuff05.png'],
  champagne: ['assets/props/weddingStuff06.png'],
  cake     : ['assets/props/weddingStuff03.png'],
  heels    : ['assets/props/weddingStuff07.png'],
  bouquet  : ['assets/props/weddingStuff02.png'],
  outfits  : ['assets/props/weddingStuff04.png']
};

const IMG = {};
/* Devuelve la imagen solo si ya está lista; si no, este cuadro se
   dibuja sin ella y el siguiente ya la tendrá. */
function img(src) {
  let i = IMG[src];
  if (!i) { i = IMG[src] = new Image(); i.decoding = 'async'; i.src = src; }
  return (i.complete && i.naturalWidth) ? i : null;
}
function preload(list) {
  return Promise.all(list.map(src => {
    const i = IMG[src] || (IMG[src] = Object.assign(new Image(), { decoding:'async', src }));
    return i.complete ? Promise.resolve() : new Promise(r => { i.onload = i.onerror = r; });
  }));
}
function drawSprite(c, src, x, y, h, rot, alpha) {
  const im = img(src); if (!im) return;
  const w = h * im.naturalWidth / im.naturalHeight;
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.translate(x, y); if (rot) c.rotate(rot);
  c.drawImage(im, -w / 2, -h / 2, w, h);
  c.restore();
}
/* Cuadro de una animación de sprites, según el reloj. */
const anim = (list, fps, tt) => list[Math.floor(tt * fps) % list.length];

/* Azar estable: la misma partícula cae siempre por el mismo sitio, así
   la foto sale idéntica a lo que se veía en pantalla. */
const rnd = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };

/* ════════════════════════════════════════════════════════════════
   EFECTOS REUTILIZABLES
   Todos reciben tt (segundos) y son funciones puras del tiempo.
   ════════════════════════════════════════════════════════════════ */

/* Lluvia o ascenso de sprites. up:true sube (burbujas, corazones). */
function field(c, W, H, tt, srcs, o) {
  o = o || {};
  const n = o.n || 12, speed = o.speed || 0.08, size = o.size || 0.13;
  for (let i = 0; i < n; i++) {
    const life = ((tt * speed * (0.6 + rnd(i, 7) * 0.8)) + rnd(i, 1)) % 1;
    const p = o.up ? 1 - life : life;
    const x = (0.06 + rnd(i, 2) * 0.88) * W + Math.sin(tt * 0.9 + i * 1.7) * W * 0.05;
    const y = p * H * 1.2 - H * 0.1;
    const s = size * (0.65 + rnd(i, 3) * 0.7) * W;
    drawSprite(c, srcs[i % srcs.length], x, y, s,
               Math.sin(tt * (o.spin || 0.7) + i) * (o.tilt || 0.3),
               o.alpha === undefined ? 0.95 : o.alpha);
  }
}

/* Pétalos y confeti dibujados a mano: más ligeros que un PNG. */
function flakes(c, W, H, tt, o) {
  const n = o.n || 26;
  for (let i = 0; i < n; i++) {
    const life = ((tt * (o.speed || 0.09) * (0.6 + rnd(i, 5) * 0.9)) + rnd(i, 1)) % 1;
    const x = (0.03 + rnd(i, 2) * 0.94) * W + Math.sin(tt * 1.4 + i) * W * 0.05;
    const y = life * H * 1.2 - H * 0.1;
    const r = (o.size || 0.022) * (0.6 + rnd(i, 3) * 0.9) * W;
    c.save();
    c.translate(x, y);
    c.rotate(tt * (1 + rnd(i, 4) * 2) + i);
    c.fillStyle = o.colors[i % o.colors.length];
    if (o.rect) c.fillRect(-r * 0.5, -r * 0.22, r, r * 0.44);
    else { c.beginPath(); c.ellipse(0, 0, r, r * 0.55, 0, 0, Math.PI * 2); c.fill(); }
    c.restore();
  }
}

/* Destellos de cuatro puntas. */
function sparkles(c, W, H, tt, n, tint) {
  for (let i = 0; i < (n || 14); i++) {
    const life = ((tt * 0.5 + rnd(i, 9)) % 1);
    const a = Math.sin(life * Math.PI);
    if (a <= 0.02) continue;
    const x = rnd(i, 11) * W, y = rnd(i, 13) * H;
    const r = (0.012 + rnd(i, 17) * 0.02) * W * (0.5 + a);
    c.save(); c.translate(x, y); c.rotate(tt * 0.6 + i);
    c.globalAlpha = a * 0.9; c.fillStyle = tint || '#f3e3b0';
    c.beginPath();
    c.moveTo(0, -r); c.quadraticCurveTo(0, 0, r, 0);
    c.quadraticCurveTo(0, 0, 0, r); c.quadraticCurveTo(0, 0, -r, 0);
    c.quadraticCurveTo(0, 0, 0, -r);
    c.fill(); c.restore();
  }
}

/* Luces desenfocadas de fiesta. */
function bokeh(c, W, H, tt) {
  for (let i = 0; i < 16; i++) {
    const x = (rnd(i, 21) + Math.sin(tt * 0.15 + i) * 0.06) * W;
    const y = (rnd(i, 23) + Math.cos(tt * 0.12 + i * 1.3) * 0.06) * H;
    const r = (0.03 + rnd(i, 27) * 0.07) * W;
    const a = 0.10 + 0.10 * (0.5 + 0.5 * Math.sin(tt * 0.8 + i));
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(246,225,160,' + a + ')');
    g.addColorStop(1, 'rgba(246,225,160,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  }
}

/* ── Marcos ──────────────────────────────────────────────────── */
function goldFrame(c, W, H) {
  const m = W * 0.035;
  c.strokeStyle = 'rgba(184,154,106,0.95)'; c.lineWidth = Math.max(2, W * 0.006);
  c.strokeRect(m, m, W - m * 2, H - m * 2);
  c.strokeStyle = 'rgba(184,154,106,0.5)'; c.lineWidth = Math.max(1, W * 0.002);
  const n = m + W * 0.016;
  c.strokeRect(n, n, W - n * 2, H - n * 2);
}

function thinFrame(c, W, H) {
  const m = W * 0.03;
  c.strokeStyle = 'rgba(245,240,232,0.75)'; c.lineWidth = Math.max(1, W * 0.003);
  c.strokeRect(m, m, W - m * 2, H - m * 2);
}

function vignette(c, W, H) {
  const g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(30,22,14,0.55)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

/* Canvas no tiene letter-spacing: se simula con espacios. */
const spread = s => s.split('').join(' ');

/* SAFE = franja que Instagram tapa con la barra de "enviar mensaje"
   cuando la foto se sube como historia. El texto se levanta por
   encima; el degradado sí baja hasta el borde. */
function signature(c, W, H) {
  const pad  = W * 0.075;
  const safe = H * 0.115;
  const top  = H - pad * 3.4 - safe;
  const g = c.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, 'rgba(20,19,18,0)');
  g.addColorStop(0.75, 'rgba(20,19,18,0.7)');
  g.addColorStop(1, 'rgba(20,19,18,0.78)');
  c.fillStyle = g; c.fillRect(0, top, W, H - top);

  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#f5f0e8';
  c.font = '400 ' + (W * 0.115) + 'px "Great Vibes", cursive';
  c.fillText(NAMES, W / 2, H - safe - pad * 1.62);

  c.fillStyle = 'rgba(184,154,106,0.95)';
  c.font = '600 ' + (W * 0.036) + 'px Cinzel, serif';
  c.fillText(spread(t('date')), W / 2, H - safe - pad * 0.92);

  c.fillStyle = 'rgba(245,240,232,0.62)';
  c.font = '400 ' + (W * 0.031) + 'px Lato, sans-serif';
  c.fillText(HASHTAG, W / 2, H - safe - pad * 0.3);
}

/* Listón de arriba. Va por debajo de la franja donde la historia pone
   el avatar y el nombre de quien publica. */
function ribbon(c, W, H, txt, tt) {
  const y = H * 0.145, h = W * 0.085;
  const wob = tt === undefined ? 0 : Math.sin(tt * 1.6) * 0.012;
  c.save();
  c.translate(W / 2, y + h / 2); c.rotate(wob); c.translate(-W / 2, -(y + h / 2));
  c.fillStyle = 'rgba(184,154,106,0.94)';
  c.fillRect(W * 0.12, y, W * 0.76, h);
  c.fillStyle = '#1b1a18'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '700 ' + (W * 0.042) + 'px Cinzel, serif';
  c.fillText(spread(txt), W / 2, y + h / 2);
  c.restore();
}

/* ── Adornos sobre la cara ───────────────────────────────────────
   f = { x, y, d, a }: centro entre los ojos, distancia entre ojos,
   inclinación. Todo se mide en múltiplos de d para que el adorno
   crezca con la cara. */
function faceSpace(c, f, fn, tt) {
  c.save(); c.translate(f.x, f.y); c.rotate(f.a);
  fn(c, f.d, tt);
  c.restore();
}

function petal5(c, x, y, r, fill) {
  c.save(); c.translate(x, y);
  for (let i = 0; i < 5; i++) {
    c.rotate(Math.PI * 2 / 5);
    c.beginPath();
    c.ellipse(0, -r * 0.62, r * 0.42, r * 0.66, 0, 0, Math.PI * 2);
    c.fillStyle = fill; c.fill();
  }
  c.beginPath(); c.arc(0, 0, r * 0.3, 0, Math.PI * 2);
  c.fillStyle = '#e6c563'; c.fill();
  c.restore();
}

function flowerCrown(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    for (let k = 0; k <= 16; k++) {
      const u = -1 + (k / 16) * 2;
      const x = u * d * 1.85;
      const y = -d * 1.18 - (1 - u * u) * d * 0.5;
      c.save(); c.translate(x, y); c.rotate(u * 1.1 + Math.sin(tt * 1.5 + k) * 0.05);
      c.beginPath(); c.ellipse(0, d * 0.18, d * 0.12, d * 0.3, 0, 0, Math.PI * 2);
      c.fillStyle = 'rgba(122,140,110,0.95)'; c.fill();
      c.restore();
    }
    const tints = ['#fdf6f2', '#f7dfe4', '#fbeccd', '#f3d3d8'];
    for (let k = 0; k <= 10; k++) {
      const u = -1 + (k / 10) * 2;
      const x = u * d * 1.78;
      const y = -d * 1.22 - (1 - u * u) * d * 0.52;
      /* Respiración: cada flor late con un desfase distinto. */
      const beat = 1 + Math.sin(tt * 2 + k * 0.8) * 0.06;
      petal5(c, x, y, d * (0.24 + (1 - Math.abs(u)) * 0.12) * beat, tints[k % tints.length]);
    }
  }, tt);
}

function heartPath(c, r) {
  c.beginPath();
  c.moveTo(0, r * 0.72);
  c.bezierCurveTo(-r * 1.35, -r * 0.25, -r * 0.5, -r * 1.15, 0, -r * 0.42);
  c.bezierCurveTo(r * 0.5, -r * 1.15, r * 1.35, -r * 0.25, 0, r * 0.72);
  c.closePath();
}

function heartGlasses(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    const beat = 1 + Math.sin(tt * 4) * 0.07;
    const r = d * 0.52 * beat;
    c.strokeStyle = '#b89a6a'; c.lineWidth = d * 0.09;
    c.beginPath(); c.moveTo(-d * 0.18, -d * 0.05); c.lineTo(d * 0.18, -d * 0.05); c.stroke();
    c.beginPath(); c.moveTo(-d * 1.02, -d * 0.12); c.lineTo(-d * 1.5, -d * 0.3); c.stroke();
    c.beginPath(); c.moveTo(d * 1.02, -d * 0.12);  c.lineTo(d * 1.5, -d * 0.3);  c.stroke();
    for (const sx of [-1, 1]) {
      c.save(); c.translate(sx * d * 0.52, 0);
      heartPath(c, r);
      c.fillStyle = 'rgba(180,83,75,0.42)'; c.fill();
      c.lineWidth = d * 0.08; c.strokeStyle = '#b89a6a'; c.stroke();
      c.restore();
    }
  }, tt);
}

function veil(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    const sway = Math.sin(tt * 1.2) * d * 0.18;
    c.fillStyle = 'rgba(250,247,242,0.3)';
    c.beginPath();
    c.moveTo(-d * 1.5, -d * 1.25);
    c.bezierCurveTo(-d * 3.1 + sway, d * 0.6, -d * 2.6 + sway, d * 3.4, -d * 1.7 + sway, d * 3.6);
    c.lineTo(d * 1.7 + sway, d * 3.6);
    c.bezierCurveTo(d * 2.6 + sway, d * 3.4, d * 3.1 + sway, d * 0.6, d * 1.5, -d * 1.25);
    c.closePath(); c.fill();
    c.strokeStyle = 'rgba(230,197,99,0.95)'; c.lineWidth = d * 0.11;
    c.beginPath(); c.ellipse(0, -d * 1.28, d * 1.45, d * 0.62, 0, Math.PI, 0); c.stroke();
    for (let k = -1; k <= 1; k++) petal5(c, k * d * 0.78, -d * 1.72, d * 0.2, '#fdf6f2');
  }, tt);
}

function topHat(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    c.rotate(Math.sin(tt * 1.1) * 0.03);
    c.fillStyle = '#24221f';
    c.fillRect(-d * 2.1, -d * 1.58, d * 4.2, d * 0.2);
    c.fillRect(-d * 1.18, -d * 3.1, d * 2.36, d * 1.55);
    c.fillStyle = '#b89a6a';
    c.fillRect(-d * 1.18, -d * 1.94, d * 2.36, d * 0.3);
  }, tt);
}

/* Aureola de anillos girando sobre la cabeza. */
function ringHalo(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    const im = img(A.rings[0]); if (!im) return;
    const s = d * 1.5, w = s * im.naturalWidth / im.naturalHeight;
    c.save();
    c.translate(0, -d * 2.1);
    c.rotate(Math.sin(tt * 1.3) * 0.25);
    c.scale(Math.cos(tt * 1.1) * 0.35 + 0.65, 1);   /* giro fingido en 3D */
    c.drawImage(im, -w / 2, -s / 2, w, s);
    c.restore();
  }, tt);
}

/* Corazoncitos que salen de la cara. */
function loveBurst(c, f, i, tt) {
  faceSpace(c, f, (c, d) => {
    for (let k = 0; k < 7; k++) {
      const life = ((tt * 0.45) + rnd(k + i * 9, 3)) % 1;
      const x = (rnd(k + i * 9, 4) - 0.5) * d * 4;
      const y = -life * d * 4.2 + d * 1.2;
      c.save(); c.globalAlpha = Math.sin(life * Math.PI) * 0.9;
      c.translate(x + Math.sin(tt * 2 + k) * d * 0.25, y);
      c.rotate(Math.sin(tt + k) * 0.3);
      heartPath(c, d * (0.16 + rnd(k, 5) * 0.16));
      c.fillStyle = '#e0798c'; c.fill();
      c.restore();
    }
  }, tt);
}

/* ════════════════════════════════════════════════════════════════
   CATÁLOGO DE FILTROS
   ────────────────────────────────────────────────────────────────
   Para quitar uno, borra su bloque. Para reordenar el carrusel, mueve
   el bloque. Cada filtro puede traer:
     face  → adorno sobre cada cara detectada (va espejeado con el
             video, para que caiga donde la persona se ve)
     scene → capa sobre el video, sin espejo (sprites, partículas)
     frame → marco y texto, siempre lo último
     needs → imágenes que hay que tener listas antes de disparar
   ════════════════════════════════════════════════════════════════ */
const FILTERS = [
  {
    label:{ es:'Clásico', en:'Classic' },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Corona de flores', en:'Flower crown' },
    face: flowerCrown,
    scene:(c, W, H, tt) => sparkles(c, W, H, tt, 10, '#fdf1e0'),
    frame:(c, W, H) => { vignette(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Lentes de corazón', en:'Heart glasses' },
    face: heartGlasses,
    scene:(c, W, H, tt) => flakes(c, W, H, tt, { n:16, speed:0.07, size:0.02, colors:['#e0798c','#f3b8c4','#f7dfe4'] }),
    frame:(c, W, H, tt) => { goldFrame(c, W, H); ribbon(c, W, H, lang === 'es' ? 'RECIÉN CASADOS' : 'JUST MARRIED', tt); signature(c, W, H); }
  },
  {
    label:{ es:'Velo y sombrero', en:'Veil & hat' },
    /* Alterna por cara: la primera lleva velo, la segunda sombrero.
       Con dos personas en el cuadro sale la pareja. */
    face:(c, f, i, tt) => (i % 2 === 0 ? veil(c, f, i, tt) : topHat(c, f, i, tt)),
    frame:(c, W, H, tt) => { goldFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Te amo', en:'In love' },
    face: loveBurst,
    scene:(c, W, H, tt) => bokeh(c, W, H, tt),
    frame:(c, W, H) => { vignette(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Pétalos', en:'Petals' },
    scene:(c, W, H, tt) => flakes(c, W, H, tt, { n:30, colors:['rgba(250,240,238,0.9)','rgba(247,223,228,0.85)','rgba(251,236,205,0.8)'] }),
    frame:(c, W, H) => { thinFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Confeti', en:'Confetti' },
    scene:(c, W, H, tt) => {
      flakes(c, W, H, tt, { n:40, speed:0.16, size:0.026, rect:true,
        colors:['#b89a6a','#e6c563','#f5f0e8','#7a8c6e','#e0798c'] });
      sparkles(c, W, H, tt, 8);
    },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); ribbon(c, W, H, lang === 'es' ? 'QUE VIVA EL AMOR' : 'LET US CELEBRATE', tt); signature(c, W, H); }
  },
  {
    label:{ es:'Luces de fiesta', en:'Party lights' },
    scene:(c, W, H, tt) => { bokeh(c, W, H, tt); sparkles(c, W, H, tt, 12); },
    frame:(c, W, H) => { vignette(c, W, H); signature(c, W, H); }
  },

  /* ── Con piezas del juego ─────────────────────────────────── */
  {
    label:{ es:'Anillos', en:'Rings' },
    needs: A.rings,
    face: ringHalo,
    scene:(c, W, H, tt) => { field(c, W, H, tt, A.rings, { n:6, speed:0.05, size:0.16, alpha:0.85 }); sparkles(c, W, H, tt, 12); },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'Brindis', en:'Cheers' },
    needs: A.champagne,
    scene:(c, W, H, tt) => {
      field(c, W, H, tt, A.champagne, { n:5, speed:0.05, size:0.2, alpha:0.9 });
      /* Burbujas subiendo, dibujadas a mano. */
      for (let i = 0; i < 30; i++) {
        const life = ((tt * 0.22 + rnd(i, 1)) % 1);
        const x = (0.05 + rnd(i, 2) * 0.9) * W + Math.sin(tt * 2 + i) * W * 0.015;
        const y = H - life * H * 1.1;
        const r = (0.004 + rnd(i, 3) * 0.009) * W;
        c.globalAlpha = 0.5 * Math.sin(life * Math.PI);
        c.fillStyle = '#fdf6e4';
        c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
    },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); ribbon(c, W, H, lang === 'es' ? 'SALUD' : 'CHEERS', tt); signature(c, W, H); }
  },
  {
    label:{ es:'Pastel y fiesta', en:'Cake & party' },
    needs: [].concat(A.cake, A.heels, A.bouquet, A.outfits),
    scene:(c, W, H, tt) => {
      field(c, W, H, tt, [].concat(A.cake, A.heels, A.bouquet, A.outfits),
            { n:8, speed:0.045, size:0.19, alpha:0.92, up:true });
      sparkles(c, W, H, tt, 8);
    },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); signature(c, W, H); }
  },

  /* ── Los novios ────────────────────────────────────────────
     Uno solo por filtro, cada uno con su animación del juego. */
  {
    label:{ es:'Los novios bailan', en:'The couple dances' },
    needs: A.dancing,
    scene:(c, W, H, tt) => {
      const bob = Math.sin(tt * 6) * H * 0.01;
      drawSprite(c, anim(A.dancing, 6, tt), W * 0.74, H * 0.645 + bob, W * 0.4, Math.sin(tt * 3) * 0.06);
      flakes(c, W, H, tt, { n:14, speed:0.1, size:0.018, colors:['#e6c563','#f5f0e8','#e0798c'] });
    },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); ribbon(c, W, H, lang === 'es' ? 'NOS CASAMOS' : 'WE ARE MARRIED', tt); signature(c, W, H); }
  },
  {
    label:{ es:'El beso', en:'The kiss' },
    needs: A.kiss,
    scene:(c, W, H, tt) => {
      const bob = Math.sin(tt * 2.2) * H * 0.008;
      drawSprite(c, anim(A.kiss, 1.4, tt), W * 0.74, H * 0.65 + bob, W * 0.38, Math.sin(tt * 1.6) * 0.04);
      /* Corazones subiendo desde los novios. */
      for (let i = 0; i < 9; i++) {
        const life = ((tt * 0.3 + rnd(i, 1)) % 1);
        c.save();
        c.globalAlpha = Math.sin(life * Math.PI) * 0.85;
        c.translate(W * 0.74 + (rnd(i, 2) - 0.5) * W * 0.3, H * 0.6 - life * H * 0.3);
        c.rotate(Math.sin(tt * 2 + i) * 0.3);
        heartPath(c, W * (0.02 + rnd(i, 3) * 0.022));
        c.fillStyle = '#e0798c'; c.fill();
        c.restore();
      }
    },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); signature(c, W, H); }
  },
  {
    label:{ es:'¡Viva los novios!', en:'Hooray!' },
    needs: A.win,
    scene:(c, W, H, tt) => {
      const jump = Math.abs(Math.sin(tt * 3.2)) * H * 0.03;
      drawSprite(c, anim(A.win, 4, tt), W * 0.74, H * 0.655 - jump, W * 0.4, Math.sin(tt * 4) * 0.07);
      flakes(c, W, H, tt, { n:34, speed:0.16, size:0.026, rect:true,
        colors:['#b89a6a','#e6c563','#f5f0e8','#7a8c6e','#e0798c'] });
    },
    frame:(c, W, H, tt) => { goldFrame(c, W, H); ribbon(c, W, H, lang === 'es' ? '¡VIVA LOS NOVIOS!' : 'HOORAY!', tt); signature(c, W, H); }
  }
];
let filterIx = 0;

/* ════════════════════════════════════════════════════════════════
   CÁMARA Y DIBUJADO
   ════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const video = $('cam'), viewCv = $('view');
const vctx = viewCv.getContext('2d');

let stream = null, facing = 'user', raf = 0;
let detector = null, arState = 'load';   /* load | on | off */
let faces = [], smooth = [], lastTs = -1;
let mode = 'photo';                      /* photo | strip | video */
let shotBlob = null, shotUrl = null, shotName = 'CristinaYRoberto.jpg';
let timerOn = false, busy = false;
let recorder = null, recMime = '';

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}
function updateBadge() {
  $('ar-badge').textContent =
    arState === 'load' ? t('arLoad') : arState === 'on' ? t('arOn') : t('arOff');
}

function buildFilterBar() {
  const bar = $('filters'); bar.innerHTML = '';
  FILTERS.forEach((f, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = f.label[lang];
    b.className = i === filterIx ? 'active' : '';
    b.onclick = () => {
      filterIx = i;
      buildFilterBar();
      /* El chip elegido se centra solo: con 17 filtros el carrusel es
         más largo que la pantalla. */
      bar.children[i].scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
      if (FILTERS[i].needs) preload(FILTERS[i].needs);
    };
    bar.appendChild(b);
  });
}

function buildModes() {
  document.querySelectorAll('#modes button').forEach(b => {
    const m = b.dataset.mode;
    b.textContent = t(m === 'photo' ? 'mPhoto' : 'mStrip');
    b.classList.toggle('active', m === mode);
  });
  $('shoot-hint').textContent =
    mode === 'strip' ? t('tapHint') : recMime ? t('holdHint') : '';
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('wedding_lang', l); } catch (_e) {}
  document.documentElement.lang = l;
  document.querySelectorAll('#lang-toggle button').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && l === 'es') || (i === 1 && l === 'en'));
  });
  document.querySelectorAll('[data-es]').forEach(el => {
    const txt = el.getAttribute('data-' + l);
    if (txt) el.innerHTML = txt;
  });
  $('hint-tag').innerHTML  = t('tag');
  $('save-hint').innerHTML = t('savehint');
  buildFilterBar(); buildModes(); updateBadge(); fitViewport();
}

/* ── El visor recibe el hueco que sobra, medido de verdad ─────── */
function fitViewport() {
  const st = $('stage'); if (st.hidden) return;
  const vp = $('viewport');
  const chrome = document.querySelector('header').offsetHeight
               + $('modes').offsetHeight
               + $('filters').offsetHeight
               + document.querySelector('.controls').offsetHeight
               + $('shoot-hint').offsetHeight
               + 46;                       /* márgenes y respiro inferior */
  let h = Math.max(220, window.innerHeight - chrome);
  const maxW = st.clientWidth - 32;
  let w = h * RATIO;
  if (w > maxW) { w = maxW; h = w / RATIO; }
  vp.style.width  = Math.round(w) + 'px';
  vp.style.height = Math.round(h) + 'px';
}
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', () => setTimeout(fitViewport, 250));

/* ── Arranque de la cámara ───────────────────────────────────── */
async function startCamera() {
  if (!window.isSecureContext) { introError(t('insecure')); return false; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { introError(t('unsupported')); return false; }

  if (stream) stream.getTracks().forEach(tr => tr.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1920 } }
    });
  } catch (e) {
    introError(e.name === 'NotAllowedError' || e.name === 'SecurityError' ? t('denied')
             : e.name === 'NotFoundError' || e.name === 'OverconstrainedError' ? t('nocam')
             : t('unsupported'));
    return false;
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  lastTs = -1; smooth = [];
  return true;
}
function introError(msg) { const el = $('intro-error'); el.textContent = msg; el.hidden = false; }

/* ── MediaPipe: se carga aparte, nunca bloquea la cámara ─────── */
async function loadDetector() {
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER);
    const files  = await vision.FilesetResolver.forVisionTasks(MP_WASM);
    detector = await vision.FaceDetector.createFromOptions(files, {
      baseOptions: { modelAssetPath: MP_MODEL, delegate: 'GPU' },
      runningMode: 'VIDEO',
      minDetectionConfidence: 0.45
    });
    arState = 'on';
  } catch (e) {
    console.warn('AR no disponible:', e && e.message);
    arState = 'off';
  }
  updateBadge();
}

/* Encaje "cover" del video dentro del lienzo destino. */
function coverFit(vw, vh, W, H) {
  const s = Math.max(W / vw, H / vh);
  return { s, dx: (W - vw * s) / 2, dy: (H - vh * s) / 2 };
}

/* Una detección → punto de referencia en píxeles del lienzo destino.
   keypoints: 0 y 1 ojos, 2 nariz, 3 boca, 4 y 5 orejas. */
function toFace(det, vw, vh, fit) {
  const k = det.keypoints;
  if (!k || k.length < 2) return null;
  const p = i => ({ x: fit.dx + k[i].x * vw * fit.s, y: fit.dy + k[i].y * vh * fit.s });
  const a = p(0), b = p(1);
  return {
    x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
    d: Math.hypot(b.x - a.x, b.y - a.y) || 1,
    a: Math.atan2(b.y - a.y, b.x - a.x)
  };
}

/* La detección tiembla cuadro a cuadro; un promedio exponencial basta
   para que el adorno no vibre. */
function smoothFaces(list) {
  const out = [];
  for (let i = 0; i < list.length; i++) {
    const n = list[i], o = smooth[i];
    if (!o) { out.push(Object.assign({}, n)); continue; }
    const L = (a, b) => a + (b - a) * 0.4;
    /* El ángulo se interpola por seno y coseno: así -179° y 179° no se
       promedian en 0°. */
    const ang = Math.atan2(L(Math.sin(o.a), Math.sin(n.a)), L(Math.cos(o.a), Math.cos(n.a)));
    out.push({ x: L(o.x, n.x), y: L(o.y, n.y), d: L(o.d, n.d), a: ang });
  }
  smooth = out;
  return out;
}

/* ── El dibujado: una sola función para pantalla, foto y video ──
   mirror = true con la cámara frontal, para que la imagen coincida
   con lo que la persona ve. El texto del marco NO se voltea porque
   se dibuja fuera del espejo. */
function render(c, W, H, facesPx, tt, mirror, bare) {
  const F = FILTERS[filterIx];
  c.clearRect(0, 0, W, H);
  const vw = video.videoWidth, vh = video.videoHeight;

  if (vw && vh) {
    const fit = coverFit(vw, vh, W, H);
    c.save();
    if (mirror) { c.translate(W, 0); c.scale(-1, 1); }
    c.drawImage(video, fit.dx, fit.dy, vw * fit.s, vh * fit.s);
    if (F.face) facesPx.forEach((fc, i) => F.face(c, fc, i, tt));
    c.restore();
  }
  if (F.scene) F.scene(c, W, H, tt);
  /* bare = las tomas de la tira: llevan los efectos del filtro pero no
     el marco ni la firma, porque la tira pone los suyos una sola vez
     alrededor de las cuatro. */
  if (bare)         thinFrame(c, W, H);
  else if (F.frame) F.frame(c, W, H, tt);
}

function loop(time) {
  raf = requestAnimationFrame(loop);
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;

  const cssW = viewCv.clientWidth;
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.round(cssW * dpr), H = Math.round(cssW / RATIO * dpr);
  if (viewCv.width !== W || viewCv.height !== H) { viewCv.width = W; viewCv.height = H; }

  if (detector && FILTERS[filterIx].face && video.currentTime !== lastTs) {
    lastTs = video.currentTime;
    try {
      const res = detector.detectForVideo(video, time);
      const fit = coverFit(vw, vh, W, H);
      const raw = (res.detections || []).map(d => toFace(d, vw, vh, fit)).filter(Boolean);
      if (raw.length !== smooth.length) smooth = [];
      faces = smoothFaces(raw);
    } catch (_e) { /* un cuadro perdido no importa */ }
  } else if (!FILTERS[filterIx].face) {
    faces = [];
  }

  render(vctx, W, H, faces, time / 1000, facing === 'user');
}

/* ── Captura de una foto a resolución de historia ─────────────── */
function drawShot(W, H, bare) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  /* Las caras se midieron para el lienzo de pantalla: se reescalan al
     del archivo, que es más grande. */
  const k = W / (viewCv.width || W);
  const scaled = faces.map(f => ({ x: f.x * k, y: f.y * k, d: f.d * k, a: f.a }));
  render(cv.getContext('2d'), W, H, scaled, performance.now() / 1000, facing === 'user', bare);
  return cv;
}

async function capturePhoto() {
  const F = FILTERS[filterIx];
  if (F.needs) await preload(F.needs);
  const H = CAP_H, W = Math.round(CAP_H * RATIO);
  const blob = await new Promise(r => drawShot(W, H).toBlob(r, 'image/jpeg', 0.92));
  showResult(blob, 'CristinaYRoberto.jpg');
}

/* ── Tira de 4 fotos, 2x2, como las de las cabinas de boda ────── */
async function captureStrip() {
  const F = FILTERS[filterIx];
  if (F.needs) await preload(F.needs);
  const dots = $('strip-dots');
  dots.hidden = false;
  [...dots.children].forEach(d => d.classList.remove('done'));

  const shots = [];
  for (let n = 0; n < 4; n++) {
    await countdown(n === 0 ? 3 : 2);
    flash();
    shots.push(drawShot(540, 960, true));     /* miniatura sin marco ni firma */
    dots.children[n].classList.add('done');
    await wait(450);
  }
  dots.hidden = true;

  const W = Math.round(CAP_H * RATIO), H = CAP_H;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#17150f'; c.fillRect(0, 0, W, H);

  const pad = W * 0.045, gap = W * 0.03;
  const top = H * 0.115, bottom = H * 0.275;   /* deja libre la firma */
  const cellW = (W - pad * 2 - gap) / 2;
  const cellH = (H - top - bottom - gap) / 2;

  shots.forEach((s, i) => {
    const x = pad + (i % 2) * (cellW + gap);
    const y = top + Math.floor(i / 2) * (cellH + gap);
    /* Recorte "cover" del centro de cada toma. */
    const sc = Math.max(cellW / s.width, cellH / s.height);
    const sw = cellW / sc, sh = cellH / sc;
    c.save();
    c.beginPath(); c.rect(x, y, cellW, cellH); c.clip();
    c.drawImage(s, (s.width - sw) / 2, (s.height - sh) / 2, sw, sh, x, y, cellW, cellH);
    c.restore();
    c.strokeStyle = 'rgba(184,154,106,0.6)'; c.lineWidth = W * 0.004;
    c.strokeRect(x, y, cellW, cellH);
  });

  c.textAlign = 'center';
  c.fillStyle = 'rgba(184,154,106,0.95)';
  c.font = '600 ' + (W * 0.04) + 'px Cinzel, serif';
  c.fillText(spread(lang === 'es' ? 'LA BODA' : 'THE WEDDING'), W / 2, top * 0.62);
  signature(c, W, H);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
  showResult(blob, 'CristinaYRoberto-tira.jpg');
}

/* ── Video corto ─────────────────────────────────────────────── */
/* Solo MP4: es lo que aceptan Instagram, Facebook y WhatsApp. Si el
   navegador únicamente ofrece WebM, escondemos el modo antes que dar
   un archivo que la app va a rechazar. */
function pickMime() {
  if (!window.MediaRecorder) return '';
  for (const m of ['video/mp4;codecs=avc1.42E01E', 'video/mp4']) {
    if (MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

/* Grabación por gesto: empieza cuando el dedo lleva HOLD_MS sobre el
   obturador y termina al soltar, como Snapchat. El corte duro a
   MAX_SECS existe para que un dedo olvidado no llene la memoria del
   teléfono con un video de diez minutos. */
let recStream = null, recChunks = [], recStart = 0, recStopTimer = 0, recBarTimer = 0;

async function startRec() {
  const F = FILTERS[filterIx];
  if (F.needs) preload(F.needs);
  recChunks = [];
  recStream = viewCv.captureStream(30);
  recorder = new MediaRecorder(recStream, { mimeType: recMime, videoBitsPerSecond: 6000000 });
  recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  recorder.start();
  recStart = performance.now();

  $('shutter').classList.add('rec');
  /* Chrome la bloquea si aún no hubo un toque real; no es un problema. */
  try { if (navigator.vibrate) navigator.vibrate(18); } catch (_e) {}
  toast(t('recording'));

  /* La barra va con setInterval y no con rAF: si el invitado tapa la
     pantalla o llega una notificación, rAF se pausa y la barra se
     quedaría congelada mientras la grabación sigue corriendo. */
  const bar = $('rec-bar');
  recBarTimer = setInterval(() => {
    bar.style.width = Math.min(100, (performance.now() - recStart) / (MAX_SECS * 1000) * 100) + '%';
  }, 100);
  recStopTimer = setTimeout(stopRec, MAX_SECS * 1000);
}

async function stopRec() {
  if (!recorder || recorder.state !== 'recording') return;
  clearTimeout(recStopTimer); clearInterval(recBarTimer);
  const secs = (performance.now() - recStart) / 1000;
  const done = new Promise(r => { recorder.onstop = r; });
  recorder.stop();
  await done;

  $('rec-bar').style.width = '0%';
  $('shutter').classList.remove('rec');
  recStream.getTracks().forEach(tr => tr.stop());
  recorder = null; recStream = null;

  /* Un video de medio segundo no sirve para nada y algunos navegadores
     ni siquiera cierran bien el contenedor. */
  if (secs < 0.8 || !recChunks.length) { toast(t('tooShort')); return; }
  showResult(new Blob(recChunks, { type: recMime }), 'CristinaYRoberto.mp4');
}

/* ── Cuenta regresiva, destello, esperas ─────────────────────── */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function countdown(from) {
  if (!timerOn && from === 3 && mode === 'photo') return;
  const cd = $('countdown'); cd.hidden = false;
  for (let n = from; n > 0; n--) { cd.textContent = n; await wait(850); }
  cd.hidden = true;
}
function flash() {
  const fl = $('flash');
  fl.style.transition = 'none'; fl.style.opacity = '0.9';
  requestAnimationFrame(() => { fl.style.transition = 'opacity .35s ease'; fl.style.opacity = '0'; });
}

/* ── Resultado ───────────────────────────────────────────────── */
function showResult(blob, name) {
  if (!blob || !blob.size) { toast(t('sharefail')); return; }
  if (shotUrl) URL.revokeObjectURL(shotUrl);
  shotBlob = blob; shotName = name; shotUrl = URL.createObjectURL(blob);

  const isVideo = blob.type.indexOf('video') === 0;
  $('shot').hidden = isVideo;
  $('shot-video').hidden = !isVideo;
  if (isVideo) { $('shot-video').src = shotUrl; $('shot-video').play().catch(() => {}); }
  else         { $('shot').src = shotUrl; }

  $('btn-save').href = shotUrl;
  $('btn-save').setAttribute('download', name);

  const file = new File([blob], name, { type: blob.type });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  $('btn-share').hidden = !canShare;
  $('save-hint').hidden = canShare;

  show('result');
}

async function share() {
  if (!shotBlob) return;
  const file = new File([shotBlob], shotName, { type: shotBlob.type });
  try {
    await navigator.share({ files: [file], text: NAMES + ' · ' + HASHTAG });
  } catch (e) {
    if (e && e.name === 'AbortError') return;      /* el invitado canceló */
    toast(t('sharefail'));
    $('save-hint').hidden = false;
  }
}

/* ── Navegación entre pantallas ──────────────────────────────── */
function show(name) {
  for (const s of ['intro', 'stage', 'result']) $(s).hidden = (s !== name);
  document.body.classList.toggle('shooting', name === 'stage');
  if (name === 'stage') {
    fitViewport();
    if (!raf) raf = requestAnimationFrame(loop);
  } else if (raf) { cancelAnimationFrame(raf); raf = 0; }
  window.scrollTo(0, 0);
}

/* ── Conexiones ──────────────────────────────────────────────── */
$('btn-start').onclick = async () => {
  $('intro-error').hidden = true;
  if (!await startCamera()) return;
  show('stage');
  if (FILTERS[filterIx].needs) preload(FILTERS[filterIx].needs);
  if (!detector && arState === 'load') loadDetector();
};

/* ── Obturador: toque = foto, mantener = video ────────────────── */
const shutter = $('shutter');
let holdTimer = 0, held = false;

async function runShot() {
  if (busy) return;
  busy = true; shutter.disabled = true;
  try {
    if (mode === 'strip') { await captureStrip(); }
    else                  { await countdown(3); flash(); await capturePhoto(); }
  } catch (e) {
    console.warn(e); toast(t('sharefail'));
  }
  busy = false; shutter.disabled = false;
}

shutter.addEventListener('pointerdown', e => {
  if (busy) return;
  e.preventDefault();
  held = false;
  /* En modo tira el gesto largo no aplica: siempre son 4 fotos. */
  if (mode === 'strip' || !recMime) return;
  holdTimer = setTimeout(() => { held = true; startRec(); }, HOLD_MS);
});

async function endHold(e) {
  if (e) e.preventDefault();
  clearTimeout(holdTimer);
  if (held) { held = false; busy = true; shutter.disabled = true; await stopRec(); busy = false; shutter.disabled = false; }
  else if (!recorder) { runShot(); }
}
shutter.addEventListener('pointerup', endHold);
shutter.addEventListener('pointercancel', endHold);
/* Si el dedo se sale del botón, el pointerup ya no llega al elemento:
   sin esto la grabación se quedaría corriendo para siempre. */
shutter.addEventListener('lostpointercapture', endHold);
window.addEventListener('pointerup', () => { if (held || recorder) endHold(); });

document.querySelectorAll('#modes button').forEach(b => {
  b.onclick = () => {
    if (busy) return;
    mode = b.dataset.mode;
    buildModes();
    if (mode === 'strip') toast(t('stripHint'));
  };
});

$('btn-timer').onclick = () => {
  timerOn = !timerOn;
  $('btn-timer').classList.toggle('on', timerOn);
  $('btn-timer').textContent = timerOn ? '3s' : 'off';
};

$('btn-flip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  if (!await startCamera()) { facing = facing === 'user' ? 'environment' : 'user'; await startCamera(); }
};

$('btn-share').onclick = share;
$('btn-save').onclick  = () => toast(t('saved'));
$('btn-again').onclick = () => show('stage');

/* Soltar la cámara al esconder o cerrar la página: si no, el LED sigue
   encendido y algunos teléfonos no la prestan de vuelta. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && raf) { cancelAnimationFrame(raf); raf = 0; }
  else if (!document.hidden && !$('stage').hidden && !raf) raf = requestAnimationFrame(loop);
});
window.addEventListener('pagehide', () => { if (stream) stream.getTracks().forEach(tr => tr.stop()); });

/* Las fuentes deben estar listas antes del primer texto en canvas, o el
   marco sale con la tipografía de respaldo. */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitViewport).catch(() => {});

recMime = pickMime();
setLang(lang);
$('btn-timer').textContent = 'off';
</script>
</body>
