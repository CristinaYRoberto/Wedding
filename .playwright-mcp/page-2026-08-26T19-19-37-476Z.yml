          - text: ¿Dónde se realiza la ceremonia religiosa?
          - generic [ref=e340]: +
        - generic: La misa se celebrará en la Catedral de Hermosillo, ubicada en Blvr. Miguel Hidalgo S/N, Centro Norte, 83000 Hermosillo, Sonora. El inicio es a las 12:00 PM. Te recomendamos llegar con 15 minutos de anticipación.
      - generic [ref=e341] [cursor=pointer]:
