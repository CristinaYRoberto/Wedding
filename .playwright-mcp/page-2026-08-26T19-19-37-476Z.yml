          - generic [ref=e352]: +
        - generic: "Vestimenta formal. Para caballeros: traje sastre clásico en negro, gris o azul marino, con corbata o pañuelo de cualquier color menos blanco. Para damas: vestido largo o de cóctel. Te pedimos evitar blanco, gris, dorado y negro, reservados para los novios y la decoración. Consulta la sección \"Dress Code\" para más detalles."
      - generic [ref=e353] [cursor=pointer]:
