        - generic: El número de invitados por mesa está cuidadosamente planificado. Los acompañantes ya fueron asignados con anterioridad, por favor no incluir a nadie extra ya que si no se encuentra en la lista no se le permitirá la entrada por cuestiones de logística. Si tienes alguna duda, escríbenos con gusto.
      - generic [ref=e356] [cursor=pointer]:
