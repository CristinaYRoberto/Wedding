          - text: ¿Dónde es la recepción y a qué hora?
          - generic [ref=e343]: +
        - generic: La recepción tendrá lugar en el Salón Las Cascadas, ubicado en Los Molinos 97, Las Minitas, 83285 Hermosillo, Sonora, a partir de las 7:00 PM. Puedes consultar la ubicación exacta en el mapa de esta página.
      - generic [ref=e344] [cursor=pointer]:
        - generic [ref=e345]:
          - text: ¿Hay estacionamiento disponible?
