    - paragraph [ref=f2e334]: PREGUNTAS FRECUENTES
    - heading "Todo lo que necesitas saber" [level=2] [ref=f2e335]: Todo lo quenecesitas saber
    - generic [ref=f2e337]:
      - generic [ref=f2e338] [cursor=pointer]:
        - generic [ref=f2e339]:
          - text: ¿Dónde se realiza la ceremonia religiosa?
          - generic [ref=f2e340]: +
        - generic: La misa se celebrará en la Catedral de Hermosillo, ubicada en Blvr. Miguel Hidalgo S/N, Centro Norte, 83000 Hermosillo, Sonora. El inicio es a las 12:00 PM. Te recomendamos llegar con 15 minutos de anticipación.
      - generic [ref=f2e341] [cursor=pointer]:
        - generic [ref=f2e342]:
          - text: ¿Dónde es la recepción y a qué hora?
          - generic [ref=f2e343]: +
        - generic: La recepción tendrá lugar en el Salón Las Cascadas, ubicado en Los Molinos 97, Las Minitas, 83285 Hermosillo, Sonora, a partir de las 7:00 PM. Puedes consultar la ubicación exacta en el mapa de esta página.
      - generic [ref=f2e344] [cursor=pointer]:
        - generic [ref=f2e345]:
          - text: ¿Hay estacionamiento disponible?
          - generic [ref=f2e346]: +
        - generic: Sí. La Catedral cuenta con estacionamiento en la zona del centro y calles aledañas. El Salón Las Cascadas dispone de estacionamiento privado gratuito para los invitados.
      - generic [ref=f2e347] [cursor=pointer]:
        - generic [ref=f2e348]:
          - text: ¿Se permiten niños?
          - generic [ref=f2e349]: +
        - generic: La celebración es exclusiva para adultos. Estrictamente no niños. Agradecemos de antemano tu comprensión.
      - generic [ref=f2e350] [cursor=pointer]:
        - generic [ref=f2e351]:
          - text: ¿Cuál es el código de vestimenta?
          - generic [ref=f2e352]: +
        - generic: "Vestimenta formal. Para caballeros: traje sastre clásico en negro, gris o azul marino, con corbata o pañuelo de cualquier color menos blanco. Para damas: vestido largo o de cóctel. Te pedimos evitar blanco, gris, dorado y negro, reservados para los novios y la decoración. Consulta la sección \"Dress Code\" para más detalles."
      - generic [ref=f2e353] [cursor=pointer]:
        - generic [ref=f2e354]:
          - text: ¿Puedo llevar acompañante?
          - generic [ref=f2e355]: +
        - generic: El número de invitados por mesa está cuidadosamente planificado. Los acompañantes ya fueron asignados con anterioridad, por favor no incluir a nadie extra ya que si no se encuentra en la lista no se le permitirá la entrada por cuestiones de logística. Si tienes alguna duda, escríbenos con gusto.
      - generic [ref=f2e356] [cursor=pointer]:
        - generic [ref=f2e357]:
          - text: ¿Hasta cuándo puedo confirmar mi asistencia?
          - generic [ref=f2e358]: +
        - generic: Te pedimos confirmar antes del 01 de septiembre de 2026. Después de esa fecha no podremos garantizar lugar, ya que la lista de invitados estará cerrada.
      - generic [ref=f2e359] [cursor=pointer]:
        - generic [ref=f2e360]:
          - text: ¿Cómo puedo hacer llegar un regalo?
          - generic [ref=f2e361]: +
        - generic: Contamos con opción de transferencia bancaria y buzón de efectivo en la recepción. Consulta la sección "Regalos" en esta misma página para ver todos los detalles.
