  - generic [ref=f2e184]:
    - paragraph [ref=f2e185]: NUESTRA HISTORIA
    - paragraph [ref=f2e187]: Cristina y Roberto se encontraron cuando menos lo esperaban y desde entonces han construido juntos una historia llena de amor, risas y aventuras. Junto a su hija Valentina y sus tres gatitos, Iker, Pilly y Finch, han formado una pequeña familia con grandes vínculos y mucho amor. Hoy, con el corazón lleno de gratitud, los invitan a ser testigos del capítulo más hermoso de su vida.
    - generic [ref=f2e188]:
      - generic: “
      - paragraph [ref=f2e189]: Cuando dos almas destinadas a encontrarse se unen, crean un universo propio donde el amor transforma, expande y da un nuevo sentido a la vida.Dos almas, una nueva realidad, un universo compartido.
